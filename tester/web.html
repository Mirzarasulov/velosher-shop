<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Эры — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1216; --card:#171c23; --card2:#1e242d;
    --border:#242c37; --text:#e8edf3; --muted:#8a94a3;
    --accent:#4f8cff; --accent2:#356fd8;
    --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;min-height:100vh}
  .app{max-width:520px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
  h1,h2,h3{margin:0 0 12px;font-weight:600;letter-spacing:-0.01em}
  h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .card2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .btn{display:inline-block;width:100%;padding:14px 16px;border-radius:12px;border:0;
    background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer;
    transition:opacity .15s;text-align:center}
  .btn:active{opacity:.8}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.danger{background:var(--err)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:10px 14px;font-size:14px;width:auto}
  .input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:15px;outline:none}
  .input:focus{border-color:var(--accent)}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .badge.awaiting_payment{background:#3a2f10;color:var(--warn)}
  .badge.active{background:#0f3a26;color:var(--ok)}
  .badge.completed{background:#1a2e4a;color:var(--info)}
  .badge.awaiting_payout{background:#3a2f10;color:var(--warn)}
  .badge.paid{background:#0f3a26;color:var(--ok)}
  .badge.cancelled{background:#3a1010;color:var(--err)}
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--border);display:flex;justify-content:space-around;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50;max-width:520px;margin:0 auto}
  .nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:6px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
  .nav button.active{color:var(--accent)}
  .nav .ico{font-size:18px}
  .hidden{display:none !important}
  .center{text-align:center}
  .stat{background:var(--card2);padding:12px;border-radius:12px}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}
  .stat .l{font-size:11px;color:var(--muted)}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border);padding:12px 18px;border-radius:12px;
    font-size:14px;z-index:999;max-width:90%;text-align:center}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #fff5;
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hero{background:linear-gradient(135deg,#1f2937,#111827);border-radius:16px;padding:20px;margin-bottom:14px;
    border:1px solid var(--border)}
  .era-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .era-card .price{font-size:22px;font-weight:700;color:var(--accent)}
  .era-card .profit{color:var(--ok);font-weight:600}
  img.marketing{width:100%;border-radius:12px;display:block}
  a{color:var(--accent)}
  .list-item{padding:12px 0;border-bottom:1px solid var(--border)}
  .list-item:last-child{border-bottom:0}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--card2);display:flex;
    align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);
    border:2px solid var(--border);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .dev-info{background:#1a1e26;border:1px dashed #3a4453;border-radius:10px;padding:10px;
    font-size:12px;color:#8a94a3;margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="loading" class="center" style="padding:60px 0">
    <div class="spinner" style="border-color:var(--accent) #0000 var(--accent) #0000;width:32px;height:32px"></div>
    <div class="muted" style="margin-top:12px">Загрузка…</div>
  </div>
</div>

<nav class="nav hidden" id="nav">
  <button data-tab="home"><span class="ico">🏠</span>Главная</button>
  <button data-tab="buy"><span class="ico">🛒</span>Купить</button>
  <button data-tab="purchases"><span class="ico">📦</span>Покупки</button>
  <button data-tab="referrals"><span class="ico">👥</span>Рефералы</button>
  <button data-tab="profile"><span class="ico">👤</span>Профиль</button>
</nav>

<div id="toast" class="toast hidden"></div>

<script>
// ============================================================
// ⚙️ НАСТРОЙКИ — ЗАМЕНИТЕ ПОД СЕБЯ
// ============================================================

// 1️⃣ API: адрес вашего backend (ngrok или Render)
//    Локально: http://localhost:8000
//    Ngrok:    https://xxxx-xx-xx.ngrok-free.app
const API = localStorage.getItem('api_url') || 'http://localhost:8000';

// 2️⃣ Username вашего Telegram-бота БЕЗ @ (для fallback-логина)
const BOT_USERNAME = 'loadingtester1botE';  // ⬅️ ЗАМЕНИТЕ! Например: 'EraProjectBot'

// ============================================================

let TOKEN = localStorage.getItem('token') || '';
let ME = null;

function toast(msg, ms=2500){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.add('hidden'), ms);
}

async function api(path, opts={}){
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  // Обход ngrok-заглушки
  headers['ngrok-skip-browser-warning'] = 'true';
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API + path, {...opts, headers});
  if (res.status === 401){ logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || 'Ошибка');
  return data;
}

function logout(){
  localStorage.removeItem('token');
  TOKEN = ''; ME = null;
  location.reload();
}

// ============================================================
// АВТОРИЗАЦИЯ ЧЕРЕЗ TELEGRAM WEBAPP
// ============================================================
async function tryTelegramAuth(){
  const tg = window.Telegram?.WebApp;

  console.log('[WebApp] initData:', tg?.initData);
  console.log('[WebApp] initDataUnsafe:', tg?.initDataUnsafe);

  if (!tg) {
    console.warn('[WebApp] Telegram WebApp объект недоступен');
    return { ok: false, reason: 'no_tg' };
  }

  tg.ready();
  tg.expand();

  if (!tg.initDataUnsafe?.user) {
    console.warn('[WebApp] Нет user в initDataUnsafe — страница открыта не через Telegram');
    return { ok: false, reason: 'no_user' };
  }

  const u = tg.initDataUnsafe.user;
  const urlRef = new URLSearchParams(location.search).get('ref') || '';

  try {
    const res = await api('/api/auth/telegram', {
      method: 'POST',
      body: {
        id: u.id,
        first_name: u.first_name || '',
        last_name: u.last_name || '',
        username: u.username || '',
        photo_url: u.photo_url || '',
        auth_date: tg.initDataUnsafe.auth_date || 0,
        hash: tg.initDataUnsafe.hash || '',
        ref: urlRef
      }
    });
    TOKEN = res.token;
    localStorage.setItem('token', TOKEN);
    return { ok: true };
  } catch(e) {
    console.error('[WebApp] Auth error:', e);
    return { ok: false, reason: 'api_error', error: e.message };
  }
}

// ============================================================
// РОУТЕР
// ============================================================
let currentTab = 'home';
function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  setTab(b.dataset.tab);
});

// ============================================================
// ЭКРАН АВТОРИЗАЦИИ
// ============================================================
function screenAuth(reason=''){
  document.getElementById('nav').classList.add('hidden');

  const hint = reason === 'no_tg'
    ? 'Страница открыта вне Telegram. Откройте её через кнопку в боте.'
    : reason === 'no_user'
    ? 'Telegram не передал данные пользователя. Откройте страницу заново через бота.'
    : '';

  document.getElementById('app').innerHTML = `
    <div class="hero center">
      <h1>Проект «Эры»</h1>
      <div class="muted">Войдите через Telegram, чтобы начать</div>
    </div>

    <div class="card">
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:52px;margin-bottom:8px">📱</div>
        <h3>Вход через Telegram</h3>
        <p class="muted" style="margin:8px 0 16px">
          Нажмите кнопку ниже и подтвердите вход
        </p>
      </div>

      <div id="tg-login-widget" style="display:flex;justify-content:center"></div>

      ${hint ? `<div class="dev-info">💡 ${hint}</div>` : ''}

      <div class="dev-info" style="margin-top:16px">
        <b>Отладка:</b><br>
        API: ${esc(API)}<br>
        Бот: @${esc(BOT_USERNAME)}<br>
        ${window.Telegram?.WebApp ? '✅ Telegram WebApp доступен' : '❌ Telegram WebApp недоступен'}
      </div>
    </div>

    <div class="card">
      <h3>Как войти правильно</h3>
      <ol class="muted" style="padding-left:18px;line-height:1.7">
        <li>Откройте бота @${esc(BOT_USERNAME)} в Telegram</li>
        <li>Нажмите <b>/start</b></li>
        <li>Нажмите кнопку <b>«🚀 Открыть приложение»</b></li>
      </ol>
    </div>
  `;

  // Telegram Login Widget (fallback для браузера)
  if (BOT_USERNAME && BOT_USERNAME !== 'YOUR_BOT_USERNAME') {
    const container = document.getElementById('tg-login-widget');
    const script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.setAttribute('data-telegram-login', BOT_USERNAME);
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    container.appendChild(script);
  } else {
    document.getElementById('tg-login-widget').innerHTML =
      '<div class="muted">⚠️ Укажите BOT_USERNAME в коде для входа через браузер</div>';
  }
}

window.onTelegramAuth = async function(user){
  const urlRef = new URLSearchParams(location.search).get('ref') || '';
  try {
    const res = await api('/api/auth/telegram', {
      method: 'POST',
      body: {...user, ref: urlRef}
    });
    TOKEN = res.token;
    localStorage.setItem('token', TOKEN);
    location.reload();
  } catch(e){
    toast('Ошибка входа: ' + e.message);
  }
};

// ============================================================
// ГЛАВНАЯ
// ============================================================
async function screenHome(){
  const [me, purchases] = await Promise.all([
    api('/api/me'), api('/api/purchases/my')
  ]);
  ME = me;

  const active = purchases.filter(p=>p.status==='active');
  const expected = purchases.filter(p=>['active','completed'].includes(p.status))
    .reduce((s,p)=>s+Number(p.profit_amount||0),0);
  const available = purchases.filter(p=>p.status==='completed')
    .reduce((s,p)=>s+Number(p.total_amount||0),0);
  const refLink = `${location.origin}${location.pathname}?ref=${me.referral_code}`;

  const displayName = me.first_name || me.telegram_username || 'друг';
  const initial = (displayName[0] || '👤').toUpperCase();

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="row">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="avatar">
            ${me.photo_url ? `<img src="${esc(me.photo_url)}" alt="">` : initial}
          </div>
          <div>
            <div class="muted">Привет,</div>
            <h1 style="margin:0">${esc(displayName)} 👋</h1>
            ${me.telegram_username ? `<div class="muted">@${esc(me.telegram_username)}</div>` : ''}
          </div>
        </div>
        <div class="badge active">${me.status}</div>
      </div>
    </div>

    <div class="grid2">
      <div class="stat"><div class="l">Активных эр</div><div class="v">${active.length}</div></div>
      <div class="stat"><div class="l">Всего покупок</div><div class="v">${purchases.length}</div></div>
      <div class="stat"><div class="l">Ожид. начисления</div><div class="v">${fmt(expected)}</div></div>
      <div class="stat"><div class="l">Доступно к выводу</div><div class="v">${fmt(available)}</div></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>🔗 Ваша реферальная ссылка</h3>
      <div class="card2" style="word-break:break-all;font-size:13px">${esc(refLink)}</div>
      <button class="btn secondary btn-sm" onclick="copyRef('${refLink}')" style="margin-top:8px">Скопировать</button>
      <div class="muted" style="margin-top:8px">Приглашено: ${me.invited_count}</div>
    </div>

    ${active.length ? `
      <h3 style="margin-top:16px">Активные эры</h3>
      ${active.map(p=>eraCard(p)).join('')}
    ` : `
      <div class="card center" style="margin-top:12px">
        <div class="muted">У вас пока нет активных эр</div>
        <button class="btn" style="margin-top:12px" onclick="setTab('buy')">Выбрать эру</button>
      </div>
    `}
  `;
}

function eraCard(p){
  return `
    <div class="era-card">
      <div class="row">
        <h3>${esc(p.era_title)}</h3>
        <span class="badge ${p.status}">${statusLabel(p.status)}</span>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="stat"><div class="l">Стоимость</div><div class="v">${fmt(p.purchase_price)}</div></div>
        <div class="stat"><div class="l">Начисление</div><div class="v profit">+${fmt(p.profit_amount)}</div></div>
        <div class="stat"><div class="l">Итого</div><div class="v">${fmt(p.total_amount)}</div></div>
        <div class="stat"><div class="l">Осталось</div><div class="v">${p.days_left} дн.</div></div>
      </div>
      <div class="muted" style="margin-top:10px;font-size:12px">
        ${p.activated_at ? 'Активирована: '+fmtDate(p.activated_at)+'<br>' : ''}
        ${p.expires_at ? 'Завершение: '+fmtDate(p.expires_at) : ''}
      </div>
      ${p.status==='completed' ? `<button class="btn" style="margin-top:10px" onclick="requestPayout(${p.id})">Подать заявку на вывод</button>` : ''}
    </div>
  `;
}

async function screenBuy(){
  const me = await api('/api/me'); ME = me;
  const eras = await api('/api/eras');
  if (!me.agreed_terms){
    document.getElementById('app').innerHTML = `
      <h1>Условия участия</h1>
      <div class="card">
        <div style="white-space:pre-wrap;font-size:14px" id="terms">Загрузка…</div>
        <button class="btn" style="margin-top:14px" onclick="agreeTerms()">Я согласен и подтверждаю</button>
      </div>
    `;
    const c = await api('/api/content/terms_text');
    document.getElementById('terms').textContent = c.value || '';
    return;
  }
  document.getElementById('app').innerHTML = `
    <h1>Купить эру</h1>
    <div class="muted" style="margin-bottom:12px">Выберите одну из 7 доступных эр</div>
    ${eras.map(e=>`
      <div class="era-card">
        <div class="row">
          <h3>${esc(e.title)}</h3>
          <div class="price">${fmt(e.price)}</div>
        </div>
        <div class="muted" style="margin:6px 0 10px">${esc(e.description||'')}</div>
        <div class="grid3">
          <div class="stat center"><div class="l">Срок</div><div class="v">${e.duration_days} дн.</div></div>
          <div class="stat center"><div class="l">Начисл.</div><div class="v profit">+${fmt(e.profit_amount)}</div></div>
          <div class="stat center"><div class="l">Итого</div><div class="v">${fmt(e.total_amount)}</div></div>
        </div>
        <button class="btn" style="margin-top:12px" onclick="buyEra(${e.id})">Подать заявку на покупку</button>
      </div>
    `).join('')}
  `;
}

async function screenPurchases(){
  const list = await api('/api/purchases/my');
  document.getElementById('app').innerHTML = `
    <h1>Мои покупки</h1>
    ${list.length ? list.map(p=>eraCard(p)).join('') :
      '<div class="card center muted">Покупок пока нет</div>'}
  `;
}

async function screenReferrals(){
  const [me, list] = await Promise.all([api('/api/me'), api('/api/referrals')]);
  const link = `${location.origin}${location.pathname}?ref=${me.referral_code}`;
  document.getElementById('app').innerHTML = `
    <h1>Мои приглашённые</h1>
    <div class="card">
      <div class="muted">Реферальная ссылка</div>
      <div class="card2" style="word-break:break-all;font-size:13px;margin-top:6px">${esc(link)}</div>
      <button class="btn secondary btn-sm" style="margin-top:8px" onclick="copyRef('${link}')">Скопировать</button>
      <div class="muted" style="margin-top:8px">Всего приглашено: <b>${list.length}</b></div>
    </div>
    <div class="card">
      ${list.length ? list.map(u=>`
        <div class="list-item row">
          <div>
            <div><b>${esc(u.first_name||'Пользователь')}</b></div>
            <div class="muted">@${esc(u.telegram_username||'—')} · ${fmtDate(u.registered_at)}</div>
          </div>
          <div class="center">
            <div class="badge active">${u.purchases_count} покупок</div>
          </div>
        </div>
      `).join('') : '<div class="muted center">Пока никого нет</div>'}
    </div>
  `;
}

async function screenProfile(){
  const me = await api('/api/me');
  const displayName = me.first_name || me.telegram_username || 'Пользователь';
  const initial = (displayName[0] || '👤').toUpperCase();
  document.getElementById('app').innerHTML = `
    <h1>Профиль</h1>
    <div class="card" style="text-align:center">
      <div class="avatar" style="width:80px;height:80px;font-size:34px;margin:0 auto 12px">
        ${me.photo_url ? `<img src="${esc(me.photo_url)}" alt="">` : initial}
      </div>
      <h2 style="margin:0">${esc(displayName)}</h2>
      ${me.telegram_username ? `<div class="muted">@${esc(me.telegram_username)}</div>` : ''}
    </div>
    <div class="card">
      <div class="list-item row"><span class="muted">ID</span><span>${me.id}</span></div>
      <div class="list-item row"><span class="muted">Telegram ID</span><span>${me.telegram_id}</span></div>
      <div class="list-item row"><span class="muted">Username</span><span>@${esc(me.telegram_username||'—')}</span></div>
      <div class="list-item row"><span class="muted">Имя</span><span>${esc(me.first_name||'')} ${esc(me.last_name||'')}</span></div>
      <div class="list-item row"><span class="muted">Реферер</span><span>${me.referrer ? '@'+esc(me.referrer.username||me.referrer.first_name) : '—'}</span></div>
      <div class="list-item row"><span class="muted">Регистрация</span><span>${fmtDate(me.registered_at)}</span></div>
      <div class="list-item row"><span class="muted">Условия</span><span>${me.agreed_terms ? '✅' : '❌'}</span></div>
    </div>
    <div class="card">
      <h3>Информация</h3>
      <button class="btn secondary" style="margin-bottom:8px" onclick="showContent('rules_text','Правила проекта')">Правила проекта</button>
      <button class="btn secondary" style="margin-bottom:8px" onclick="showContent('terms_text','Условия участия')">Условия участия</button>
      <button class="btn secondary" onclick="showMarketing()">Маркетинг</button>
    </div>
    <button class="btn ghost" onclick="logout()">Выйти</button>
  `;
}

async function showContent(key, title){
  const c = await api('/api/content/'+key);
  document.getElementById('app').innerHTML = `
    <button class="btn ghost btn-sm" onclick="setTab('${currentTab}')">← Назад</button>
    <h1 style="margin-top:12px">${title}</h1>
    <div class="card"><div style="white-space:pre-wrap">${esc(c.value||'')}</div></div>
  `;
}

async function showMarketing(){
  const c = await api('/api/content/marketing_image');
  document.getElementById('app').innerHTML = `
    <button class="btn ghost btn-sm" onclick="setTab('${currentTab}')">← Назад</button>
    <h1 style="margin-top:12px">Маркетинг</h1>
    <div class="card">
      ${c.value ? `<img class="marketing" src="${API}${c.value}" alt="">` : '<div class="muted center">Изображение пока не добавлено</div>'}
    </div>
  `;
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
async function agreeTerms(){
  try { await api('/api/agree', {method:'POST'}); toast('Условия подтверждены'); render(); }
  catch(e){ toast(e.message); }
}

async function buyEra(id){
  if (!confirm('Создать заявку на покупку?')) return;
  try {
    await api('/api/purchases/create/'+id, {method:'POST'});
    toast('Заявка создана. Ожидайте связи администратора.');
    setTab('purchases');
  } catch(e){ toast(e.message); }
}

async function requestPayout(pid){
  if (!confirm('Подать заявку на вывод?')) return;
  try {
    await api('/api/payouts/request/'+pid, {method:'POST'});
    toast('Заявка на вывод создана');
    render();
  } catch(e){ toast(e.message); }
}

function copyRef(text){
  navigator.clipboard.writeText(text).then(()=>toast('Скопировано'));
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try {
    const d = new Date(s);
    return d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'});
  } catch { return s; }
}
function statusLabel(s){
  return ({
    awaiting_payment:'Ожидает оплаты', active:'Активен',
    completed:'Завершён', awaiting_payout:'Ожидает выплаты',
    paid:'Выплачен', cancelled:'Отменён'
  })[s] || s;
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
async function render(){
  try {
    if (!TOKEN) {
      const result = await tryTelegramAuth();
      if (!result.ok){
        screenAuth(result.reason);
        return;
      }
    }
    document.getElementById('nav').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    const routes = {
      home: screenHome, buy: screenBuy, purchases: screenPurchases,
      referrals: screenReferrals, profile: screenProfile
    };
    await routes[currentTab]();
  } catch(e){
    console.error(e);
    if (e.message === 'Unauthorized'){ screenAuth(); return; }
    toast(e.message || 'Ошибка');
  }
}

render();
setInterval(()=>{ if (TOKEN && ['home','purchases'].includes(currentTab)) render(); }, 30000);
</script>
