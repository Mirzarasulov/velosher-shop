<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>Эры — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0a0e14; --card:#131820; --card2:#1a212c; --card3:#232b38;
    --border:#252e3a; --border2:#2f3a48;
    --text:#e8edf3; --text2:#c4ccd6; --muted:#7a8595;
    --accent:#4f8cff; --accent2:#356fd8; --accent-glow:rgba(79,140,255,.35);
    --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;
    overflow-x:hidden}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:280px;
    background:radial-gradient(circle at 50% 0%,rgba(79,140,255,.15),transparent 60%);
    pointer-events:none;z-index:0}
  .app{max-width:560px;margin:0 auto;padding:0 16px 110px;position:relative;z-index:1}

  .topbar{position:sticky;top:0;z-index:40;background:rgba(10,14,20,.88);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);margin:0 -16px 16px;padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .topbar .brand .logo{width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#7b5cff);display:flex;
    align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 4px 14px var(--accent-glow)}
  .topbar .actions{display:flex;gap:8px;align-items:center}
  .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
    background:var(--card2);color:var(--text2);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .icon-btn:active{transform:scale(.94)}

  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
  h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
  h3{font-size:15px;font-weight:600}
  .muted{color:var(--muted);font-size:13px}
  .muted-sm{color:var(--muted);font-size:11px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .card2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px}

  .hero{background:linear-gradient(135deg,#1a2540 0%,#161b26 100%);
    border:1px solid var(--border2);border-radius:18px;padding:20px;
    margin-bottom:16px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:-50%;right:-30%;width:280px;height:280px;
    background:radial-gradient(circle,rgba(79,140,255,.25),transparent 70%);pointer-events:none}
  .hero .row{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
  .hero .user{display:flex;gap:14px;align-items:center;min-width:0;flex:1}
  .avatar{width:56px;height:56px;border-radius:50%;background:var(--card3);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
    color:var(--accent);border:2px solid var(--border2);overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar.lg{width:88px;height:88px;font-size:36px}
  .hero .info{min-width:0;flex:1}
  .hero .info h1{font-size:20px;margin-bottom:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .hero .info .sub{color:var(--text2);font-size:13px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:14px}
  .stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;margin-bottom:6px}
  .stat .value{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .stat .value.sm{font-size:18px}
  .stat .value.ok{color:var(--ok)}
  .stat .value.accent{color:var(--accent)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:14px 18px;border-radius:12px;border:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-weight:600;font-size:15px;cursor:pointer;
    transition:transform .12s;text-align:center;font-family:inherit;
    box-shadow:0 4px 14px var(--accent-glow)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2);box-shadow:none}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);box-shadow:none}
  .btn.success{background:linear-gradient(135deg,#39d98a,#22a86b);box-shadow:0 4px 14px rgba(57,217,138,.3)}
  .btn.sm{padding:10px 14px;font-size:13px;border-radius:10px;width:auto}
  .btn.xs{padding:7px 12px;font-size:12px;border-radius:8px;width:auto}

  .era-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:0;margin-bottom:14px;overflow:hidden;position:relative}
  .era-card .head{padding:18px 18px 14px;
    background:linear-gradient(135deg,var(--card2),var(--card));
    border-bottom:1px solid var(--border);position:relative;overflow:hidden}
  .era-card .head::before{content:'';position:absolute;top:-40%;right:-20%;
    width:180px;height:180px;
    background:radial-gradient(circle,var(--era-glow,rgba(79,140,255,.2)),transparent 70%)}
  .era-card .head .row{display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;position:relative}
  .era-card .title-wrap{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
  .era-card .icon{width:48px;height:48px;border-radius:14px;display:flex;
    align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
    background:var(--card3);border:1px solid var(--border2)}
  .era-card .name{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .era-card .tier{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;font-weight:600;margin-top:2px}
  .era-card .body{padding:16px 18px}
  .era-card .desc{color:var(--text2);font-size:13px;margin-bottom:14px;line-height:1.5}
  .era-card .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .metric{background:var(--card2);border-radius:10px;padding:10px 8px;
    text-align:center;border:1px solid var(--border)}
  .metric .l{color:var(--muted);font-size:10px;text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;margin-bottom:4px}
  .metric .v{font-size:14px;font-weight:700}
  .metric .v.profit{color:var(--ok)}
  .metric .v.total{color:var(--accent)}
  .era-card .actions{padding:0 18px 18px;display:flex;gap:8px}
  .era-card .actions .btn{flex:1}
  .badge-tier{position:absolute;top:14px;right:14px;padding:4px 10px;
    border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;z-index:2}
  .badge-tier.starter{background:rgba(99,169,255,.15);color:#63a9ff;
    border:1px solid rgba(99,169,255,.3)}
  .badge-tier.middle{background:rgba(79,140,255,.15);color:#4f8cff;
    border:1px solid rgba(79,140,255,.3)}
  .badge-tier.premium{background:rgba(255,209,102,.15);color:#ffd166;
    border:1px solid rgba(255,209,102,.3)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
    border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;white-space:nowrap}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.awaiting_payment{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.active{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.completed{background:rgba(99,169,255,.15);color:var(--info)}
  .badge.awaiting_payout{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.cancelled{background:rgba(255,92,92,.15);color:var(--err)}

  .searchbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
  .search-input{flex:1;padding:12px 14px;border-radius:12px;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    font-size:14px;outline:none;font-family:inherit}
  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:20px;background:var(--card2);
    border:1px solid var(--border);color:var(--text2);font-size:13px;
    font-weight:600;cursor:pointer;white-space:nowrap;
    font-family:inherit;flex-shrink:0}
  .chip:active{transform:scale(.95)}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(19,24,32,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);display:flex;justify-content:space-around;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:50;
    max-width:560px;margin:0 auto}
  .nav button{background:none;border:0;color:var(--muted);font-size:11px;
    padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;
    cursor:pointer;flex:1;font-family:inherit;font-weight:600}
  .nav button.active{color:var(--accent)}
  .nav button .ico{font-size:20px;line-height:1}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
    display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;
    max-width:560px;max-height:88vh;overflow-y:auto;
    border:1px solid var(--border2);border-bottom:0}
  .modal-head{position:sticky;top:0;
    background:linear-gradient(135deg,var(--card2),var(--card));
    padding:20px;border-bottom:1px solid var(--border);z-index:1;
    display:flex;justify-content:space-between;align-items:center}
  .modal-body{padding:20px}
  .close-x{width:34px;height:34px;border-radius:50%;background:var(--card3);
    border:1px solid var(--border2);color:var(--text2);font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center}

  .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .hidden{display:none !important}
  .center{text-align:center}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border2);padding:12px 18px;
    border-radius:12px;font-size:13px;font-weight:500;z-index:999;
    max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .spinner{display:inline-block;width:14px;height:14px;
    border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
    border-radius:50%;animation:sp .65s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .skeleton{background:linear-gradient(90deg,var(--card2) 25%,var(--card3) 50%,var(--card2) 75%);
    background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:10px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  img.marketing{width:100%;border-radius:12px;display:block}
  a{color:var(--accent);text-decoration:none}
  .list-item{padding:14px 0;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .list-item:last-child{border-bottom:0}

  .empty{padding:44px 20px;text-align:center}
  .empty .icon{font-size:52px;margin-bottom:12px;opacity:.5}

  .progress{height:8px;background:var(--card3);border-radius:4px;
    overflow:hidden;margin-top:8px}
  .progress .fill{height:100%;border-radius:4px;transition:width .4s ease;
    background:linear-gradient(90deg,var(--accent),#7b5cff)}
  .progress .fill.ok{background:linear-gradient(90deg,#39d98a,#22a86b)}
  .progress .fill.warn{background:linear-gradient(90deg,#f5b547,#e09a2e)}
  .progress .fill.err{background:linear-gradient(90deg,#ff5c5c,#d63a3a)}

  .ref-box{background:var(--card2);border:1px solid var(--border2);
    border-radius:12px;padding:12px 14px;font-size:13px;
    font-family:ui-monospace,monospace;word-break:break-all;
    color:var(--text2);line-height:1.5}

  .order-num{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
    background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.25);
    border-radius:8px;font-size:11px;font-weight:700;color:var(--accent);
    letter-spacing:.03em;margin-bottom:8px}

  .days-left{padding:6px 12px;border-radius:10px;font-size:12px;
    font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .days-left.ok{background:rgba(57,217,138,.15);color:var(--ok)}
  .days-left.warn{background:rgba(245,181,71,.15);color:var(--warn)}
  .days-left.err{background:rgba(255,92,92,.15);color:var(--err)}
  .days-left.info{background:rgba(99,169,255,.15);color:var(--info)}

  .menu-item{display:flex;align-items:center;justify-content:space-between;
    padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;
    transition:padding-left .12s}
  .menu-item:last-child{border-bottom:0}
  .menu-item:active{padding-left:6px}
  .menu-item .left{display:flex;align-items:center;gap:14px}
  .menu-item .emo{width:40px;height:40px;border-radius:11px;display:flex;
    align-items:center;justify-content:center;font-size:19px;
    background:var(--card2);border:1px solid var(--border)}
  .menu-item .arrow{color:var(--muted)}

  .contact-btn{display:flex;align-items:center;gap:14px;padding:16px;
    background:var(--card2);border:1px solid var(--border);
    border-radius:12px;cursor:pointer;text-decoration:none;color:var(--text);
    margin-bottom:10px}
  .contact-btn:active{transform:scale(.98)}
  .contact-btn .emo{width:46px;height:46px;border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent),#7b5cff);color:#fff;flex-shrink:0}
  .contact-btn.tg .emo{background:linear-gradient(135deg,#2aabee,#229ed9)}
  .contact-btn .info{flex:1;min-width:0}
  .contact-btn .info .t{font-weight:600;font-size:14px;margin-bottom:2px}
  .contact-btn .info .s{font-size:12px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div class="app" id="app">
  <div id="loading" class="center" style="padding:80px 0">
    <div class="spinner" style="border-color:var(--accent) #0000 var(--accent) #0000;width:36px;height:36px;border-width:3px"></div>
    <div class="muted" style="margin-top:16px">Загрузка…</div>
  </div>
</div>

<nav class="nav hidden" id="nav">
  <button data-tab="home"><span class="ico">🏠</span>Главная</button>
  <button data-tab="buy"><span class="ico">🛒</span>Купить</button>
  <button data-tab="purchases"><span class="ico">📦</span>Покупки</button>
  <button data-tab="profile"><span class="ico">👤</span>Профиль</button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script>
// ============================================================
// НАСТРОЙКИ
// ============================================================
const API = 'http://localhost:8000';   // ⬅️ ЗАМЕНИТЕ на ваш ngrok URL
const BOT_USERNAME = 'loadingtester1bot';
const ADMIN_USERNAME = 'loadingtester1bot';
const CACHE_TTL = 60000; // 60 секунд кэш
// ============================================================

let TOKEN = localStorage.getItem('token') || '';
let ME = null;
let CURRENT_TAB = 'home';

// Кэш данных
const CACHE = {
  me: { data: null, time: 0 },
  purchases: { data: null, time: 0 },
  eras: { data: null, time: 0 },
  notifications: { data: null, time: 0 },
};

// ---------- SAFE HELPERS ----------
function $(id){ return document.getElementById(id); }
function hideNav(){ const n = $('nav'); if (n) n.classList.add('hidden'); }
function showNav(){ const n = $('nav'); if (n) n.classList.remove('hidden'); }
function hideLoading(){ const l = $('loading'); if (l) l.classList.add('hidden'); }

// ---------- TOAST ----------
function toast(msg, ms=2500){
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.add('hidden'), ms);
}

// ---------- API ----------
async function api(path, opts={}){
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  headers['ngrok-skip-browser-warning'] = 'true';
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try {
    res = await fetch(API + path, {...opts, headers});
  } catch(e) {
    throw new Error('Сервер недоступен');
  }
  if (res.status === 401){ logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || 'Ошибка');
  return data;
}

// ---------- CACHED API ----------
async function cached(key, path, force=false){
  const c = CACHE[key];
  const now = Date.now();
  if (!force && c.data && (now - c.time) < CACHE_TTL){
    return c.data;
  }
  const data = await api(path);
  c.data = data;
  c.time = now;
  return data;
}

function invalidateCache(key){
  if (key){
    CACHE[key].data = null;
    CACHE[key].time = 0;
  } else {
    Object.keys(CACHE).forEach(k => {
      CACHE[k].data = null;
      CACHE[k].time = 0;
    });
  }
}

// ---------- AUTH ----------
async function tryTelegramAuth(){
  const tg = window.Telegram?.WebApp;
  if (!tg) return { ok:false, reason:'no_tg' };
  try { tg.ready(); tg.expand(); } catch(e){}
  if (!tg.initDataUnsafe?.user) {
    return { ok:false, reason:'no_user' };
  }
  const u = tg.initDataUnsafe.user;
  const urlRef = new URLSearchParams(location.search).get('ref') || '';
  try {
    const res = await api('/api/auth/telegram', {
      method:'POST',
      body: {
        id: u.id,
        first_name: u.first_name || '',
        last_name: u.last_name || '',
        username: u.username || '',
        photo_url: u.photo_url || '',
        auth_date: tg.initDataUnsafe.auth_date || 0,
        hash: tg.initDataUnsafe.hash || '',
        ref: urlRef
      }
    });
    TOKEN = res.token;
    localStorage.setItem('token', TOKEN);
    return { ok:true };
  } catch(e){
    return { ok:false, reason:'api_error', error:e.message };
  }
}

// ============================================================
// ACTIONS (глобальные)
// ============================================================
window.setTab = function(tab){
  if (CURRENT_TAB === tab) return;
  CURRENT_TAB = tab;
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderCurrentTab();
};

window.logout = function(){
  localStorage.removeItem('token');
  TOKEN = '';
  ME = null;
  invalidateCache();
  location.reload();
};

window.copyRef = function(text){
  if (navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>toast('📋 Скопировано'))
      .catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
};

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('📋 Скопировано'); }
  catch(e){ toast('Не удалось'); }
  ta.remove();
}

window.agreeTerms = async function(){
  try {
    await api('/api/agree', {method:'POST'});
    invalidateCache('me');
    toast('✅ Условия подтверждены');
    renderCurrentTab();
  } catch(e){ toast(e.message); }
};

window.buyEra = async function(id){
  if (!confirm('Создать заявку на покупку?')) return;
  try {
    const res = await api('/api/purchases/create/' + id, {method:'POST'});
    invalidateCache('purchases');
    invalidateCache('me');
    toast(`✅ Заявка #${res.purchase_id} создана`);

// Shop filters (без ре-рендера, только CSS)
window.shopSetFilter = function(f, btn){
  document.querySelectorAll('.filters .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const cards = document.querySelectorAll('.era-card[data-price]');
  cards.forEach(card => {
    const price = parseFloat(card.dataset.price);
    let show = true;
    if (f === 'starter') show = price < 10000;
    else if (f === 'middle') show = price >= 10000 && price < 50000;
    else if (f === 'premium') show = price >= 50000;
    card.style.display = show ? '' : 'none';
  });
};

window.shopSetSort = function(s, btn){
  document.querySelectorAll('.filters .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const container = document.querySelector('.shop-container');
  if (!container) return;
  const cards = Array.from(container.querySelectorAll('.era-card[data-price]'));
  cards.sort((a, b) => {
    const pa = parseFloat(a.dataset.price);
    const pb = parseFloat(b.dataset.price);
    const ra = parseFloat(a.dataset.profit);
    const rb = parseFloat(b.dataset.profit);
    const da = parseInt(a.dataset.duration);
    const db = parseInt(b.dataset.duration);
    if (s === 'price_asc') return pa - pb;
    if (s === 'price_desc') return pb - pa;
    if (s === 'profit') return rb - ra;
    if (s === 'duration') return da - db;
    return parseInt(a.dataset.id) - parseInt(b.dataset.id);
  });
  cards.forEach(c => container.appendChild(c));
};

function showModal(html){
  const root = $('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">${html}</div>
    </div>
  `;
}

// ============================================================
// HELPERS
// ============================================================
function tierOf(era){
  const price = Number(era.price||0);
  if (price >= 30000) return { key:'premium', label:'PREMIUM', icon:'💎', glow:'rgba(255,209,102,.25)' };
  if (price >= 5000) return { key:'middle', label:'БИЗНЕС', icon:'🚀', glow:'rgba(79,140,255,.25)' };
  return { key:'starter', label:'СТАРТ', icon:'⚡', glow:'rgba(99,169,255,.2)' };
}

function progressOf(p){
  if (!p.activated_at || !p.expires_at) return 0;
  const a = new Date(p.activated_at).getTime();
  const e = new Date(p.expires_at).getTime();
  const now = Date.now();
  if (now >= e) return 100;
  if (now <= a) return 0;
  return Math.round(((now - a) / (e - a)) * 100);
}

function daysLeftClass(days, status){
  if (['completed','awaiting_payout','paid'].includes(status)) return 'info';
  if (days <= 1) return 'err';
  if (days <= 3) return 'warn';
  return 'ok';
}

function daysLeftLabel(p){
  if (p.status === 'completed') return '🏁 Завершён';
  if (p.status === 'awaiting_payout') return '💸 Ждёт выплату';
  if (p.status === 'paid') return '💰 Выплачен';
  if (p.status === 'awaiting_payment') return '⏳ Ожидает оплаты';
  if (p.status === 'cancelled') return '❌ Отменён';
  if (p.days_left <= 0) return '🏁 Завершение';
  if (p.days_left === 1) return '⏰ Остался 1 день';
  if (p.days_left === 2) return '⏰ Осталось 2 дня';
  if (p.days_left <= 3) return `⏰ Осталось ${p.days_left} дня`;
  return `✅ Осталось ${p.days_left} дн.`;
}

              <div class="tier">Срок ${e.duration_days} дней · +${roi}%</div>

          </div>
        </div>
      </div>
      <div class="body">
        <div class="desc">${esc(e.description||'')}</div>
        <div class="metrics">
          <div class="metric"><div class="l">Стоимость</div>
            <div class="v">${fmt(e.price)}</div></div>
          <div class="metric"><div class="l">Начисление</div>
            <div class="v profit">+${fmt(e.profit_amount)}</div></div>
          <div class="metric"><div class="l">Итого</div>
            <div class="v total">${fmt(e.total_amount)}</div></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn secondary" onclick="openEraDetail(${e.id})">Подробнее</button>
        <button class="btn" onclick="buyEra(${e.id})">Купить</button>
      </div>
    </div>
  `;
}

async function renderPurchases(){
  const list = await cached('purchases', '/api/purchases/my');
  $('app').innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="logo">📦</div>Мои покупки</div>
      <div class="actions"><span class="muted-sm">${list.length}</span></div>
    </div>
    ${list.length
      ? list.map(p => eraCardFull(p)).join('')
      : `<div class="card empty">
           <div class="icon">📦</div>
           <h3>Покупок пока нет</h3>
           <p class="muted" style="margin-bottom:16px">Купите первую эру в магазине</p>
           <button class="btn" style="max-width:240px;margin:0 auto"
             onclick="setTab('buy')">🛒 Открыть магазин</button>
         </div>`}
  `;
}

function eraCardFull(p){
  const progress = progressOf(p);
  const cls = daysLeftClass(p.days_left, p.status);
  const label = daysLeftLabel(p);
  return `
    <div class="era-card">
      <div class="head">
        <div class="order-num">📩 Заявка #${p.id}</div>
        <div class="row">
          <div class="title-wrap">
            <div class="icon">🌿</div>
            <div style="min-width:0">
              <div class="name">${esc(p.era_title)}</div>
              <div class="tier">${p.duration_days} дней · ${fmt(p.purchase_price)}</div>
            </div>
          </div>
          <span class="badge ${p.status}">${statusLabel(p.status)}</span>
        </div>
      </div>
      <div class="body">
        <div class="metrics">
          <div class="metric"><div class="l">Вложено</div>
            <div class="v">${fmt(p.purchase_price)}</div></div>
          <div class="metric"><div class="l">Начисл.</div>
            <div class="v profit">+${fmt(p.profit_amount)}</div></div>
          <div class="metric"><div class="l">Итого</div>
            <div class="v total">${fmt(p.total_amount)}</div></div>
        </div>
        ${p.status === 'active' ? `
          <div style="text-align:center;margin-top:14px">
            <span class="days-left ${cls}">${label}</span>
          </div>
          <div class="progress" style="margin-top:12px">
            <div class="fill ${cls}" style="width:${progress}%"></div>
          </div>
          <div class="muted-sm" style="margin-top:6px;text-align:center">
            Прогресс ${progress}%
          </div>
        ` : ''}
        <div class="card2" style="margin-top:12px;background:var(--card3)">
          ${p.created_at ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Создана</span>
            <span style="font-size:12px">${fmtDate(p.created_at)}</span></div>` : ''}
          ${p.start_date ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Начало</span>
            <span style="font-size:12px">${fmtDate(p.start_date)}</span></div>` : ''}
          ${p.last_day ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Последний день</span>
            <span style="font-size:12px">${fmtDate(p.last_day)}</span></div>` : ''}
          ${p.cancelled_at ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Отменена</span>
            <span style="font-size:12px">${fmtDate(p.cancelled_at)}</span></div>` : ''}
          ${p.payout_requested_at ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Заявка на вывод</span>
            <span style="font-size:12px">${fmtDate(p.payout_requested_at)}</span></div>` : ''}
          ${p.paid_at ? `<div class="row" style="padding:4px 0">
            <span class="muted-sm">Выплачено</span>
            <span style="font-size:12px">${fmtDate(p.paid_at)}</span></div>` : ''}
        </div>
      </div>
      ${p.status === 'completed'
        ? `<div class="actions">
             <button class="btn success" onclick="requestPayout(${p.id})">
               💰 Подать заявку на вывод
             </button>
           </div>`
        : ''}
    </div>
  `;
}

// ============================================================
// ROUTER
// ============================================================
async function renderCurrentTab(){
  try {
    if (!TOKEN){
      const result = await tryTelegramAuth();
      if (!result.ok){ screenAuth(result.reason); return; }
    }
    showNav();
    hideLoading();

    const routes = {
      home: renderHome,
      buy: renderBuy,
      purchases: renderPurchases,
      profile: renderProfile
    };
    const fn = routes[CURRENT_TAB] || renderHome;
    await fn();
  } catch(e){
    console.error(e);
    if (e.message === 'Unauthorized'){ screenAuth(); return; }
    toast('⚠️ ' + (e.message || 'Ошибка'));
  }
}

// ============================================================
// NAV LISTENER (делегирование, один раз)
// ============================================================
(function attachNav(){
  const nav = document.getElementById('nav');
  if (!nav) return;
  nav.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !b.dataset.tab) return;
    window.setTab(b.dataset.tab);
  });
})();

// ============================================================
// UTILS
// ============================================================
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try {
    const d = new Date(s);
    return d.toLocaleDateString('ru-RU',
      {day:'2-digit',month:'2-digit',year:'numeric'}) +
      ' ' + d.toLocaleTimeString('ru-RU',
      {hour:'2-digit',minute:'2-digit'});
  } catch { return s; }
}
function statusLabel(s){
  return ({
    awaiting_payment:'Ожидает оплаты',
    active:'Активен',
    completed:'Завершён',
    awaiting_payout:'Ожидает выплаты',
    paid:'Выплачен',
    cancelled:'Отменён'
  })[s] || s;
}

// ============================================================
// START
// ============================================================
function start(){
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === 'home');
  });
  renderCurrentTab();
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', start);
} else {
  start();
}
</script>
