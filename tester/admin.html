<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Era Admin</title>

<!-- ═══════ ЗАЩИТА ОТ ЧЁРНОГО ФОНА ═══════ -->
<script>
window.addEventListener('error', function(e){
  var app = document.getElementById('app');
  if (!app) return;
  if (app.innerHTML && app.innerHTML.trim().length > 0) return; // уже что-то нарисовано
  app.innerHTML = ''
    + '<div style="max-width:640px;margin:60px auto;padding:24px;'
    + 'background:#1c2330;border:1px solid #ff5c5c;border-radius:12px;'
    + 'color:#e6edf3;font-family:monospace;font-size:13px;line-height:1.7">'
    + '<div style="font-size:18px;color:#ff5c5c;font-weight:700;margin-bottom:12px">'
    + '⚠️ Ошибка загрузки админки</div>'
    + '<div style="margin-bottom:10px"><b>Сообщение:</b> ' + (e.message || '—') + '</div>'
    + '<div style="margin-bottom:10px"><b>Файл:</b> ' + (e.filename || '—') + '</div>'
    + '<div style="margin-bottom:10px"><b>Строка:</b> ' + (e.lineno || '—') + ':' + (e.colno || '—') + '</div>'
    + '<div style="color:#8b949e;margin-bottom:16px">Скопируй это и отправь разработчику.</div>'
    + '<button onclick="location.reload()" '
    + 'style="padding:10px 16px;background:#4f8cff;color:#fff;border:0;'
    + 'border-radius:8px;cursor:pointer;font-weight:600">🔄 Перезагрузить</button>'
    + '</div>';
});
</script>

<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --card3:#232b38;
  --border:#252e3a; --border2:#2f3a48;
  --text:#e6edf3; --muted:#8b949e; --accent:#4f8cff;
  --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit}
.hidden{display:none !important}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--card);border-right:1px solid var(--border);
  padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;
  border-bottom:1px solid var(--border);margin-bottom:12px}
.side .logo .ic{width:36px;height:36px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.side .logo .t{font-weight:700;font-size:15px}
.side .logo .s{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.side .nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#c4ccd6;padding:11px 12px;border-radius:9px;
  cursor:pointer;font-size:13.5px;margin-bottom:2px;font-weight:500}
.side .nav:hover{background:var(--card2)}
.side .nav.active{background:var(--accent);color:#fff}
.side .nav .emo{font-size:16px;width:20px;text-align:center}
.side .nav .badge-n{margin-left:auto;padding:2px 8px;border-radius:10px;
  background:rgba(255,255,255,.16);font-size:11px;font-weight:700}
.side .sect{font-size:10px;color:var(--muted);text-transform:uppercase;
  font-weight:700;padding:12px 12px 4px;letter-spacing:.06em}
.main{flex:1;min-width:0;padding:20px 24px}
.h1{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:20px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px}
.stat .ic{font-size:22px;margin-bottom:6px}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;
  font-weight:600;margin-bottom:4px}
.stat .v{font-size:20px;font-weight:700}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}
.stat .v.accent{color:var(--accent)} .stat .v.purple{color:var(--purple)}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:14px}

/* BUTTONS */
.btn{padding:10px 16px;border-radius:9px;border:0;background:var(--accent);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  min-height:40px;justify-content:center}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:#c4ccd6}
.btn.danger{background:var(--err)}
.btn.ok{background:var(--ok);color:#04241a}
.btn.purple{background:var(--purple);color:#12002e}
.btn.sm{padding:7px 12px;font-size:12px;min-height:34px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.created{background:rgba(99,169,255,.15);color:#63a9ff}
.badge.pending{background:rgba(245,181,71,.15);color:var(--warn)}
.badge.approved,.badge.completed,.badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
.badge.cancelled,.badge.rejected{background:rgba(255,92,92,.15);color:var(--err)}
.badge.purple{background:rgba(167,139,250,.15);color:var(--purple)}

/* GRID CELLS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;margin:10px 0}
.cell{background:var(--card2);border-radius:9px;padding:10px 12px}
.cell b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;
  margin-bottom:3px;font-weight:600}
.cell span{font-size:14px;font-weight:600}
.cell span.ok{color:var(--ok)} .cell span.accent{color:var(--accent)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* FORM */
.frow{margin-bottom:12px}
.frow label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;
  text-transform:uppercase;font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:15px;outline:none;min-height:44px}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:120px;resize:vertical;line-height:1.5}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:20px;background:var(--card2);
  border:1px solid var(--border);color:#c4ccd6;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--border2);padding:14px 20px;
  border-radius:12px;z-index:9999;font-size:14px;font-weight:500;
  max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.ok{border-color:var(--ok);color:#a8f0cc}
.toast.err{border-color:var(--err);color:#ffb3b3}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border2);
  border-radius:14px;padding:28px;width:100%;max-width:400px}
.login-box h1{font-size:22px;text-align:center;margin-bottom:24px}

.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:48px;margin-bottom:12px;opacity:.5}
.muted{color:var(--muted);font-size:12.5px}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.mh{padding:18px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;position:sticky;top:0;
  background:var(--card)}
.mh h2{font-size:17px}
.mb{padding:18px}
.mf{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px}
.mf .btn{flex:1}
.x{width:36px;height:36px;border-radius:50%;background:var(--card2);
  border:1px solid var(--border2);color:#c4ccd6;font-size:18px;cursor:pointer}

/* SEARCH */
.search{position:relative;margin-bottom:14px}
.search input{padding-left:38px}
.search::before{content:'🔍';position:absolute;left:14px;top:50%;
  transform:translateY(-50%);opacity:.6;pointer-events:none}

/* REF */
.ref{background:var(--card3);border-radius:10px;padding:12px 14px;margin-top:12px;
  border-left:3px solid var(--purple)}
.ref .lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:8px}
.ri{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  font-size:13.5px;gap:10px;flex-wrap:wrap}
.ri+.ri{border-top:1px solid var(--border)}
.ri a{color:var(--accent);text-decoration:none}

/* DATE */
.date{background:var(--card3);border-radius:10px;padding:12px 14px;margin-top:12px;
  border-left:3px solid var(--accent)}
.date .lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;margin-bottom:10px}
.dcell{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px}
.dcell b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;
  font-weight:600;margin-bottom:3px}
.dcell span{font-size:13px;font-weight:600}
.dleft{padding:8px 10px;border-radius:8px;font-size:13px;display:flex;
  align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dleft.ok{background:rgba(57,217,138,.12);color:var(--ok)}
.dleft.warn{background:rgba(245,181,71,.12);color:var(--warn)}
.dleft.err{background:rgba(255,92,92,.15);color:var(--err)}
.dleft.muted{background:rgba(139,148,158,.12);color:var(--muted)}

/* BROADCAST */
.bc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bc-prev{background:#0e1116;border:1px solid var(--border2);border-radius:12px;
  padding:14px;min-height:180px}
.bc-prev .hd{font-size:11px;color:var(--muted);text-transform:uppercase;
  font-weight:700;margin-bottom:10px}
.bc-prev .body{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bc-prev .body b{font-weight:700}
.bc-prev .body a{color:var(--accent);text-decoration:underline}
.bc-prev .body code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px}
.bc-prev .photo{width:100%;max-height:240px;object-fit:cover;border-radius:8px;
  margin-bottom:10px;border:1px solid var(--border2)}
.bc-prev .btn-prev{display:inline-block;margin-top:10px;padding:9px 14px;
  border-radius:8px;background:rgba(79,140,255,.15);color:var(--accent);
  border:1px solid rgba(79,140,255,.3);font-size:12.5px;font-weight:600}
.bc-prog{height:8px;background:var(--card3);border-radius:4px;overflow:hidden;
  margin:12px 0 8px}
.bc-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));
  transition:width .2s linear;width:0%}
.bc-stat{display:flex;gap:14px;font-size:12.5px}
.bc-log{background:#0a0d12;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;max-height:200px;overflow-y:auto;font-family:monospace;
  font-size:11.5px;margin-top:10px;line-height:1.6}
.bc-log .err{color:var(--err)}
.bc-aud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bc-aud .chip{padding:7px 12px;border-radius:20px;background:var(--card2);
  border:1px solid var(--border);color:#c4ccd6;font-size:12.5px;font-weight:600;cursor:pointer}
.bc-aud .chip.active{background:var(--purple);color:#12002e;border-color:var(--purple)}

/* MOBILE */
@media(max-width:900px){
  .bc-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .layout{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:50;
    border-right:0;border-bottom:1px solid var(--border);padding:10px;
    display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .logo,.side .sect{display:none}
  .side .nav{width:auto;flex-shrink:0;padding:9px 14px;margin-bottom:0;
    border:1px solid var(--border)}
  .side .nav .badge-n{display:none}
  .main{padding:14px 12px 60px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="app">
  <div class="login">
    <div class="login-box">
      <h1>⚡ Era Admin</h1>
      <div class="empty">Загрузка…</div>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// КОНФИГ
// ═══════════════════════════════════════════════════════════
var FIREBASE = 'https://velosher-f82b5-default-rtdb.asia-southeast1.firebasedatabase.app';
var ADMIN_PASSWORD = 'admin123';
var BOT_TOKEN = '8880107122:AAFa0r2WsfEeDmKIqRZI_YvvwRdXLz7y2kQ';
var ADMIN_IDS = ['6040186314', '6972338698'];
var REF_PERCENT = 5;

// ═══════════════════════════════════════════════════════════
// СОСТОЯНИЕ
// ═══════════════════════════════════════════════════════════
var AUTH = sessionStorage.getItem('admin_auth') === '1';
var TAB = 'dashboard';
var DATA = { purchases: [], payouts: [], users: [], eras: [] };
var SEARCH = '';
var LOG = [];
var $ = function(id){ return document.getElementById(id); };

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try {
    return new Date(s).toLocaleString('ru-RU',
      {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  } catch(e){ return s; }
}
function fmtD(s){
  if (!s) return '—';
  try {
    return new Date(s).toLocaleDateString('ru-RU',
      {day:'2-digit',month:'2-digit',year:'numeric'});
  } catch(e){ return s; }
}
function statusLabel(s){
  return {
    created:'Ожидает', in_progress:'В процессе', approved:'Активен',
    completed:'Завершён', paid:'Выплачен', cancelled:'Отменён',
    pending:'Ожидает', rejected:'Отклонён'
  }[s] || s;
}
function toast(msg, type){
  var t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.add('hidden'); }, 2600);
}
function toList(raw){
  if (Array.isArray(raw)) {
    return raw.filter(function(x){ return x && typeof x === 'object'; })
      .map(function(v,i){ var o = Object.assign({}, v); o._key = String(i); return o; });
  }
  if (raw && typeof raw === 'object') {
    return Object.keys(raw)
      .filter(function(k){ return raw[k] && typeof raw[k] === 'object'; })
      .map(function(k){ var o = Object.assign({}, raw[k]); o._key = k; return o; });
  }
  return [];
}
async function fbGet(path){
  var r = await fetch(FIREBASE + '/' + path + '.json');
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbPut(path, data){
  var r = await fetch(FIREBASE + '/' + path + '.json',
    {method:'PUT', body: JSON.stringify(data)});
  return r.ok;
}
async function fbPatch(path, data){
  var r = await fetch(FIREBASE + '/' + path + '.json',
    {method:'PATCH', body: JSON.stringify(data)});
  return r.ok;
}
async function fbDelete(path){
  var r = await fetch(FIREBASE + '/' + path + '.json', {method:'DELETE'});
  return r.ok;
}
function pushLog(action, info){
  LOG.unshift({ ts: new Date().toISOString(), action: action, info: info });
  if (LOG.length > 50) LOG.pop();
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function findUser(users, tgId){
  if (!tgId) return null;
  for (var i=0;i<users.length;i++){
    if (String(users[i].telegram_id) === String(tgId)) return users[i];
  }
  return null;
}
function getReferrer(users, u){
  if (!u || !u.referrer_uid) return null;
  return findUser(users, u.referrer_uid);
}
function getRefs(users, u){
  if (!u || !u.telegram_id) return [];
  return users.filter(function(x){
    return String(x.referrer_uid || '') === String(u.telegram_id);
  });
}
function userName(u){
  if (!u) return '—';
  return ((u.first_name || '') + (u.last_name ? ' ' + u.last_name : '')) || 'Без имени';
}
function userLink(u){
  if (!u) return '';
  if (u.username) return '<a href="https://t.me/' + esc(u.username) + '" target="_blank">@' + esc(u.username) + '</a>';
  return '<a href="tg://user?id=' + esc(u.telegram_id) + '" target="_blank">ID ' + esc(u.telegram_id) + '</a>';
}
function fmtLeft(ms){
  if (ms == null) return '—';
  if (ms <= 0) return '⏹ Завершено';
  var s = Math.floor(ms/1000);
  var d = Math.floor(s/86400), h = Math.floor((s%86400)/3600),
      m = Math.floor((s%3600)/60), sec = s%60;
  if (d > 0) return d + 'д ' + h + 'ч ' + m + 'м';
  if (h > 0) return h + 'ч ' + m + 'м ' + sec + 'с';
  if (m > 0) return m + 'м ' + sec + 'с';
  return sec + 'с';
}

// ═══════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════
function renderLogin(){
  $('app').innerHTML =
    '<div class="login">' +
      '<div class="login-box">' +
        '<h1>⚡ Era Admin</h1>' +
        '<div class="frow"><label>Пароль</label>' +
          '<input class="input" id="pw" type="password" ' +
            'onkeydown="if(event.key===\'Enter\')doLogin()" autofocus></div>' +
        '<button class="btn" style="width:100%;min-height:48px" onclick="doLogin()">🔓 Войти</button>' +
        '<div class="muted" style="margin-top:16px;text-align:center">Панель управления</div>' +
      '</div>' +
    '</div>';
}
function doLogin(){
  if ($('pw').value === ADMIN_PASSWORD){
    AUTH = true;
    sessionStorage.setItem('admin_auth', '1');
    render();
  } else toast('Неверный пароль', 'err');
}
function logout(){
  sessionStorage.removeItem('admin_auth');
  AUTH = false;
  render();
}

// ═══════════════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════════════
function layout(content){
  var newCnt = DATA.purchases.filter(function(p){ return p.status === 'created'; }).length;
  var payCnt = DATA.payouts.filter(function(p){ return p.status === 'pending'; }).length;
  var userCnt = DATA.users.length;
  var eraCnt = DATA.eras.length;

  var nav = function(tab, emo, label, cnt){
    var cls = TAB === tab ? 'active' : '';
    var badge = cnt ? '<span class="badge-n">' + cnt + '</span>' : '';
    return '<button class="nav ' + cls + '" onclick="setTab(\'' + tab + '\')">' +
      '<span class="emo">' + emo + '</span>' + label + badge + '</button>';
  };

  $('app').innerHTML =
    '<div class="layout">' +
      '<aside class="side">' +
        '<div class="logo">' +
          '<div class="ic">⚡</div>' +
          '<div><div class="t">Era Admin</div><div class="s">Управление</div></div>' +
        '</div>' +
        '<div class="sect">Обзор</div>' +

async function renderDashboard(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    var res = await Promise.all([
      fbGet('purchases').then(toList).catch(function(){ return []; }),
      fbGet('payouts').then(toList).catch(function(){ return []; }),
      fbGet('users').then(toList).catch(function(){ return []; }),
      fbGet('eras').then(toList).catch(function(){ return []; })
    ]);
    DATA.purchases = res[0]; DATA.payouts = res[1];
    DATA.users = res[2]; DATA.eras = res[3];

    var active = DATA.purchases.filter(function(p){ return p.status === 'approved'; }).length;
    var done = DATA.purchases.filter(function(p){ return p.status === 'completed'; }).length;
    var created = DATA.purchases.filter(function(p){ return p.status === 'created'; }).length;
    var pendingPO = DATA.payouts.filter(function(p){ return p.status === 'pending'; }).length;
    var refsCnt = DATA.users.filter(function(u){ return u.referrer_uid; }).length;

    var totalBuy = 0, totalProfit = 0, totalPaid = 0;
    var refPend = 0, refAppr = 0, refPaid = 0;

    DATA.purchases.forEach(function(p){
      if (p.status !== 'cancelled') totalBuy += Number(p.purchase_price || 0);
      if (['approved','completed','paid'].indexOf(p.status) >= 0) totalProfit += Number(p.profit_amount || 0);
      if (p.referrer_uid && ['rejected','cancelled'].indexOf(p.status) < 0){
        var b = Number(p.referral_bonus || 0) || Math.round(Number(p.purchase_price || 0) * REF_PERCENT / 100);
        var st = p.referral_status || 'pending';
        if (st === 'paid') refPaid += b;
        else if (st === 'approved') refAppr += b;
        else if (st !== 'rejected') refPend += b;
      }
    });
    DATA.payouts.forEach(function(p){
      if (p.status === 'paid') totalPaid += Number(p.amount || 0);
    });

    var stat = function(ic, label, val, cls){
      return '<div class="stat"><div class="ic">' + ic + '</div>' +
        '<div class="l">' + label + '</div>' +
        '<div class="v ' + (cls||'') + '">' + val + '</div></div>';
    };

    layout(
      '<div class="stats">' +
        stat('👥', 'Юзеров', DATA.users.length) +
        stat('🌳', 'Рефералов', refsCnt, 'purple') +
        stat('🟢', 'Активных', active, 'ok') +
        stat('🏁', 'Завершено', done) +
        stat('⏳', 'Новых заявок', created, 'warn') +
        stat('💸', 'Выплат ждут', pendingPO, 'warn') +
        stat('💵', 'Куплено', fmt(totalBuy), 'accent') +
        stat('📈', 'Начислено', fmt(totalProfit), 'ok') +
        stat('💰', 'Выплачено', fmt(totalPaid)) +
        stat('🎁', 'Реф. ожидает', fmt(refPend), 'warn') +
        stat('✅', 'Реф. начислено', fmt(refAppr), 'ok') +
        stat('💸', 'Реф. выплачено', fmt(refPaid), 'accent') +
      '</div>' +
      '<button class="btn ghost" onclick="renderDashboard()">🔄 Обновить</button>'
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}

function orderCard(p){
  var k = p._key;
  var buyer = findUser(DATA.users, p.user_telegram_id);
  var referrer = buyer ? getReferrer(DATA.users, buyer) : null;

  var canConfirm = ['created','in_progress'].indexOf(p.status) >= 0;
  var canCancel = canConfirm;
  var isActive = p.status === 'approved';
  var isDone = ['completed','paid'].indexOf(p.status) >= 0;

  var fast = '⏳';
  if (isActive && p.expires_at){
    var leftMs = new Date(p.expires_at).getTime() - Date.now();
    var h = leftMs / 3600000;
    if (leftMs <= 0) fast = '⚫';
    else if (h <= 24) fast = '🔴';
    else if (h <= 72) fast = '🟡';
    else fast = '🟢';
  } else if (isDone) fast = '🏁';

  var dateBlock = '';
  if (isActive || isDone){
    var expMs = p.expires_at ? new Date(p.expires_at).getTime() : null;
    var remain = expMs ? expMs - Date.now() : null;
    var cls = 'ok', txt = '—';
    if (remain != null){
      if (remain <= 0){ cls = 'muted'; txt = 'Завершено'; }
      else {
        var hh = remain / 3600000;
        txt = fmtLeft(remain);
        if (hh <= 24) cls = 'err';
        else if (hh <= 72) cls = 'warn';
        else cls = 'ok';
      }
    }
    var days = Number(p.duration_days || p.days || 0);
    dateBlock =
      '<div class="date">' +
        '<div class="lbl">🗓 Сроки эры</div>' +
        '<div class="dgrid">' +
          '<div class="dcell"><b>▶️ Начало</b><span>' + fmtD(p.start_date) + '</span></div>' +
          '<div class="dcell"><b>🏁 Последний</b><span>' + fmtD(p.last_day) + '</span></div>' +
          '<div class="dcell"><b>⏰ Истекает</b><span>' + fmtDate(p.expires_at) + '</span></div>' +
          '<div class="dcell"><b>📅 Длит.</b><span>' + days + ' дн.</span></div>' +
        '</div>' +
        '<div class="dleft ' + cls + '">' +
          '⏳ Осталось: <b data-timer="' + esc(p.expires_at||'') + '">' + txt + '</b>' +
        '</div>' +
      '</div>';
  }

  var refBlock = '';
  if (p.referrer_uid){
    var bonus = Number(p.referral_bonus || 0) ||
      Math.round(Number(p.purchase_price || 0) * REF_PERCENT / 100);
    var st = p.referral_status || 'pending';
    var stLabel = { pending:'⏳ Ожидает', approved:'✅ Начислено', paid:'💸 Выплачено', rejected:'❌ Отклонено' }[st] || st;
    var refU = findUser(DATA.users, p.referrer_uid);
    var refName = refU ? userName(refU) : ('ID ' + p.referrer_uid);
    refBlock =
      '<div class="ref" style="border-left-color:var(--ok)">' +
        '<div class="lbl">🎁 Реферальный бонус</div>' +
        '<div class="ri"><div>Кому: <b>' + esc(refName) + '</b></div>' +
          '<div class="muted">' + REF_PERCENT + '% от покупки</div></div>' +
        '<div class="ri"><div>Сумма: <b style="color:var(--ok)">' + fmt(bonus) + '</b></div>' +
          '<span class="badge ' + st + '">' + stLabel + '</span></div>' +
        '<div class="flex" style="margin-top:8px">' +
          (st !== 'paid' && st !== 'rejected'
            ? '<button class="btn ok sm" onclick="payRef(\'' + esc(k) + '\')">💸 Выплатить</button>' : '') +
          '<button class="btn ghost sm" onclick="editRefBonus(\'' + esc(k) + '\')">✏️ Изменить</button>' +
        '</div>' +
      '</div>';
  }

  return '<div class="card">' +
    '<div class="row" style="margin-bottom:12px">' +
      '<b style="color:#4f8cff;font-size:16px">📩 Заявка #' + esc(p.id) + ' ' + fast + '</b>' +
      '<span class="badge ' + esc(p.status) + '">' + statusLabel(p.status) + '</span>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="cell"><b>👤 Участник</b><span>' + esc(p.user_first_name||'—') + '</span></div>' +
      '<div class="cell"><b>🔗 Ник</b><span>@' + esc(p.user_username||'—') + '</span></div>' +
      '<div class="cell"><b>🆔 TG ID</b><span>' + esc(p.user_telegram_id||'—') + '</span></div>' +
      '<div class="cell"><b>💳 Эра</b><span>' + esc(p.era_title||'—') + '</span></div>' +
      '<div class="cell"><b>💵 Номинал</b><span class="accent">' + fmt(p.purchase_price) + '</span></div>' +
      '<div class="cell"><b>💰 Начисл.</b><span class="ok">+' + fmt(p.profit_amount) + '</span></div>' +
      '<div class="cell"><b>🏆 Итого</b><span class="ok">' + fmt(p.total_amount) + '</span></div>' +
      '<div class="cell"><b>📅 Срок</b><span>' + Number(p.duration_days||p.days||0) + ' дн.</span></div>' +
    '</div>' +
    (referrer
      ? '<div class="ref"><div class="lbl">🎁 Пригласил</div>' +
          '<div class="ri"><div><b>' + esc(userName(referrer)) + '</b> · ' + userLink(referrer) + '</div>' +
          '<div class="muted">ID ' + esc(referrer.telegram_id) + '</div></div></div>'
      : '<div class="ref" style="border-left-color:var(--muted)"><div class="lbl">🎁 Пригласил</div>' +
        '<div class="ri"><span class="muted">Прямая регистрация</span></div></div>') +
    dateBlock +
    refBlock +
    '<div class="muted" style="margin:12px 0">🕐 Создано: ' + fmtDate(p.created_at) + '</div>' +
    '<div class="flex">' +
      (canConfirm ? '<button class="btn ok" onclick="admConfirm(\'' + esc(k) + '\')">✅ Подтвердить</button>' : '') +
      (canCancel ? '<button class="btn danger" onclick="admCancel(\'' + esc(k) + '\')">❌ Отменить</button>' : '') +
      '<button class="btn ghost" onclick="admContact(\'' + esc(p.user_telegram_id||'') + '\')">💬 Написать</button>' +
    '</div>' +
  '</div>';
}

async function admConfirm(k){
  if (!confirm('Подтвердить заявку?')) return;
  try {
    var p = DATA.purchases.filter(function(x){ return x._key === k; })[0];
    if (!p) return;
    var now = new Date();
    var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    d0.setDate(d0.getDate() + 1);
    var days = Number(p.duration_days || p.days || 20);
    var last = new Date(d0); last.setDate(d0.getDate() + days - 1);
    var exp = new Date(d0); exp.setDate(d0.getDate() + days);

    var patch = {
      status: 'approved',
      activated_at: now.toISOString(),
      start_date: d0.toISOString(),
      last_day: last.toISOString(),
      expires_at: exp.toISOString(),
      status_changed_at: now.toISOString(),
      notified_3d: 0, notified_1d: 0, notified_3h: 0, completed_notified: 0
    };
    if (p.referrer_uid){
      patch.referral_status = 'approved';
      if (!p.referral_bonus){
        patch.referral_bonus = Math.round(Number(p.purchase_price||0) * REF_PERCENT / 100);
      }
    }
    await fbPatch('purchases/' + k, patch);
    pushLog('✅ Подтвердил заявку', '#' + p.id);
    toast('✅ Подтверждено', 'ok');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}

async function admCancel(k){
  if (!confirm('Отменить заявку?')) return;
  try {
    var p = DATA.purchases.filter(function(x){ return x._key === k; })[0];
    var patch = { status: 'cancelled', status_changed_at: new Date().toISOString() };
    if (p && p.referrer_uid) patch.referral_status = 'rejected';
    await fbPatch('purchases/' + k, patch);
    pushLog('❌ Отменил заявку', '#' + (p ? p.id : k));
    toast('❌ Отменено');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}

async function admContact(uid){
  if (!uid) return;
  try {
    var u = await fbGet('users/' + uid);
    if (!u) return toast('Не найден', 'err');
    var url = u.username ? 'https://t.me/' + u.username : 'tg://user?id=' + uid;
    window.open(url, '_blank');
  } catch(e){ toast(e.message, 'err'); }
}

async function payRef(key){
  if (!confirm('Отметить бонус выплаченным?')) return;
  try {
    await fbPatch('purchases/' + key, {
      referral_status: 'paid',
      referral_paid_at: new Date().toISOString()
    });
    pushLog('💸 Выплатил бонус', key);
    toast('💸 Отмечено', 'ok');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}

function editRefBonus(key){
  var p = DATA.purchases.filter(function(x){ return x._key === key; })[0];
  if (!p) return;
  var cur = Number(p.referral_bonus || 0) || Math.round(Number(p.purchase_price||0) * REF_PERCENT / 100);
  var v = prompt('Сумма бонуса, ₽:', cur);
  if (v == null) return;
  var val = Number(v);
  if (!isFinite(val) || val < 0) return toast('Неверная сумма', 'err');
  fbPatch('purchases/' + key, { referral_bonus: val }).then(function(){
    toast('💾 Сохранено', 'ok');
    renderPurchases();
  });
}

function userCard(u){
  var myP = DATA.purchases.filter(function(p){
    return String(p.user_telegram_id) === String(u.telegram_id);
  });
  var invested = 0, earned = 0;
  myP.forEach(function(p){
    if (p.status !== 'cancelled') invested += Number(p.purchase_price||0);
    if (['completed','paid'].indexOf(p.status) >= 0) earned += Number(p.total_amount||0);
  });

  var referrer = getReferrer(DATA.users, u);
  var refs = getRefs(DATA.users, u);

  var myIds = {};
  refs.forEach(function(r){ myIds[String(r.telegram_id)] = 1; });
  var rPend = 0, rAppr = 0, rPaid = 0;
  DATA.purchases.forEach(function(p){
    if (!myIds[String(p.user_telegram_id)]) return;
    if (['rejected','cancelled'].indexOf(p.status) >= 0) return;
    var b = Number(p.referral_bonus||0) || Math.round(Number(p.purchase_price||0) * REF_PERCENT / 100);
    var st = p.referral_status || 'pending';
    if (st === 'rejected') return;
    if (st === 'paid') rPaid += b;
    else if (st === 'approved') rAppr += b;
    else rPend += b;
  });
  var rTotal = rPend + rAppr + rPaid;

  return '<div class="card">' +
    '<div class="row" style="margin-bottom:12px">' +
      '<div><b style="font-size:15px">' + esc(userName(u)) + '</b>' +
        '<div class="muted">@' + esc(u.username||'—') + ' · ID ' + esc(u.telegram_id) + '</div></div>' +
      (u.referrer_uid
        ? '<span class="badge purple">🌳 реферал</span>'
        : '<span class="badge created">⭐ прямой</span>') +
    '</div>' +
    '<div class="grid">' +
      '<div class="cell"><b>Вложено</b><span class="accent">' + fmt(invested) + '</span></div>' +
      '<div class="cell"><b>Получено</b><span class="ok">' + fmt(earned) + '</span></div>' +
      '<div class="cell"><b>Заявок</b><span>' + myP.length + '</span></div>' +
      '<div class="cell"><b>Пригласил</b><span style="color:var(--purple)">' + refs.length + '</span></div>' +
    '</div>' +
    (rTotal > 0
      ? '<div class="ref" style="border-left-color:var(--ok)">' +
          '<div class="lbl">💰 Реф. баланс</div>' +
          '<div class="ri"><div>⏳ Ожидает</div><div><b style="color:var(--warn)">' + fmt(rPend) + '</b></div></div>' +
          '<div class="ri"><div>✅ Начислено</div><div><b style="color:var(--ok)">' + fmt(rAppr) + '</b></div></div>' +
          '<div class="ri"><div>💸 Выплачено</div><div><b style="color:var(--accent)">' + fmt(rPaid) + '</b></div></div>' +
        '</div>'
      : '') +
    (referrer
      ? '<div class="ref"><div class="lbl">🎁 Кто пригласил</div>' +
          '<div class="ri"><div><b>' + esc(userName(referrer)) + '</b> · ' + userLink(referrer) + '</div></div></div>'
      : '') +
    (refs.length
      ? '<div class="ref"><div class="lbl">👥 Пригласил (' + refs.length + ')</div>' +
          refs.map(function(r){
            return '<div class="ri"><div><b>' + esc(userName(r)) + '</b> · ' + userLink(r) + '</div>' +
              '<div class="muted">' + fmtDate(r.registered_at) + '</div></div>';
          }).join('') + '</div>'
      : '') +
    '<div class="row" style="margin-top:12px">' +
      '<div class="muted">📅 ' + fmtDate(u.registered_at) + '</div>' +
      '<div class="flex">' +
        (refs.length ? '<button class="btn purple sm" onclick="showTree(\'' + esc(u.telegram_id) + '\')">🌳</button>' : '') +
        '<button class="btn ghost sm" onclick="admContact(\'' + esc(u.telegram_id||'') + '\')">💬</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function showTree(uid){
  var root = findUser(DATA.users, uid);
  if (!root) return;

  function sub(u){
    var kids = getRefs(DATA.users, u);
    if (!kids.length) return '';
    return '<div style="padding-left:16px;border-left:1px dashed var(--border2);margin-left:8px">' +
      kids.map(function(k){
        return '<div style="padding:8px 0"><div>' + esc(userName(k)) + ' · ' + userLink(k) + '</div>' +
          '<div class="muted" style="font-size:11px">📅 ' + fmtDate(k.registered_at) + '</div>' +
          sub(k) + '</div>';
      }).join('') + '</div>';
  }

  $('modal-root').innerHTML =
    '<div class="mbg" onclick="if(event.target===this)closeModal()"><div class="modal">' +
      '<div class="mh"><h2>🌳 Дерево рефералов</h2>' +
        '<button class="x" onclick="closeModal()">✕</button></div>' +
      '<div class="mb">' +
        '<div style="padding:12px 0;border-bottom:1px solid var(--border)">' +
          '<b style="color:var(--purple);font-size:15px">' + esc(userName(root)) + '</b>' +
          '<div class="muted">@' + esc(root.username||'—') + ' · ID ' + esc(root.telegram_id) + '</div>' +
        '</div>' +
        (sub(root) || '<div class="empty" style="padding:20px 0"><p>Нет рефералов</p></div>') +
      '</div>' +
    '</div></div>';
}

function createEra(){ $('modal-root').innerHTML = eraForm(null); }
function editEra(key){
  var e = DATA.eras.filter(function(x){ return x._key === key; })[0];
  if (e) $('modal-root').innerHTML = eraForm(e);
}

async function saveEra(key){
  var title = $('f_title').value.trim();
  if (!title) return toast('Введите название', 'err');
  var price = Number($('f_price').value) || 0;
  var profit = Number($('f_profit').value) || 0;
  var days = Number($('f_days').value) || 20;
  var desc = $('f_desc').value.trim();
  var active = Number($('f_active').value);

  var btn = $('f_save');
  btn.disabled = true;
  btn.textContent = '⏳...';

  try {
    var data = {
      title: title, price: price, profit_amount: profit,
      total_amount: price + profit, duration_days: days,
      description: desc, is_active: active
    };
    if (key){
      var e = DATA.eras.filter(function(x){ return x._key === key; })[0] || {};
      data.id = e.id || key;
      data.sort_order = e.sort_order || data.id;
      await fbPut('eras/' + key, data);
      pushLog('✏️ Изменил эру', title);
    } else {
      var usedIds = DATA.eras.map(function(x){ return Number(x.id||0); }).filter(Boolean);
      var newId = usedIds.length ? Math.max.apply(null, usedIds) + 1 : 1;
      data.id = newId;
      data.sort_order = newId;
      await fbPut('eras/' + newId, data);
      pushLog('➕ Создал эру', title);
    }
    closeModal();
    toast('💾 Сохранено', 'ok');
    renderEras();
  } catch(err){
    toast(err.message, 'err');
    btn.disabled = false;
    btn.textContent = key ? '💾 Сохранить' : '✅ Создать';
  }
}

async function toggleEra(key, active){
  try {
    await fbPatch('eras/' + key, { is_active: active });
    toast(active ? '🟢 Включено' : '⚫ Отключено', 'ok');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}

async function deleteEra(key){
  if (!confirm('Удалить эру?')) return;
  try {
    await fbDelete('eras/' + key);
    pushLog('🗑 Удалил эру', key);
    toast('🗑 Удалено', 'ok');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}

async function renderRefs(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    var res = await Promise.all([
      fbGet('users').then(toList).catch(function(){ return []; }),
      fbGet('purchases').then(toList).catch(function(){ return []; })
    ]);
    DATA.users = res[0]; DATA.purchases = res[1];

    var refs = DATA.users.filter(function(u){ return u.referrer_uid; });
    var inviterIds = {};
    refs.forEach(function(r){ inviterIds[String(r.referrer_uid)] = 1; });
    var inviters = DATA.users.filter(function(u){ return inviterIds[String(u.telegram_id)]; });

    var stat = {};
    inviters.forEach(function(inv){
      var myRefs = getRefs(DATA.users, inv);
      var myIds = {};
      myRefs.forEach(function(r){ myIds[String(r.telegram_id)] = 1; });
      var bonus = 0, appr = 0, paid = 0, cnt = 0, sum = 0;
      DATA.purchases.forEach(function(p){
        if (!myIds[String(p.user_telegram_id)]) return;
        if (['rejected','cancelled'].indexOf(p.status) >= 0) return;
        cnt++;
        sum += Number(p.purchase_price||0);
        var b = Number(p.referral_bonus||0) || Math.round(Number(p.purchase_price||0) * REF_PERCENT / 100);
        var st = p.referral_status || 'pending';
        if (st === 'rejected') return;
        bonus += b;
        if (st === 'paid') paid += b;
        else if (st === 'approved') appr += b;
      });
      stat[inv.telegram_id] = { bonus: bonus, appr: appr, paid: paid, cnt: cnt, sum: sum };
    });

    var totPend = 0, totAppr = 0, totPaid = 0;
    Object.keys(stat).forEach(function(k){
      totPend += stat[k].bonus - stat[k].appr - stat[k].paid;
      totAppr += stat[k].appr;
      totPaid += stat[k].paid;
    });

    layout(
      '<h2 style="font-size:17px;margin-bottom:14px">🌳 Реферальная система</h2>' +
      '<div class="stats" style="margin-bottom:16px">' +
        '<div class="stat"><div class="ic">🌳</div><div class="l">Рефералов</div><div class="v purple">' + refs.length + '</div></div>' +
        '<div class="stat"><div class="ic">🎁</div><div class="l">Пригласивших</div><div class="v ok">' + inviters.length + '</div></div>' +
        '<div class="stat"><div class="ic">⏳</div><div class="l">Ожидает</div><div class="v warn">' + fmt(totPend) + '</div></div>' +
        '<div class="stat"><div class="ic">✅</div><div class="l">Начислено</div><div class="v ok">' + fmt(totAppr) + '</div></div>' +
        '<div class="stat"><div class="ic">💸</div><div class="l">Выплачено</div><div class="v accent">' + fmt(totPaid) + '</div></div>' +
      '</div>' +
      (inviters.length
        ? inviters.map(function(inv){
            var rl = getRefs(DATA.users, inv);
            var s = stat[inv.telegram_id] || {};
            return '<div class="card">' +
              '<div class="row" style="margin-bottom:12px">' +
                '<div><b style="color:var(--purple);font-size:15px">🎁 ' + esc(userName(inv)) + '</b>' +
                  '<div class="muted">' + userLink(inv) + ' · ID ' + esc(inv.telegram_id) + '</div></div>' +
                '<div class="flex">' +
                  '<span class="badge purple">' + rl.length + ' реф.</span>' +
                  '<span class="badge approved">' + fmt(s.bonus||0) + '</span>' +
                '</div>' +
              '</div>' +
              rl.map(function(r){
                return '<div class="ri"><div><b>' + esc(userName(r)) + '</b> · ' + userLink(r) + '</div>' +
                  '<div class="muted">' + fmtDate(r.registered_at) + '</div></div>';
              }).join('') +
            '</div>';
          }).join('')
        : '<div class="empty"><div class="ic">🌳</div><p>Пока нет рефералов</p></div>')
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}

              '<textarea class="input" id="bc_text" rows="6" placeholder="🎉 Скидка 20% только сегодня!" oninput="bcPrev()"></textarea></div>' +
            '<div class="frow"><label>Картинка (URL, опционально)</label>' +
              '<input class="input" id="bc_image" placeholder="https://..." oninput="bcPrev()"></div>' +
            '<div class="frow"><label>Кнопка — текст</label>' +
              '<input class="input" id="bc_btn_text" placeholder="🚀 Открыть" oninput="bcPrev()"></div>' +
            '<div class="frow"><label>Кнопка — ссылка</label>' +
              '<input class="input" id="bc_btn_url" placeholder="https://t.me/ROSTERAbot" oninput="bcPrev()"></div>' +
            '<div class="flex" style="margin-top:16px">' +
              '<button class="btn ghost" onclick="bcSendTest()">🧪 Тест админам</button>' +
              '<button class="btn" onclick="bcSend()">🚀 Отправить</button>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="frow"><label>Предпросмотр</label>' +
              '<div class="bc-prev"><div class="hd">📱 Сообщение</div><div id="bc_prev_body"></div></div></div>' +
          '</div>' +
        '</div>' +
        '<div id="bc_progress" class="hidden" style="margin-top:20px">' +
          '<div class="row" style="margin-bottom:8px">' +
            '<b>📤 Отправка…</b>' +
            '<div class="bc-stat">' +
              '<span>✅ <b id="bc_sent">0</b></span>' +
              '<span>❌ <b id="bc_failed">0</b></span>' +
              '<span>из <b id="bc_total">0</b></span>' +
            '</div>' +
          '</div>' +
          '<div class="bc-prog"><div class="bc-prog-fill" id="bc_fill"></div></div>' +
          '<div class="row"><div class="muted" id="bc_status">Готовим…</div>' +
            '<button class="btn danger sm" onclick="bcStop()">⏹ Стоп</button></div>' +
          '<div class="bc-log hidden" id="bc_log"></div>' +
        '</div>' +
      '</div>'
    );
    bcPrev();
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}

function bcSet(a){ BC_AUD = a; renderBroadcast(); }

function bcPrev(){
  var body = $('bc_prev_body');
  if (!body) return;
  var txt = $('bc_text') ? $('bc_text').value : '';
  var img = $('bc_image') ? $('bc_image').value : '';
  var bt = $('bc_btn_text') ? $('bc_btn_text').value : '';
  var bu = $('bc_btn_url') ? $('bc_btn_url').value : '';

  var html = '';
  if (img) html += '<img class="photo" src="' + esc(img) + '" onerror="this.style.display=\'none\'">';
  html += '<div class="body">' + tgHtml(txt || '<i>Введите текст…</i>') + '</div>';
  if (bt && bu) html += '<div class="btn-prev">' + esc(bt) + '</div>';
  else if (bt) html += '<div class="btn-prev" style="opacity:.5">' + esc(bt) + ' (нет URL)</div>';
  body.innerHTML = html;
}

function tgHtml(text){
  var s = esc(text);
  s = s.replace(/&lt;(\/?)(b|strong|i|em|u|s|code|pre)&gt;/gi, '<$1$2>');
  s = s.replace(/&lt;a\s+href=&quot;([^&]+)&quot;&gt;(.*?)&lt;\/a&gt;/gi,
    '<a href="$1" target="_blank">$2</a>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

async function bcGetRecipients(){
  var users = await fbGet('users').then(toList).catch(function(){ return []; });
  var purchases = await fbGet('purchases').then(toList).catch(function(){ return []; });
  var buyerIds = {};
  purchases.forEach(function(p){ buyerIds[String(p.user_telegram_id)] = 1; });

  var list = users;
  if (BC_AUD === 'agreed') list = users.filter(function(u){ return u.agreed_terms; });
  else if (BC_AUD === 'buyers') list = users.filter(function(u){ return buyerIds[String(u.telegram_id)]; });
  else if (BC_AUD === 'refs') list = users.filter(function(u){ return u.referrer_uid; });

  return list
    .filter(function(u){ return u.telegram_id; })
    .map(function(u){ return { id: u.telegram_id, name: userName(u) }; });
}

async function bcSendTest(){
  var txt = $('bc_text').value.trim();
  if (!txt) return toast('Введите текст', 'err');
  var img = $('bc_image').value.trim();
  var bt = $('bc_btn_text').value.trim();
  var bu = $('bc_btn_url').value.trim();
  var ok = 0, fail = 0;
  for (var i = 0; i < ADMIN_IDS.length; i++){
    try { await bcSendOne(ADMIN_IDS[i], txt, img, bt, bu); ok++; }
    catch(e){ fail++; }
  }
  toast(ok ? '✅ Отправлено ' + ok : '❌ Ошибка ' + fail, ok ? 'ok' : 'err');
}

async function bcSend(){
  if (BC_SENDING) return toast('Уже идёт', 'err');
  var txt = $('bc_text').value.trim();
  if (!txt) return toast('Введите текст', 'err');
  var img = $('bc_image').value.trim();
  var bt = $('bc_btn_text').value.trim();
  var bu = $('bc_btn_url').value.trim();

  var rec = await bcGetRecipients();
  if (!rec.length) return toast('Нет получателей', 'err');
  if (!confirm('Отправить ' + rec.length + ' получателям?')) return;

  BC_SENDING = true;
  BC_STOP = false;
  BC_STATS = { sent:0, failed:0, total: rec.length };

  $('bc_progress').classList.remove('hidden');
  $('bc_log').classList.remove('hidden');
  $('bc_log').innerHTML = '';
  bcProgress(0, rec.length);
  pushLog('📢 Запустил рассылку', 'Получателей: ' + rec.length);

  for (var i = 0; i < rec.length; i++){
    if (BC_STOP) break;
    var r = rec[i];
    try { await bcSendOne(r.id, txt, img, bt, bu); BC_STATS.sent++; }
    catch(e){
      BC_STATS.failed++;
      bcLog('#' + r.id + ' ' + r.name + ': ' + e.message, 'err');
    }
    bcProgress(i+1, rec.length);
    await new Promise(function(res){ setTimeout(res, 50); });
  }

  BC_SENDING = false;
  bcProgress(rec.length, rec.length);
  pushLog('✅ Готово', 'Отправлено ' + BC_STATS.sent + ', ошибок ' + BC_STATS.failed);
  toast('✅ Отправлено ' + BC_STATS.sent + ', ошибок ' + BC_STATS.failed, 'ok', 6000);
}

function bcStop(){ BC_STOP = true; toast('⏹ Стоп…', 'warn'); }

function bcLog(text, cls){
  var box = $('bc_log');
  if (!box) return;
  var d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('ru-RU') + '] ' + text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function bcProgress(done, total){
  if ($('bc_sent')) $('bc_sent').textContent = BC_STATS.sent;
  if ($('bc_failed')) $('bc_failed').textContent = BC_STATS.failed;
  if ($('bc_total')) $('bc_total').textContent = total;
  if ($('bc_fill')) $('bc_fill').style.width = Math.round(done/total*100) + '%';
  if ($('bc_status')){
    $('bc_status').textContent = done >= total
      ? '✅ Готово! Отправлено: ' + BC_STATS.sent + ', ошибок: ' + BC_STATS.failed
      : 'Отправлено ' + done + ' из ' + total + '…';
  }
}

async function bcSendOne(chatId, text, imgUrl, btnText, btnUrl){
  if (imgUrl){
    try {
      return await bcApi('sendPhoto', {
        chat_id: chatId, photo: imgUrl, caption: text, parse_mode: 'HTML',
        reply_markup: (btnText && btnUrl) ? { inline_keyboard: [[{ text: btnText, url: btnUrl }]] } : undefined
      });
    } catch(e){
      if (!/photo|wrong file|failed to get HTTP URL|IMAGE_PROCESS_FAILED/i.test(e.message)) throw e;
    }
  }
  return await bcApi('sendMessage', {
    chat_id: chatId, text: text, parse_mode: 'HTML',
    disable_web_page_preview: true,
    reply_markup: (btnText && btnUrl) ? { inline_keyboard: [[{ text: btnText, url: btnUrl }]] } : undefined
  });
}

async function bcApi(method, body, attempt){
  attempt = attempt || 1;
  if (!body.reply_markup) delete body.reply_markup;
  var r = await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/' + method, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  var data = await r.json();
  if (data.ok) return data.result;
  var desc = data.description || 'unknown';
  if (data.error_code === 429 && attempt <= 3){
    var wait = (data.parameters && data.parameters.retry_after || 2) * 1000;
    await new Promise(function(res){ setTimeout(res, wait); });
    return bcApi(method, body, attempt + 1);
  }
  if (desc.indexOf('chat not found') >= 0 ||
      desc.indexOf('bot was blocked') >= 0 ||
      desc.indexOf('user is deactivated') >= 0 ||
      desc.indexOf("bot can't initiate") >= 0){
    throw new Error('не нажал /start или заблокировал');
  }
  throw new Error(desc);
}

  var tabs = {
    dashboard: renderDashboard,
    purchases: renderPurchases,
    payouts: renderPayouts,
    users: renderUsers,
    eras: renderEras,
    refs: renderRefs,
    broadcast: renderBroadcast
  };
  try {
    await (tabs[TAB] || renderDashboard)();
  } catch(e){
    $('app').innerHTML = '<div style="max-width:600px;margin:60px auto;padding:24px;' +
      'background:#1c2330;border:1px solid #ff5c5c;border-radius:12px;color:#e6edf3">' +
      '<b style="color:#ff5c5c">Ошибка:</b> ' + esc(e.message) + '</div>';
  }
}
