<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Era Admin</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --card3:#232b38;
    --border:#252e3a; --border2:#2f3a48;
    --text:#e6edf3; --text2:#c4ccd6; --muted:#8b949e;
    --accent:#4f8cff; --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  button,input,textarea,select{font-family:inherit}
  .layout{display:flex;min-height:100vh}
  .side{width:210px;background:var(--card);border-right:1px solid var(--border);padding:16px 10px;
    flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .side .logo .ic{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
  .side .logo .t{font-weight:700;font-size:14px}
  .side .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--text2);
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:1px;font-weight:500}
  .side .nav-item:hover{background:var(--card2)}
  .side .nav-item.active{background:var(--accent);color:#fff}
  .side .nav-item .emo{font-size:15px;width:18px;text-align:center}
  .side .nav-item .count{margin-left:auto;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.14);font-size:10px;font-weight:700;min-width:18px;text-align:center}
  .side .section{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:12px 12px 4px}
  .main{flex:1;min-width:0;padding:20px 24px}
  .header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .header h1{font-size:22px;font-weight:700}
  .header .sub{font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px}
  .stat .ic{font-size:22px;margin-bottom:6px}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:3px}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.info{color:var(--info)} .stat .v.accent{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .btn{padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--card2);border:1px solid var(--border2);color:var(--text)}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok);color:#04241a}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;
    font-weight:700;text-transform:uppercase;white-space:nowrap}
  .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.created{background:rgba(99,169,255,.15);color:var(--info)}
  .badge.in_progress{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.approved,.badge.completed,.badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.cancelled,.badge.rejected{background:rgba(255,92,92,.15);color:var(--err)}
  .badge.pending{background:rgba(245,181,71,.15);color:var(--warn)}
  .order-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .order-card .on{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
  .order-card .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin-bottom:11px}
  .meta-item{background:var(--card2);border-radius:8px;padding:8px 10px}
  .meta-item .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:2px}
  .meta-item .v{font-size:12.5px;font-weight:600;word-break:break-word}
  .meta-item .v.ok{color:var(--ok)} .meta-item .v.accent{color:var(--accent)}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .muted{color:var(--muted);font-size:12px}
  .muted-sm{color:var(--muted);font-size:11px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 13px;border-radius:18px;background:var(--card2);border:1px solid var(--border);color:var(--text2);
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toast{position:fixed;top:16px;right:16px;background:var(--card2);border:1px solid var(--border2);padding:12px 18px;
    border-radius:10px;z-index:9999;font-size:13px;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.ok{border-color:rgba(57,217,138,.4);background:#13281f}
  .toast.err{border-color:rgba(255,92,92,.4);background:#2a1618}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .ic{font-size:44px;margin-bottom:10px;opacity:.4}
  .hidden{display:none !important}
  .input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card2);
    color:var(--text);font-size:13px;outline:none}
  .input:focus{border-color:var(--accent)}
  .form-row{margin-bottom:11px}
  .form-row label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;font-weight:600}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal-head{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{font-size:17px;font-weight:700}
  .modal-body{padding:18px}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .close-x{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);color:var(--text2);
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  @media(max-width:768px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:relative;padding:10px;border-right:0;border-bottom:1px solid var(--border);
      display:flex;flex-wrap:wrap;gap:4px}
    .side .logo{width:100%;padding-bottom:10px;margin-bottom:8px}
    .side .section{display:none}
    .side .nav-item{width:auto;padding:8px 12px;font-size:12px;margin-bottom:0}
    .main{padding:14px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script>
const FIREBASE = 'https://velosher-f82b5-default-rtdb.asia-southeast1.firebasedatabase.app';
const PAGE = 20;

const $ = id => document.getElementById(id);
let TAB = 'dashboard';
const DATA = { purchases: null, payouts: null, eras: null, users: null };
let FILTER = { purchases: 'all', payouts: 'all', search: '' };
let LIM = { purchases: PAGE, payouts: PAGE, users: PAGE };
const BUSY = new Set();

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function q(v){ return esc(JSON.stringify(v ?? '')); }
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
function fmt(n){ return num(n).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  const d = new Date(s); if (isNaN(d)) return String(s);
  return d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDT(s){
  if (!s) return '—';
  const d = new Date(s); if (isNaN(d)) return String(s);
  return d.toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function statusLabel(s){
  return ({created:'Создан', in_progress:'В процессе', approved:'Одобрен',
    completed:'Завершён', paid:'Выплачен', cancelled:'Отменён',
    pending:'Ожидает', rejected:'Отклонён'})[s] || s;
}
function toast(msg, type='ok', ms=2500){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast hidden', ms);
}
function showModal(html){ $('modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('modal-root').innerHTML = ''; }
async function once(key, fn){
  if (BUSY.has(key)) return;
  BUSY.add(key);
  try { await fn(); } catch(e){ toast(e.message, 'err'); }
  finally { BUSY.delete(key); }
}

// Firebase
async function fbGet(path){
  const r = await fetch(`${FIREBASE}/${path}.json`);
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbPatch(path, data){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'PATCH', body: JSON.stringify(data)});
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbPut(path, data){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'PUT', body: JSON.stringify(data)});
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbDelete(path){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'DELETE'});
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
function toList(raw){
  if (Array.isArray(raw)) return raw.filter(x => x && typeof x === 'object').map((v, i) => ({...v, _key: String(i)}));
  if (raw && typeof raw === 'object')
    return Object.entries(raw).filter(([, v]) => v && typeof v === 'object').map(([k, v]) => ({...v, _key: k}));
  return [];
}

// ============================================================
// ОБОЛОЧКА
// ============================================================
function shell(){
  const nav = (tab, emo, label, cnt) => `
    <button class="nav-item" data-tab="${tab}" onclick="setTab('${tab}')">
      <span class="emo">${emo}</span>${label}${cnt ? `<span class="count hidden" id="cnt-${tab}"></span>` : ''}
    </button>`;
  $('root').innerHTML = `
    <div class="layout">
      <aside class="side">
        <div class="logo"><div class="ic">⚡</div>
          <div><div class="t">Era Admin</div></div></div>
        <div class="section">Обзор</div>
        ${nav('dashboard','📊','Дашборд')}
        <div class="section">Операции</div>
        ${nav('purchases','📩','Заявки',1)}
        ${nav('payouts','💸','Выплаты',1)}
        <div class="section">Управление</div>
        ${nav('users','👥','Пользователи')}
        ${nav('eras','🧩','Товары')}
        <div class="section"></div>
        <button class="nav-item" onclick="location.reload()">
          <span class="emo">🔄</span>Обновить</button>
      </aside>
      <main class="main" id="main"></main>
    </div>`;
}
function setMain(html){ $('main').innerHTML = html; }
function emptyBlock(icon, title, text='', extra=''){
  return `<div class="empty"><div class="ic">${icon}</div><h3>${title}</h3>
    ${text ? `<p class="muted" style="margin:8px 0">${text}</p>` : ''}${extra}</div>`;
}

// ============================================================
// ВКЛАДКИ
// ============================================================
const LOADERS = {
  dashboard: async () => {
    const [p, po, e, u] = await Promise.all([fbGet('purchases'), fbGet('payouts'), fbGet('eras'), fbGet('users')]);
    DATA.purchases = toList(p).sort((a,b) => num(b.id) - num(a.id));
    DATA.payouts = toList(po).sort((a,b) => num(b.id) - num(a.id));
    DATA.eras = toList(e);
    DATA.users = toList(u);
    return drawDashboard;
  },
  purchases: async () => {
    DATA.purchases = toList(await fbGet('purchases')).sort((a,b) => num(b.id) - num(a.id));
    return drawPurchases;
  },
  payouts: async () => {
    DATA.payouts = toList(await fbGet('payouts')).sort((a,b) => num(b.id) - num(a.id));
    return drawPayouts;
  },
  users: async () => {
    const [u, p] = await Promise.all([fbGet('users'), fbGet('purchases')]);
    DATA.users = toList(u);
    DATA.purchases = toList(p);
    return drawUsers;
  },
  eras: async () => {
    DATA.eras = toList(await fbGet('eras')).sort((a,b) => (num(a.sort_order) - num(b.sort_order)) || (num(a.id) - num(b.id)));
    return drawEras;
  },
};

async function render(){
  const target = TAB;
  $('main').innerHTML = '<div class="loading">Загрузка…</div>';
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === target));
  try {
    const draw = await LOADERS[target]();
    if (TAB !== target) return;
    draw();
    updateCounts();
  } catch(e){
    setMain(emptyBlock('⚠️', 'Ошибка', esc(e.message), `<button class="btn" onclick="render()">🔄 Повторить</button>`));
  }
}
function updateCounts(){
  if (DATA.purchases){
    const c = DATA.purchases.filter(p => p.status === 'created').length;
    const el = $('cnt-purchases');
    if (el){ el.textContent = c; el.classList.toggle('hidden', !c); }
  }
  if (DATA.payouts){
    const c = DATA.payouts.filter(p => p.status === 'pending').length;
    const el = $('cnt-payouts');
    if (el){ el.textContent = c; el.classList.toggle('hidden', !c); }
  }
}
function setTab(t){
  TAB = t;
  FILTER.search = '';
  LIM = { purchases: PAGE, payouts: PAGE, users: PAGE };
  render();
}
window.setTab = setTab;
window.closeModal = closeModal;

// ============================================================
// DASHBOARD
// ============================================================
function drawDashboard(){
  const P = DATA.purchases, PO = DATA.payouts;
  const byStatus = k => P.filter(p => p.status === k).length;
  const totalSum = P.filter(p => p.status !== 'cancelled').reduce((s,p) => s + num(p.purchase_price), 0);
  const pendingPayouts = PO.filter(p => p.status === 'pending');
  const pendingSum = pendingPayouts.reduce((s,p) => s + num(p.amount), 0);
  setMain(`
    <div class="header">
      <div><h1>📊 Дашборд</h1><div class="sub">Общая статистика</div></div>
      <button class="btn secondary sm" onclick="render()">🔄 Обновить</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="ic">👥</div><div class="l">Пользователей</div><div class="v">${DATA.users.length}</div></div>
      <div class="stat"><div class="ic">📩</div><div class="l">Всего заявок</div><div class="v">${P.length}</div></div>
      <div class="stat"><div class="ic">🔵</div><div class="l">Созданных</div><div class="v info">${byStatus('created')}</div></div>
      <div class="stat"><div class="ic">🟢</div><div class="l">Одобрено</div><div class="v ok">${byStatus('approved')}</div></div>
      <div class="stat"><div class="ic">🏁</div><div class="l">Завершено</div><div class="v ok">${byStatus('completed')}</div></div>
      <div class="stat"><div class="ic">💸</div><div class="l">Выплат ждут</div><div class="v warn">${pendingPayouts.length}</div></div>
      <div class="stat"><div class="ic">💵</div><div class="l">Сумма покупок</div><div class="v accent">${fmt(totalSum)}</div></div>
      <div class="stat"><div class="ic">💰</div><div class="l">К выплате</div><div class="v warn">${fmt(pendingSum)}</div></div>
    </div>`);
}

// ============================================================
// PURCHASES
// ============================================================
function drawPurchases(){
  const P = DATA.purchases;
  const c = { all: P.length };
  ['created','in_progress','approved','completed','cancelled'].forEach(k => c[k] = P.filter(p => p.status === k).length);
  const tabs = [
    ['all','📋 Все'],['created','🔵 Созданные'],['in_progress','🟡 В процессе'],
    ['approved','🟢 Одобренные'],['completed','🏁 Завершённые'],['cancelled','❌ Отменённые']
  ];
  setMain(`
    <div class="header">
      <div><h1>📩 Заявки</h1><div class="sub" id="sub"></div></div>
      <button class="btn secondary sm" onclick="render()">🔄 Обновить</button>
    </div>
    <div class="tabs">${tabs.map(([k, l]) =>
      `<button class="tab ${FILTER.purchases === k ? 'active' : ''}" onclick="setFilter('${k}')">${l} (${c[k]})</button>`).join('')}</div>
    <div class="card" style="padding:10px">
      <input class="input" placeholder="🔍 Поиск: имя, @username, ID…" value="${esc(FILTER.search)}"
        oninput="onSearch(this.value)">
    </div>
    <div id="list"></div>`);
  fillPurchases();
}
function purchaseFiltered(){
  const f = FILTER.purchases, s = FILTER.search.trim().toLowerCase();
  return DATA.purchases.filter(p => {
    if (f !== 'all' && p.status !== f) return false;
    if (!s) return true;
    return (p.user_first_name || '').toLowerCase().includes(s) ||
           (p.user_username || '').toLowerCase().includes(s) ||
           String(p.id).includes(s) ||
           String(p.user_telegram_id || '').includes(s);
  });
}
function fillPurchases(){
  const list = purchaseFiltered();
  const lim = LIM.purchases;
  $('sub').textContent = `Всего: ${DATA.purchases.length} · Показано: ${list.length}`;
  $('list').innerHTML = list.length
    ? list.slice(0, lim).map(orderCard).join('') + moreBtn('purchases', list.length - lim)
    : emptyBlock('📭', 'Заявок нет');
}
function moreBtn(name, left){
  return left > 0 ? `<div style="text-align:center;margin:14px 0">
    <button class="btn secondary" onclick="more('${name}')">Показать ещё (${left})</button></div>` : '';
}
function more(name){ LIM[name] += PAGE; name === 'purchases' ? fillPurchases() : name === 'payouts' ? fillPayouts() : fillUsers(); }
function setFilter(v){ FILTER.purchases = v; LIM.purchases = PAGE; drawPurchases(); }
let SEARCH_TIMER;
function onSearch(v){ FILTER.search = v; LIM.purchases = PAGE; clearTimeout(SEARCH_TIMER); SEARCH_TIMER = setTimeout(fillPurchases, 150); }
window.setFilter = setFilter; window.onSearch = onSearch; window.more = more;

function orderCard(p){
  return `
    <div class="order-card">
      <div class="row" style="align-items:flex-start;margin-bottom:10px">
        <div class="on">📩 Заявка #${esc(p.id)}</div>
        <span class="badge ${esc(p.status)}">${esc(statusLabel(p.status))}</span>
      </div>
      <div class="meta">
        <div class="meta-item"><div class="l">👤 Имя</div><div class="v">${esc(p.user_first_name || '—')}</div></div>
        <div class="meta-item"><div class="l">🔗 Username</div><div class="v">@${esc(p.user_username || '—')}</div></div>
        <div class="meta-item"><div class="l">🆔 TG ID</div><div class="v">${esc(p.user_telegram_id || '—')}</div></div>
        <div class="meta-item"><div class="l">💳 Эра</div><div class="v">${esc(p.era_title)}</div></div>
        <div class="meta-item"><div class="l">💵 Цена</div><div class="v accent">${fmt(p.purchase_price)}</div></div>
        <div class="meta-item"><div class="l">💰 Начисл.</div><div class="v ok">+${fmt(p.profit_amount)}</div></div>
        <div class="meta-item"><div class="l">🏆 Итого</div><div class="v ok">${fmt(p.total_amount)}</div></div>
        <div class="meta-item"><div class="l">📅 Срок</div><div class="v">${num(p.duration_days)} дней</div></div>
      </div>
      <div class="muted-sm" style="margin-bottom:10px">
        🕐 ${fmtDT(p.created_at)}
        ${p.activated_at ? '<br>✅ Подтверждено: ' + fmtDT(p.activated_at) : ''}
        ${p.start_date ? '<br>📅 Начало: ' + fmtDate(p.start_date) : ''}
        ${p.last_day ? ' · 🏁 Последний: ' + fmtDate(p.last_day) : ''}
        ${p.expires_at ? ' · ⏰ Завершение: ' + fmtDate(p.expires_at) : ''}
      </div>
      <div class="flex">
        ${p.status === 'created' || p.status === 'in_progress' ? `
          ${p.status === 'created' ? `<button class="btn secondary sm" onclick="setStatus(${q(p._key)}, 'in_progress')">🟡 В процессе</button>` : ''}
          <button class="btn ok sm" onclick="approvePurchase(${q(p._key)})">🟢 Одобрить</button>
          <button class="btn danger sm" onclick="setStatus(${q(p._key)}, 'cancelled')">❌ Отменить</button>
        ` : ''}
        ${p.status === 'approved' ? `
          <button class="btn sm" onclick="setStatus(${q(p._key)}, 'completed')">🏁 Завершить</button>
          <button class="btn danger sm" onclick="setStatus(${q(p._key)}, 'cancelled')">❌ Отменить</button>
        ` : ''}
        ${p.user_username ? `<a class="btn ghost sm" href="https://t.me/${esc(p.user_username)}" target="_blank">💬 Написать</a>` : ''}
      </div>
    </div>`;
}

window.setStatus = (key, status) => once('p' + key + status, async () => {
  if (!confirm(`Изменить статус на "${statusLabel(status)}"?`)) return;
  await fbPatch(`purchases/${key}`, {status, status_changed_at: new Date().toISOString()});
  // локальное обновление
  const p = DATA.purchases.find(x => x._key === key);
  if (p){ p.status = status; p.status_changed_at = new Date().toISOString(); }
  toast(`✅ → ${statusLabel(status)}`);
  drawPurchases();
  updateCounts();
});

window.approvePurchase = key => once('ap' + key, async () => {
  if (!confirm('Одобрить заявку?')) return;
  const p = DATA.purchases.find(x => x._key === key);
  if (!p) return;
  const now = new Date();
  const tzNow = new Date(now.getTime() + 5*3600*1000);
  const y = tzNow.getUTCFullYear(), m = tzNow.getUTCMonth(), d = tzNow.getUTCDate();
  const first = new Date(Date.UTC(y, m, d+1, 0, 0, 0) - 5*3600*1000);
  const days = num(p.duration_days);
  const last = new Date(first.getTime() + (days - 1) * 86400000);
  const expires = new Date(last.getTime() + 86400000);
  const patch = {
    status: 'approved',
    activated_at: now.toISOString(),
    start_date: first.toISOString(),
    last_day: last.toISOString(),
    expires_at: expires.toISOString(),
    status_changed_at: now.toISOString(),
  };
  await fbPatch(`purchases/${key}`, patch);
  Object.assign(p, patch);
  toast('🟢 Одобрено');
  drawPurchases();
  updateCounts();
});

// ============================================================
// PAYOUTS
// ============================================================
function drawPayouts(){
  const P = DATA.payouts;
  const c = { all: P.length };
  ['pending','paid','rejected'].forEach(k => c[k] = P.filter(p => p.status === k).length);
  const tabs = [['all','📋 Все'],['pending','⏳ Ожидают'],['paid','✅ Выплачено'],['rejected','❌ Отклонено']];
  const f = FILTER.payouts;
  setMain(`
    <div class="header">
      <div><h1>💸 Выплаты</h1><div class="sub">Всего: ${c.all}</div></div>
      <button class="btn secondary sm" onclick="render()">🔄 Обновить</button>
    </div>
    <div class="tabs">${tabs.map(([k, l]) =>
      `<button class="tab ${f === k ? 'active' : ''}" onclick="setPayFilter('${k}')">${l} (${c[k]})</button>`).join('')}</div>
    <div id="list"></div>`);
  fillPayouts();
}
function fillPayouts(){
  const f = FILTER.payouts;
  const list = f === 'all' ? DATA.payouts : DATA.payouts.filter(p => p.status === f);
  const lim = LIM.payouts;
  $('list').innerHTML = list.length
    ? list.slice(0, lim).map(payoutCard).join('') + moreBtn('payouts', list.length - lim)
    : emptyBlock('📭', 'Заявок нет');
}
function setPayFilter(v){ FILTER.payouts = v; LIM.payouts = PAGE; drawPayouts(); }
window.setPayFilter = setPayFilter;

function payoutCard(po){
  return `
    <div class="order-card">
      <div class="row" style="align-items:flex-start;margin-bottom:10px">
        <div class="on">💸 Вывод #${esc(po.id)}</div>
        <span class="badge ${esc(po.status)}">${esc(statusLabel(po.status))}</span>
      </div>
      <div class="meta">
        <div class="meta-item"><div class="l">📄 Покупка</div><div class="v">#${esc(po.purchase_id)}</div></div>
        <div class="meta-item"><div class="l">👤 Участник</div><div class="v">${esc(po.user_first_name || '—')}</div></div>
        <div class="meta-item"><div class="l">🔗 Никнейм</div><div class="v">@${esc(po.user_username || '—')}</div></div>
        <div class="meta-item"><div class="l">🆔 TG ID</div><div class="v">${esc(po.user_telegram_id || '—')}</div></div>
        <div class="meta-item"><div class="l">💳 Эра</div><div class="v">${esc(po.era_title || '—')}</div></div>
        <div class="meta-item"><div class="l">💵 Куплено</div><div class="v">${fmt(po.purchase_price)}</div></div>
        <div class="meta-item"><div class="l">💰 К выводу</div><div class="v ok">${fmt(po.amount)}</div></div>
      </div>
      <div class="muted-sm" style="margin-bottom:10px">
        📅 ${fmtDT(po.requested_at)}
        ${po.paid_at ? '<br>✅ ' + fmtDT(po.paid_at) : ''}
        ${po.rejected_at ? '<br>❌ ' + fmtDT(po.rejected_at) + ' — ' + esc(po.reject_reason || '') : ''}
      </div>
      <div class="flex">
        ${po.status === 'pending' ? `
          <button class="btn ok sm" onclick="markPayoutPaid(${q(po._key)}, ${q(po.id)})">✅ Подтвердить выплату</button>
          <button class="btn danger sm" onclick="rejectPayout(${q(po._key)}, ${q(po.id)})">❌ Отклонить</button>
        ` : ''}
        ${po.user_username ? `<a class="btn ghost sm" href="https://t.me/${esc(po.user_username)}" target="_blank">👤 Связаться</a>` : ''}
      </div>
    </div>`;
}

window.markPayoutPaid = (key, id) => once('po' + key, async () => {
  if (!confirm(`Подтвердить выплату #${id}?\n\nНажимайте только после фактического перевода.`)) return;
  const po = DATA.payouts.find(x => x._key === key);
  if (!po) return;
  await fbPatch(`payouts/${key}`, {status: 'paid', paid_at: new Date().toISOString()});
  po.status = 'paid';
  po.paid_at = new Date().toISOString();
  const pk = DATA.purchases?.find(p => String(p.id) === String(po.purchase_id))?._key;
  if (pk) await fbPatch(`purchases/${pk}`, {status: 'paid', paid_at: new Date().toISOString()});
  toast('✅ Выплата подтверждена');
  drawPayouts();
  updateCounts();
});

window.rejectPayout = (key, id) => once('por' + key, async () => {
  const reason = prompt('Причина отклонения:', 'Не указана');
  if (reason === null) return;
  await fbPatch(`payouts/${key}`, {
    status: 'rejected',
    rejected_at: new Date().toISOString(),
    reject_reason: reason || 'Не указана',
  });
  const po = DATA.payouts.find(x => x._key === key);
  if (po){ po.status = 'rejected'; po.rejected_at = new Date().toISOString(); po.reject_reason = reason; }
  toast('❌ Отклонено');
  drawPayouts();
  updateCounts();
});

// ============================================================
// USERS
// ============================================================
function drawUsers(){
  setMain(`
    <div class="header">
      <div><h1>👥 Пользователи</h1><div class="sub" id="sub"></div></div>
      <button class="btn secondary sm" onclick="render()">🔄 Обновить</button>
    </div>
    <div class="card" style="padding:10px">
      <input class="input" placeholder="🔍 Поиск: имя, @username, ID…" value="${esc(FILTER.search)}"
        oninput="onUserSearch(this.value)">
    </div>
    <div id="list"></div>`);
  fillUsers();
}
function userFiltered(){
  const s = FILTER.search.trim().toLowerCase();
  if (!s) return DATA.users;
  return DATA.users.filter(u =>
    (u.first_name || '').toLowerCase().includes(s) ||
    (u.username || '').toLowerCase().includes(s) ||
    String(u.telegram_id || '').includes(s));
}
function fillUsers(){
  const list = userFiltered();
  const lim = LIM.users;
  $('sub').textContent = `Всего: ${DATA.users.length} · Показано: ${list.length}`;
  $('list').innerHTML = list.length
    ? list.slice(0, lim).map(userCard).join('') + moreBtn('users', list.length - lim)
    : emptyBlock('👤', 'Пользователей нет');
}
function onUserSearch(v){ FILTER.search = v; LIM.users = PAGE; clearTimeout(SEARCH_TIMER); SEARCH_TIMER = setTimeout(fillUsers, 150); }
window.onUserSearch = onUserSearch;

function userCard(u){
  const ps = (DATA.purchases || []).filter(p => String(p.user_telegram_id) === String(u.telegram_id));
  const invested = ps.filter(p => p.status !== 'cancelled').reduce((s,p) => s + num(p.purchase_price), 0);
  const earned = ps.filter(p => p.status === 'completed' || p.status === 'paid').reduce((s,p) => s + num(p.total_amount), 0);
  const invited = (DATA.users || []).filter(x => String(x.referrer_uid || '') === String(u.telegram_id)).length;
  const initial = (u.first_name || u.username || '?')[0].toUpperCase();
  return `
    <div class="order-card">
      <div class="flex" style="margin-bottom:10px">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--card3);display:flex;align-items:center;
          justify-content:center;font-size:17px;font-weight:700;color:var(--accent);overflow:hidden;flex-shrink:0">
          ${u.photo_url ? `<img src="${esc(u.photo_url)}" style="width:100%;height:100%;object-fit:cover">` : esc(initial)}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">${esc(u.first_name || 'Без имени')}</div>
          <div class="muted-sm">@${esc(u.username || '—')} · ID ${esc(u.telegram_id || '—')}</div>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item"><div class="l">Вложено</div><div class="v accent">${fmt(invested)}</div></div>
        <div class="meta-item"><div class="l">Выплачено</div><div class="v ok">${fmt(earned)}</div></div>
        <div class="meta-item"><div class="l">Заявок</div><div class="v">${ps.length}</div></div>
        <div class="meta-item"><div class="l">Рефералов</div><div class="v">${invited}</div></div>
      </div>
      <div class="muted-sm">📅 ${fmtDT(u.registered_at)}</div>
      ${u.username ? `<div class="flex" style="margin-top:10px">
        <a class="btn ghost sm" href="https://t.me/${esc(u.username)}" target="_blank">💬 Написать</a>
      </div>` : ''}
    </div>`;
}

// ============================================================
// ERAS
// ============================================================
function drawEras(){
  const E = DATA.eras;
  setMain(`
    <div class="header">
      <div><h1>🧩 Товары (Эры)</h1><div class="sub">Всего: ${E.length}</div></div>
      <div class="flex">
        <button class="btn secondary sm" onclick="render()">🔄 Обновить</button>
        <button class="btn" onclick="openEraModal()">➕ Создать</button>
      </div>
    </div>
    ${E.length ? E.map(eraCard).join('') : emptyBlock('📦', 'Товаров нет',
      'Создайте первую эру', `<button class="btn" onclick="openEraModal()" style="margin-top:12px">➕ Создать</button>`)}`);
}
function eraCard(e){
  const roi = e.price > 0 ? Math.round((e.profit_amount / e.price) * 100) : 0;
  return `
    <div class="order-card">
      <div class="row" style="align-items:flex-start;margin-bottom:10px">
        <div><div class="on">🧩 ${esc(e.title)}</div><div class="muted-sm">ID ${esc(e.id)}</div></div>
        <span class="badge ${e.is_active ? 'approved' : 'cancelled'}">${e.is_active ? '🟢 Активна' : '⚫ Отключена'}</span>
      </div>
      <div class="meta">
        <div class="meta-item"><div class="l">💵 Цена</div><div class="v accent">${fmt(e.price)}</div></div>
        <div class="meta-item"><div class="l">💰 Начисл.</div><div class="v ok">+${fmt(e.profit_amount)}</div></div>
        <div class="meta-item"><div class="l">🏆 Итого</div><div class="v ok">${fmt(e.price + e.profit_amount)}</div></div>
        <div class="meta-item"><div class="l">📅 Срок</div><div class="v">${num(e.duration_days)} дней</div></div>
        <div class="meta-item"><div class="l">📈 ROI</div><div class="v ok">+${roi}%</div></div>
      </div>
      <div class="flex">
        <button class="btn sm" onclick="openEraModal(${q(e._key)})">✏️ Изменить</button>
        <button class="btn danger sm" onclick="deleteEra(${q(e._key)}, ${q(e.title)})">🗑 Удалить</button>
      </div>
    </div>`;
}
window.openEraModal = function(key){
  const e = key ? DATA.eras.find(x => x._key === key) : null;
  showModal(`
    <div class="modal-head"><h2>${e ? '✏️ Изменить' : '➕ Создать'} эру</h2>
      <button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>Название</label>
        <input class="input" id="f_title" value="${esc(e?.title || 'Новая эра')}"></div>
      <div class="grid2">
        <div class="form-row"><label>Цена (₽)</label>
          <input class="input" id="f_price" type="number" value="${e?.price || 1500}"></div>
        <div class="form-row"><label>Срок (дней)</label>
          <input class="input" id="f_duration" type="number" value="${e?.duration_days || 20}"></div>
      </div>
      <div class="form-row"><label>Начисление (₽)</label>
        <input class="input" id="f_profit" type="number" value="${e?.profit_amount || 1000}"></div>
      <div class="form-row"><label>Описание</label>
        <textarea class="input" id="f_description" rows="3">${esc(e?.description || '')}</textarea></div>
      <div class="form-row"><label>Активна</label>
        <select class="input" id="f_active">
          <option value="1" ${(!e || e.is_active) ? 'selected' : ''}>Да</option>
          <option value="0" ${(e && !e.is_active) ? 'selected' : ''}>Нет</option>
        </select></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveEra(${q(key || '')})">💾 Сохранить</button>
    </div>`);
};
window.saveEra = key => once('save' + (key || 'new'), async () => {
  const title = $('f_title').value.trim();
  if (!title){ toast('Введите название', 'err'); return; }
  const body = {
    title,
    price: num($('f_price').value),
    duration_days: Math.round(num($('f_duration').value)),
    profit_amount: num($('f_profit').value),
    total_amount: num($('f_price').value) + num($('f_profit').value),
    description: $('f_description').value,
    is_active: $('f_active').value === '0' ? 0 : 1,
  };
  if (key){
    const old = DATA.eras.find(x => x._key === key);
    body.id = old?.id || num(key);
    body.sort_order = old?.sort_order || body.id;
    await fbPut(`eras/${key}`, body);
    toast('💾 Обновлено');
  } else {
    const newId = DATA.eras.length ? Math.max(...DATA.eras.map(x => num(x.id))) + 1 : 1;
    body.id = newId; body.sort_order = newId;
    await fbPut(`eras/${newId}`, body);
    toast(`✅ Эра #${newId} создана`);
  }
  closeModal();
  render();
});
window.deleteEra = (key, title) => once('del' + key, async () => {
  if (!confirm(`🗑 Удалить "${title}"?`)) return;
  await fbDelete(`eras/${key}`);
  toast('🗑 Удалено');
  render();
});

// ============================================================
// СТАРТ
// ============================================================
shell();
render();
</script>
</body>
</html>
