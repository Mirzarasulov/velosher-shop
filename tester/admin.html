<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Era Admin</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --card3:#232b38;
    --border:#252e3a; --border2:#2f3a48;
    --text:#e6edf3; --text2:#c4ccd6; --muted:#8b949e;
    --accent:#4f8cff; --accent2:#356fd8;
    --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font-family:inherit}
  .layout{display:flex;min-height:100vh}

  .side{width:220px;background:var(--card);border-right:1px solid var(--border);
    padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;
    border-bottom:1px solid var(--border);margin-bottom:12px}
  .side .logo .ic{width:34px;height:34px;border-radius:9px;
    background:var(--accent);display:flex;align-items:center;
    justify-content:center;font-size:16px;color:#fff}
  .side .logo .t{font-weight:700;font-size:14px}
  .side .logo .s{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:600}
  .side .nav-item{display:flex;align-items:center;gap:9px;width:100%;
    text-align:left;background:none;border:0;color:var(--text2);
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;
    margin-bottom:1px;font-weight:500;transition:background .1s}
  .side .nav-item:hover{background:var(--card2)}
  .side .nav-item.active{background:var(--accent);color:#fff}
  .side .nav-item .emo{font-size:15px;width:18px;text-align:center}
  .side .nav-item .count{margin-left:auto;padding:1px 7px;border-radius:9px;
    background:rgba(255,255,255,.12);font-size:10px;font-weight:700;min-width:18px;
    text-align:center}
  .side .section{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:700;padding:12px 12px 4px}

  .main{flex:1;padding:20px 24px;max-width:100%;overflow-x:hidden}
  .header{display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .header h1{font-size:22px;font-weight:700;margin-bottom:2px}
  .header .sub{font-size:12px;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:10px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:11px;
    padding:14px}
  .stat .ic{font-size:22px;margin-bottom:6px}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;margin-bottom:3px}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v.ok{color:var(--ok)}
  .stat .v.warn{color:var(--warn)}
  .stat .v.info{color:var(--info)}
  .stat .v.accent{color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:14px}

  .btn{padding:8px 14px;border-radius:8px;border:0;
    background:var(--accent);color:#fff;
    font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;font-family:inherit;
    transition:opacity .15s}
  .btn:hover{opacity:.9}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--card2);border:1px solid var(--border2);color:var(--text)}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok);color:#04241a}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .btn.xs{padding:4px 8px;font-size:11px}

  .input{width:100%;padding:9px 11px;border-radius:8px;
    border:1px solid var(--border);background:var(--card2);color:var(--text);
    font-size:13px;outline:none;transition:border-color .15s}
  .input:focus{border-color:var(--accent)}
  .form-row{margin-bottom:11px}
  .form-row label{display:block;font-size:10.5px;color:var(--muted);
    margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .muted{color:var(--muted);font-size:12px}
  .muted-sm{color:var(--muted);font-size:11px}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
    border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
    text-transform:uppercase;white-space:nowrap}
  .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.awaiting_payment{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.active{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.completed{background:rgba(99,169,255,.15);color:var(--info)}
  .badge.awaiting_payout{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.cancelled{background:rgba(255,92,92,.15);color:var(--err)}
  .badge.pending{background:rgba(245,181,71,.15);color:var(--warn)}

  .user-card{background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:14px;margin-bottom:10px}
  .user-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--card3);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
    color:var(--accent);border:2px solid var(--border2);overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .user-info{min-width:0;flex:1}
  .user-info .n{font-size:14px;font-weight:700;margin-bottom:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-info .u{font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
    gap:7px;margin-bottom:11px}
  .user-stat{background:var(--card2);border-radius:8px;padding:8px 10px;
    border:1px solid var(--border)}
  .user-stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;margin-bottom:2px}
  .user-stat .v{font-size:14px;font-weight:700}
  .user-stat .v.ok{color:var(--ok)}
  .user-stat .v.accent{color:var(--accent)}
  .user-stat .v.warn{color:var(--warn)}

  .order-card{background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:14px;margin-bottom:10px}
  .order-card.processed{background:var(--card2)}
  .order-card .on{font-size:15px;font-weight:700;color:var(--accent);
    margin-bottom:8px}
  .order-card .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:7px;margin-bottom:11px}
  .meta-item{background:var(--card2);border-radius:8px;padding:8px 10px}
  .meta-item .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;font-weight:600;margin-bottom:2px}
  .meta-item .v{font-size:12.5px;font-weight:600}
  .meta-item .v.ok{color:var(--ok)}
  .meta-item .v.warn{color:var(--warn)}
  .meta-item .v.accent{color:var(--accent)}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);
    z-index:999;display:flex;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto}
  .modal{background:var(--card);border:1px solid var(--border2);
    border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-head{padding:18px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:var(--card);z-index:1}
  .modal-head h2{font-size:17px;font-weight:700}
  .modal-body{padding:18px}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--border);
    display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;
    background:var(--card)}
  .close-x{width:32px;height:32px;border-radius:50%;background:var(--card2);
    border:1px solid var(--border2);color:var(--text2);font-size:16px;
    cursor:pointer;display:flex;align-items:center;justify-content:center}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px}
  .login-box{background:var(--card);border:1px solid var(--border2);
    border-radius:16px;padding:32px;width:100%;max-width:380px}
  .login-box .ic{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    font-size:26px;color:#fff}
  .login-box h1{font-size:20px;margin-bottom:4px;text-align:center}
  .login-box .s{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}

  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 13px;border-radius:18px;background:var(--card2);
    border:1px solid var(--border);color:var(--text2);font-size:12px;
    font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .toast{position:fixed;top:16px;right:16px;background:var(--card2);
    border:1px solid var(--border2);padding:12px 18px;border-radius:10px;
    z-index:9999;font-size:13px;font-weight:500;max-width:300px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .2s ease}
  .toast.ok{border-color:rgba(57,217,138,.4);background:rgba(57,217,138,.1)}
  .toast.err{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.1)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .ic{font-size:44px;margin-bottom:10px;opacity:.4}
  .hidden{display:none !important}
  .search-bar{position:relative;margin-bottom:14px}
  .search-bar input{padding-left:34px}
  .search-bar::before{content:'🔍';position:absolute;left:11px;top:50%;
    transform:translateY(-50%);font-size:13px;opacity:.6;pointer-events:none}

  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);
    border-top-color:#fff;border-radius:50%;animation:sp .65s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.04em}

  @media(max-width:768px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:relative;padding:10px;
      border-right:0;border-bottom:1px solid var(--border);
      display:flex;flex-wrap:wrap;gap:4px}
    .side .logo{width:100%;padding-bottom:10px;margin-bottom:8px}
    .side .section{display:none}
    .side .nav-item{width:auto;padding:8px 12px;font-size:12px;margin-bottom:0}
    .main{padding:14px}
    .header h1{font-size:19px}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const API = localStorage.getItem('admin_api') || 'http://localhost:8000';
const LOG_CHANNEL_URL = 'https://t.me/c/4305451466';
// ============================================================

let TOKEN = localStorage.getItem('admin_token') || '';
let TAB = 'dashboard';
let CACHE = { users: [], purchases: [], payouts: [], eras: [], logs: [] };
let FILTER = { purchases: 'pending', payouts: 'pending', search: '' };
let CACHE_TIME = 0;
let REFRESH_TIMER = null;

// ---------- SAFE HELPERS ----------
function $(id){ return document.getElementById(id); }

// ---------- TOAST ----------
function toast(msg, type='ok', ms=2500){
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.className = 'toast hidden'; }, ms);
}

// ---------- MODAL ----------
function showModal(html){
  const root = $('modal-root');
  if (!root) return;
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">${html}</div>
    </div>
  `;
}
function closeModal(){
  const r = $('modal-root');
  if (r) r.innerHTML = '';
}

// ---------- API ----------
async function api(path, opts={}){
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  headers['ngrok-skip-browser-warning'] = 'true';
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try {
    res = await fetch(API + path, {...opts, headers});
  } catch(e){
    throw new Error('Сервер недоступен');
  }
  if (res.status === 401){ logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || 'Ошибка');
  return data;
}

function logout(){
  localStorage.removeItem('admin_token'); TOKEN = ''; location.reload();
}

function invalidateCache(){ CACHE_TIME = 0; }

// ============================================================
// LOGIN
// ============================================================
function renderLogin(){
  $('root').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="ic">⚡</div>
        <h1>Era Admin</h1>
        <div class="s">Панель управления проектом</div>
        <div class="form-row">
          <label>Логин</label>
          <input class="input" id="login" value="admin">
        </div>
        <div class="form-row">
          <label>Пароль</label>
          <input class="input" id="password" type="password"
            onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn" style="width:100%;justify-content:center;padding:11px;font-size:13.5px"
          onclick="doLogin()">Войти</button>
        <div class="form-row" style="margin-top:14px">
          <label>API URL</label>
          <input class="input" id="api_url" value="${esc(API)}"
            onchange="localStorage.setItem('admin_api',this.value);toast('API сохранён');">
        </div>
      </div>
    </div>
  `;
}

async function doLogin(){
  const login = $('login').value;
  const password = $('password').value;
  const apiUrl = $('api_url').value.trim();
  if (apiUrl){ localStorage.setItem('admin_api', apiUrl); }
  try {
    const res = await api('/api/admin/login', {method:'POST', body:{login, password}});
    TOKEN = res.token;
    localStorage.setItem('admin_token', TOKEN);
    toast('Добро пожаловать');
    render();
  } catch(e){ toast(e.message, 'err'); }
}

// ============================================================
// LAYOUT
// ============================================================
function layout(content){
  const counts = {
    purchases: CACHE.purchases.filter(p=>p.status==='awaiting_payment').length,
    payouts: CACHE.payouts.filter(p=>p.status==='pending').length,
    users: CACHE.users.length,
  };
  $('root').innerHTML = `
    <div class="layout">
      <aside class="side">
        <div class="logo">
          <div class="ic">⚡</div>
          <div>
            <div class="t">Era Admin</div>
            <div class="s">Панель</div>
          </div>
        </div>

        <div class="section">Обзор</div>
        <button class="nav-item ${TAB==='dashboard'?'active':''}" onclick="setTab('dashboard')">
          <span class="emo">📊</span>Дашборд
        </button>

        <div class="section">Операции</div>
        <button class="nav-item ${TAB==='purchases'?'active':''}" onclick="setTab('purchases')">
          <span class="emo">📩</span>Заявки
          ${counts.purchases ? `<span class="count">${counts.purchases}</span>` : ''}
        </button>
        <button class="nav-item ${TAB==='payouts'?'active':''}" onclick="setTab('payouts')">
          <span class="emo">💸</span>Выплаты
          ${counts.payouts ? `<span class="count">${counts.payouts}</span>` : ''}
        </button>

        <div class="section">Управление</div>
        <button class="nav-item ${TAB==='users'?'active':''}" onclick="setTab('users')">
          <span class="emo">👥</span>Пользователи
          ${counts.users ? `<span class="count">${counts.users}</span>` : ''}
        </button>
        <button class="nav-item ${TAB==='eras'?'active':''}" onclick="setTab('eras')">
          <span class="emo">🧩</span>Товары
        </button>
        <button class="nav-item ${TAB==='content'?'active':''}" onclick="setTab('content')">
          <span class="emo">📝</span>Контент
        </button>

        <div class="section">Система</div>
        <button class="nav-item ${TAB==='logs'?'active':''}" onclick="setTab('logs')">
          <span class="emo">📜</span>Журнал
        </button>
        <button class="nav-item" onclick="window.open('${LOG_CHANNEL_URL}','_blank')">
          <span class="emo">📢</span>Канал логов
        </button>

        <div class="section"></div>
        <button class="nav-item" onclick="logout()" style="color:var(--err)">
          <span class="emo">🚪</span>Выйти
        </button>
      </aside>
      <main class="main">${content}</main>
    </div>
  `;
}

async function setTab(t){
  TAB = t;
  stopRefresh();
  await render();
}

function stopRefresh(){
  if (REFRESH_TIMER){ clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; }
}

// ============================================================
// DASHBOARD
// ============================================================
async function tabDashboard(){
  const d = await api('/api/admin/dashboard');
  layout(`
    <div class="header">
      <div>
        <h1>📊 Дашборд</h1>
        <div class="sub">Общая статистика проекта</div>
      </div>
      <div class="flex">
        <button class="btn secondary sm" onclick="invalidateCache();tabDashboard()">🔄 Обновить</button>
        <button class="btn sm" onclick="window.open('${LOG_CHANNEL_URL}','_blank')">📢 Канал</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="ic">👥</div><div class="l">Пользователей</div><div class="v">${d.users}</div></div>
      <div class="stat"><div class="ic">🟢</div><div class="l">Активных эр</div><div class="v ok">${d.active_eras}</div></div>
      <div class="stat"><div class="ic">🏁</div><div class="l">Завершённых</div><div class="v info">${d.completed_eras}</div></div>
      <div class="stat"><div class="ic">⏳</div><div class="l">Заявок ждут</div><div class="v warn">${d.purchase_requests}</div></div>
      <div class="stat"><div class="ic">💸</div><div class="l">Выплат ждут</div><div class="v warn">${d.payout_requests}</div></div>
      <div class="stat"><div class="ic">💵</div><div class="l">Сумма покупок</div><div class="v accent">${fmt(d.total_purchases_sum)}</div></div>
      <div class="stat"><div class="ic">📈</div><div class="l">Начислено</div><div class="v ok">${fmt(d.total_profit_sum)}</div></div>
      <div class="stat"><div class="ic">💰</div><div class="l">Выплачено</div><div class="v">${fmt(d.total_paid_sum)}</div></div>
    </div>
  `);
  REFRESH_TIMER = setInterval(()=>{
    if (TAB === 'dashboard') tabDashboard();
  }, 30000);
}

// ============================================================
// PURCHASES
// ============================================================
async function tabPurchases(){
  CACHE.purchases = await api('/api/admin/purchases');
  CACHE_TIME = Date.now();

  const filtered = CACHE.purchases.filter(p=>{
    if (FILTER.purchases === 'pending') return p.status === 'awaiting_payment';
    if (FILTER.purchases === 'active') return p.status === 'active';
    if (FILTER.purchases === 'completed') return ['completed','awaiting_payout','paid'].includes(p.status);
    if (FILTER.purchases === 'cancelled') return p.status === 'cancelled';
    return true;
  }).filter(p=>{
    if (!FILTER.search) return true;
    const q = FILTER.search.toLowerCase();
    return (p.first_name||'').toLowerCase().includes(q) ||
           (p.telegram_username||'').toLowerCase().includes(q) ||
           String(p.id).includes(q) ||
           String(p.telegram_id||'').includes(q);
  });

  const counts = {
    all: CACHE.purchases.length,
    pending: CACHE.purchases.filter(p=>p.status==='awaiting_payment').length,
    active: CACHE.purchases.filter(p=>p.status==='active').length,
    completed: CACHE.purchases.filter(p=>['completed','awaiting_payout','paid'].includes(p.status)).length,

async function cancelPurchase(id){

  ]);

    if (!FILTER.search) return true;
    const q = FILTER.search.toLowerCase();

           String(u.telegram_id||'').includes(q);

  layout(`
    <div class="header">

function userCard(u){
  const uid = String(u.id || u._id || '');
  const userPurchases = CACHE.purchases.filter(p => String(p.user_uid) === uid);
  const active = userPurchases.filter(p => p.status === 'active');
  const completed = userPurchases.filter(p => p.status === 'completed');
  const paid = userPurchases.filter(p => p.status === 'paid');

  const invested = userPurchases
    .filter(p => !['awaiting_payment','cancelled'].includes(p.status))
    .reduce((s,p) => s + Number(p.purchase_price||0), 0);
  const toPayout = completed.reduce((s,p) => s + Number(p.total_amount||0), 0);
  const paidSum = paid.reduce((s,p) => s + Number(p.total_amount||0), 0);
  const referrals = CACHE.users.filter(x => String(x.referrer_uid||'') === uid);

  const initial = (u.first_name || u.telegram_username || '👤')[0].toUpperCase();
  const displayName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Без имени';

  return `
    <div class="user-card">
      <div class="user-head">
        <div class="avatar">
          ${u.photo_url ? `<img src="${esc(u.photo_url)}" alt="">` : initial}
        </div>
        <div class="user-info">
          <div class="n">${esc(displayName)}</div>
          <div class="u">@${esc(u.telegram_username||'—')} · ID ${u.telegram_id||'—'}</div>
        </div>
        <span class="badge ${u.status === 'active' ? 'active' : 'cancelled'}">${esc(u.status||'active')}</span>
      </div>

      <div class="user-stats">
        <div class="user-stat"><div class="l">Вложено</div>
          <div class="v accent">${fmt(invested)}</div></div>
        <div class="user-stat"><div class="l">К выводу</div>
          <div class="v ok">${fmt(toPayout)}</div></div>
        <div class="user-stat"><div class="l">Выплачено</div>
          <div class="v ok">${fmt(paidSum)}</div></div>
        <div class="user-stat"><div class="l">Активных</div>
          <div class="v">${active.length}</div></div>
        <div class="user-stat"><div class="l">Покупок</div>
          <div class="v">${userPurchases.length}</div></div>
        <div class="user-stat"><div class="l">Рефералов</div>
          <div class="v">${referrals.length}</div></div>
      </div>

      <div class="muted-sm" style="margin-bottom:10px">
        📅 ${fmtDate(u.registered_at)}
        ${u.referrer_username ? ' · 🎁 @'+esc(u.referrer_username) : ''}
        ${u.agreed_terms ? ' · ✅ Условия приняты' : ' · ⚠️ Условия не приняты'}
      </div>

      <div class="flex">
        <button class="btn sm" onclick="openUserDetail('${esc(uid)}')">📊 Детали</button>
        <button class="btn ghost sm" onclick="writeUser('${esc(u.telegram_username||'')}', ${u.telegram_id||0})">
          💬 Написать
        </button>
        <button class="btn secondary sm" onclick="showRefTree('${esc(uid)}')">🌳 Рефералы</button>
      </div>
    </div>
  `;
}

function openUserDetail(uid){
  uid = String(uid);
  const u = CACHE.users.find(x => String(x.id || x._id) === uid);
  if (!u) { toast('Пользователь не найден', 'err'); return; }

  const userPurchases = CACHE.purchases.filter(p => String(p.user_uid) === uid);
  const referrals = CACHE.users.filter(x => String(x.referrer_uid || '') === uid);

  const purchasesHtml = userPurchases.length ? userPurchases.map(p => `
    <div class="meta-item" style="margin-bottom:8px">
      <div class="row" style="margin-bottom:5px">
        <div style="font-weight:700;color:var(--accent)">📩 Заявка #${p.id}</div>
        <span class="badge ${p.status}">${statusLabel(p.status)}</span>
      </div>
      <div style="font-size:12px;font-weight:600;margin-bottom:3px">${esc(p.era_title)}</div>
      <div class="muted-sm">${fmt(p.purchase_price)} → +${fmt(p.profit_amount)} = ${fmt(p.total_amount)}</div>
      <div class="muted-sm">${fmtDate(p.created_at)}${p.activated_at ? ' · ✅ '+fmtDate(p.activated_at) : ''}</div>
    </div>
  `).join('') : '<div class="muted" style="padding:14px;text-align:center">Покупок нет</div>';

  const refsHtml = referrals.length ? referrals.map(r => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div>${esc(r.first_name||'')} <span class="muted">@${esc(r.telegram_username||'—')}</span></div>
      <div class="muted-sm">${fmtDate(r.registered_at)}</div>
    </div>
  `).join('') : '<div class="muted" style="padding:14px;text-align:center">Рефералов нет</div>';

  const totalInvested = userPurchases
    .filter(p => !['awaiting_payment','cancelled'].includes(p.status))
    .reduce((s,p) => s + Number(p.purchase_price||0), 0);
  const totalToPayout = userPurchases.filter(p => p.status === 'completed')
    .reduce((s,p) => s + Number(p.total_amount||0), 0);
  const totalPaid = userPurchases.filter(p => p.status === 'paid')
    .reduce((s,p) => s + Number(p.total_amount||0), 0);

  const displayName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Без имени';

  showModal(`
    <div class="modal-head">
      <h2>👤 ${esc(displayName)}</h2>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="user-stats" style="margin-bottom:14px">
        <div class="user-stat"><div class="l">Вложено</div>
          <div class="v accent">${fmt(totalInvested)}</div></div>
        <div class="user-stat"><div class="l">К выводу</div>
          <div class="v ok">${fmt(totalToPayout)}</div></div>
        <div class="user-stat"><div class="l">Выплачено</div>
          <div class="v ok">${fmt(totalPaid)}</div></div>
      </div>

      <h3 style="margin:14px 0 8px;font-size:13px">📦 Покупки (${userPurchases.length})</h3>
      ${purchasesHtml}

      <h3 style="margin:14px 0 8px;font-size:13px">🌳 Рефералы (${referrals.length})</h3>
      ${refsHtml}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Закрыть</button>
      <button class="btn" onclick="writeUser('${esc(u.telegram_username||'')}', ${u.telegram_id||0})">💬 Написать</button>
    </div>
  `);
}

async function showRefTree(uid){
  try {
    const tree = await api('/api/admin/referral_tree/' + uid);
    const html = renderTree(tree.children);
    showModal(`
      <div class="modal-head">
        <h2>🌳 Рефералы</h2>
        <button class="close-x" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <pre style="background:var(--card2);padding:12px;border-radius:9px;
          font-size:12px;overflow:auto;max-height:400px;line-height:1.6">${html || 'Нет рефералов'}</pre>
      </div>
    `);
  } catch(e){ toast(e.message, 'err'); }
}

function renderTree(nodes, depth=0){
  return nodes.map(n =>
    '  '.repeat(depth) + `• ${esc(n.name||'')} @${esc(n.username||'—')}\n` +
    renderTree(n.children||[], depth+1)
  ).join('');
}

function writeUser(username, tgId){
  let url;
  if (username){ url = `https://t.me/${username}`; }
  else if (tgId){ url = `tg://user?id=${tgId}`; }
  else { toast('Нет username или ID', 'err'); return; }
  window.open(url, '_blank');
}

      <div class="form-row">
        <label>Активна</label>
        <select class="input" id="f_active">
          <option value="1" ${(!e || e.is_active) ? 'selected' : ''}>Да</option>
          <option value="0" ${(e && !e.is_active) ? 'selected' : ''}>Нет</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" id="f_submit" onclick="saveEra(${id||0})">${isEdit ? '💾 Сохранить' : '✅ Создать'}</button>
    </div>
  `);

  // Авто-пересчёт итога
  const recalc = () => {
    const price = parseFloat($('f_price')?.value) || 0;
    const profit = parseFloat($('f_profit')?.value) || 0;
    const total = $('f_total');
    if (total) total.value = price + profit;
  };
  const priceEl = $('f_price');
  const profitEl = $('f_profit');
  if (priceEl) priceEl.addEventListener('input', recalc);
  if (profitEl) profitEl.addEventListener('input', recalc);
  recalc();
}

async function saveEra(id){
  const title = $('f_title')?.value?.trim();
  if (!title){ toast('Введите название', 'err'); return; }

  const body = {
    title: title,
    price: parseFloat($('f_price')?.value) || 0,
    duration_days: parseInt($('f_duration')?.value) || 0,
    profit_amount: parseFloat($('f_profit')?.value) || 0,
    description: $('f_description')?.value || '',
    is_active: parseInt($('f_active')?.value) || 1,
    sort_order: id || 99,
  };

  const submitBtn = $('f_submit');
  if (submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '⏳ Сохранение…'; }

  try {
    if (id){
      await api('/api/admin/eras/' + id, {method:'PUT', body});
      toast('💾 Эра обновлена');
    } else {
      const res = await api('/api/admin/eras', {method:'POST', body});
      toast(`✅ Эра #${res.id || '?'} создана`);
    }
    closeModal();
    invalidateCache();
    // Небольшая задержка, чтобы Firebase успел записать
    setTimeout(() => tabEras(), 300);
  } catch(e){
    toast(e.message, 'err');
    if (submitBtn){ submitBtn.disabled = false; submitBtn.textContent = id ? '💾 Сохранить' : '✅ Создать'; }
  }
}

async function toggleEra(id, newActive){
  const e = CACHE.eras.find(x => x.id === id);
  if (!e) return;
  try {
    await api('/api/admin/eras/' + id, {
      method:'PUT',
      body: {
        title: e.title,
        price: e.price,
        duration_days: e.duration_days,
        profit_amount: e.profit_amount,
        description: e.description || '',
        is_active: newActive,
        sort_order: e.sort_order || id,
      }
    });
    toast(newActive ? '🟢 Включена' : '⚫ Отключена');
    invalidateCache();
    tabEras();
  } catch(e){ toast(e.message, 'err'); }
}

async function deleteEra(id){
  if (!confirm(`🗑 Удалить эру #${id}?\n\nДействие необратимо.`)) return;
  try {
    await api('/api/admin/eras/' + id, {method:'DELETE'});
    toast('🗑 Эра удалена');
    invalidateCache();
    tabEras();
  } catch(e){ toast(e.message, 'err'); }
}

// ============================================================
// CONTENT
// ============================================================
async function tabContent(){
  const keys = [
    {k:'marketing_image', t:'Маркетинговое изображение', upload:true},
    {k:'rules_text', t:'Правила проекта', textarea:true},
    {k:'terms_text', t:'Условия участия', textarea:true},
    {k:'notif_registration', t:'Уведомление: регистрация'},
    {k:'notif_purchase_created', t:'Уведомление: заявка'},
    {k:'notif_purchase_activated', t:'Уведомление: активация'},
    {k:'notif_purchase_cancelled', t:'Уведомление: отмена'},
    {k:'notif_payout_requested', t:'Уведомление: вывод'},
    {k:'notif_payout_paid', t:'Уведомление: выплата'},
  ];
  const values = {};
  await Promise.all(keys.map(async ({k})=>{
    const r = await api('/api/content/' + k);
    values[k] = r.value;
  }));

  layout(`
    <div class="header">
      <div>
        <h1>📝 Контент</h1>
        <div class="sub">Тексты и изображения</div>
      </div>
    </div>

    ${keys.map(({k,t,textarea,upload}) => `
      <div class="card">
        <h3 style="margin-bottom:10px;font-size:13.5px">${t}</h3>
        ${upload ? `
          ${values[k] ? `<img src="${API}${values[k]}"
            style="max-width:100%;max-height:200px;border-radius:9px;margin-bottom:10px">` :
            '<div class="muted" style="margin-bottom:10px">Не загружено</div>'}
          <input type="file" id="f_${k}" class="input">
          <button class="btn sm" style="margin-top:8px" onclick="uploadFile('${k}')">⬆️ Загрузить</button>
        ` : `
          ${textarea
            ? `<textarea class="input" id="c_${k}" rows="5">${esc(values[k]||'')}</textarea>`
            : `<input class="input" id="c_${k}" value="${esc(values[k]||'')}">`}
          <button class="btn sm" style="margin-top:8px" onclick="saveContent('${k}')">💾 Сохранить</button>
        `}
      </div>
    `).join('')}
  `);
}

async function saveContent(key){
  const value = $('c_' + key)?.value || '';
  try {
    await api('/api/admin/content', {method:'POST', body:{key, value}});
    toast('💾 Сохранено');
  } catch(e){ toast(e.message, 'err'); }
}

async function uploadFile(key){
  const f = $('f_' + key)?.files?.[0];
  if (!f) return toast('Выберите файл', 'err');
  const fd = new FormData(); fd.append('file', f);
  try {
    await api('/api/admin/upload/marketing', {method:'POST', body: fd});
    toast('⬆️ Загружено');
    tabContent();
  } catch(e){ toast(e.message, 'err'); }
}

// ============================================================
// LOGS
// ============================================================
async function tabLogs(){
  const list = await api('/api/admin/actions');
  layout(`
    <div class="header">
      <div>
        <h1>📜 Журнал</h1>
        <div class="sub">Последние ${list.length} действий</div>
      </div>
      <button class="btn sm" onclick="window.open('${LOG_CHANNEL_URL}','_blank')">📢 Канал</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Админ</th><th>Действие</th><th>Детали</th><th>Дата</th>
          </tr>
        </thead>
        <tbody>
        ${list.length ? list.map(a => `
          <tr>
            <td>${a.id}</td>
            <td>${esc(a.admin)}</td>
            <td>${esc(a.action)}</td>
            <td>${esc(a.details)}</td>
            <td>${fmtDate(a.created_at)}</td>
          </tr>
        `).join('') : `
          <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted)">
            Журнал пуст
          </td></tr>
        `}
        </tbody>
      </table>
    </div>
  `);
}

// ============================================================
// SEARCH DEBOUNCE
// ============================================================
let SEARCH_TIMER = null;
function debouncedSearch(value, tab){
  FILTER.search = value;
  clearTimeout(SEARCH_TIMER);
  SEARCH_TIMER = setTimeout(() => {
    if (tab === 'purchases') tabPurchases();
    else if (tab === 'users') tabUsers();
  }, 300);
}

// ============================================================
// UTILS
// ============================================================
function esc(s){ return String(s??'').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try {
    return new Date(s).toLocaleString('ru-RU',
      {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  } catch { return s; }
}
function statusLabel(s){
  return ({
    awaiting_payment:'⏳ Ожидает оплаты', active:'🟢 Активен',
    completed:'🏁 Завершён', awaiting_payout:'💸 Ожидает выплаты',
    paid:'💰 Выплачен', cancelled:'❌ Отменён'
  })[s] || s;
}

// ============================================================
// MAIN RENDER
// ============================================================
async function render(){
  if (!TOKEN){ renderLogin(); return; }
  try {
    const routes = {
      dashboard: tabDashboard,
      purchases: tabPurchases,
      payouts: tabPayouts,
      users: tabUsers,
      eras: tabEras,
      content: tabContent,
      logs: tabLogs
    };
    const fn = routes[TAB] || tabDashboard;
    await fn();
  } catch(e){
    console.error(e);
    if (e.message === 'Unauthorized') return;
    toast(e.message, 'err');
  }
}

render();
</script>
