<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Эры — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0e14; --card:#131820; --card2:#1a212c; --card3:#232b38;
  --border:#252e3a; --border2:#2f3a48;
  --text:#e8edf3; --text2:#c4ccd6; --muted:#7a8595;
  --accent:#4f8cff; --accent2:#356fd8;
  --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  --purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);margin:0 -16px 16px;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.topbar .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text2);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
h1{font-size:24px;font-weight:700;line-height:1.25}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.muted-sm{color:var(--muted);font-size:11px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card2{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px}
.hero{background:#1a2540;border:1px solid var(--border2);border-radius:18px;padding:20px;margin-bottom:16px}
.hero .user{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--card3);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
  color:var(--accent);border:2px solid var(--border2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:88px;height:88px;font-size:36px}
.hero .info{min-width:0;flex:1}
.hero .info h1{font-size:20px;margin-bottom:2px}
.hero .info .sub{color:var(--text2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;
  cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.stat:hover{border-color:var(--accent);background:var(--card2)}
.stat:active{transform:scale(.97)}
.stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.stat .label .arrow{font-size:10px;opacity:.5}
.stat .value{font-size:22px;font-weight:700}
.stat .value.sm{font-size:18px}
.stat .value.ok{color:var(--ok)} .stat .value.accent{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;
  font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.btn:active{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn.ok{background:var(--ok);color:#04241a}
.btn.warn{background:var(--warn);color:#2a1a00}
.btn.danger{background:var(--err);color:#fff}
.btn.sm{padding:10px 14px;font-size:13px;border-radius:10px;width:auto}
.btn.xs{padding:7px 12px;font-size:12px;border-radius:8px;width:auto}
.era-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:0;margin-bottom:14px;overflow:hidden}
.era-card .head{padding:18px 18px 14px;background:var(--card2);border-bottom:1px solid var(--border)}
.era-card .head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.era-card .title-wrap{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.era-card .icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:22px;background:var(--card3);border:1px solid var(--border2);flex-shrink:0}
.era-card .name{font-size:17px;font-weight:700}
.era-card .tier{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;margin-top:2px}
.era-card .body{padding:16px 18px}
.era-card .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--card2);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--border)}
.metric .l{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.metric .v{font-size:14px;font-weight:700}
.metric .v.profit{color:var(--ok)} .metric .v.total{color:var(--accent)}
.era-card .actions{padding:0 18px 18px;display:flex;gap:8px}
.era-card .actions .btn{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;
  font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.badge.created{background:rgba(99,169,255,.15);color:var(--info)}
.badge.approved,.badge.completed,.badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
.badge.cancelled,.badge.rejected{background:rgba(255,92,92,.15);color:var(--err)}
.badge.pending,.badge.frozen,.badge.pending_active{background:rgba(245,181,71,.15);color:var(--warn)}
.badge.early{background:rgba(245,181,71,.2);color:var(--warn)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:50;max-width:560px;margin:0 auto}
.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1;font-weight:600}
.nav button.active{color:var(--accent)}
.nav button .ico{font-size:20px;line-height:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:0}
.modal-head{position:sticky;top:0;background:var(--card2);padding:20px;border-bottom:1px solid var(--border);
  z-index:1;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.close-x{width:34px;height:34px;border-radius:50%;background:var(--card3);border:1px solid var(--border2);
  color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none !important}
.center{text-align:center}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--border2);padding:12px 18px;border-radius:12px;
  font-size:13px;z-index:999;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.ok{border-color:var(--ok);color:#a8f0cc}
.toast.err{border-color:var(--err);color:#ffb3b3}
.toast.info{border-color:var(--accent);color:#cfe0ff}
a{color:var(--accent);text-decoration:none}
.ref-box{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;
  font-size:13px;font-family:ui-monospace,monospace;word-break:break-all;color:var(--text2)}
.order-num{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.25);border-radius:8px;
  font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px}
.list-item{padding:14px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.list-item:last-child{border-bottom:0}
.empty{padding:44px 20px;text-align:center}
.empty .icon{font-size:52px;margin-bottom:12px;opacity:.5}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:16px 0;
  border-bottom:1px solid var(--border);cursor:pointer}
.menu-item:last-child{border-bottom:0}
.menu-item .left{display:flex;align-items:center;gap:14px}
.menu-item .emo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:19px;background:var(--card2);border:1px solid var(--border)}
.progress{height:8px;background:var(--card3);border-radius:4px;overflow:hidden;margin-top:8px}
.progress .fill{height:100%;border-radius:4px;background:var(--accent);transition:width 1s linear}
.days-left{padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.days-left.ok{background:rgba(57,217,138,.15);color:var(--ok)}
.days-left.warn{background:rgba(245,181,71,.15);color:var(--warn)}
.days-left.err{background:rgba(255,92,92,.15);color:var(--err)}
.days-left.info{background:rgba(99,169,255,.15);color:var(--info)}
.timer-live{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:22px;
  font-weight:800;text-align:center;margin-top:14px;padding:10px 14px;border-radius:12px;
  background:var(--card3);border:1px solid var(--border2);letter-spacing:.5px;color:var(--accent);
  transition:color .3s,border-color .3s}
.timer-live.warn{color:var(--warn);border-color:rgba(245,181,71,.4)}
.timer-live.err{color:var(--err);border-color:rgba(255,92,92,.4);animation:pulse 1.5s infinite}
.timer-live.ok{color:var(--ok);border-color:rgba(57,217,138,.4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;border:1px solid var(--border);margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}

.ref-hero{
  background:linear-gradient(135deg,#1b2a4a 0%,#16233f 100%);
  border:1px solid #2c3d63;border-radius:16px;padding:18px;margin-bottom:12px;
  position:relative;overflow:hidden
}
.ref-hero.paid{background:linear-gradient(135deg,#12351f 0%,#0f2a1a 100%);border-color:#1f6b41}
.ref-hero.frozen{background:linear-gradient(135deg,#3a2d12 0%,#2a1f0a 100%);border-color:#6b501f}
.ref-hero .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:14px}
.ref-hero .title .emo{font-size:20px}
.ref-hero .percent-badge{margin-left:auto;background:rgba(57,217,138,.18);color:var(--ok);
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px}
.ref-balances{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ref-bal{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 8px;text-align:center;
  border:1px solid rgba(255,255,255,.06)}
.ref-bal .l{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:700;
  margin-bottom:4px;letter-spacing:.5px}
.ref-bal .v{font-size:15px;font-weight:800}
.ref-bal .v.pending{color:var(--warn)}
.ref-bal .v.approved{color:var(--ok)}
.ref-bal .v.paid{color:var(--accent)}
.ref-bal .v.zero{color:var(--ok)}
.ref-hero .last-paid{font-size:12px;color:var(--text2);text-align:center;padding:8px;
  background:rgba(0,0,0,.2);border-radius:8px}
.ref-hero .last-paid b{color:var(--ok)}
.ref-hero .frozen-note{font-size:12px;color:var(--warn);text-align:center;padding:8px;
  background:rgba(245,181,71,.12);border-radius:8px;margin-bottom:10px}
.ref-hero .warn-note{font-size:12px;color:var(--info);text-align:center;padding:10px;
  background:rgba(99,169,255,.12);border-radius:8px;margin-bottom:10px;line-height:1.4}
.ref-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ref-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.ref-item .name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-item .date{color:var(--muted);font-size:11px;white-space:nowrap}
.ref-item .meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.ref-item .stat-row{display:flex;gap:8px;flex-wrap:wrap}
.ref-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;
  font-size:11px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.ref-chip.ok{background:rgba(57,217,138,.12);color:var(--ok);border-color:rgba(57,217,138,.25)}
.ref-chip.warn{background:rgba(245,181,71,.12);color:var(--warn);border-color:rgba(245,181,71,.25)}
.ref-chip.info{background:rgba(99,169,255,.12);color:var(--info);border-color:rgba(99,169,255,.25)}
.ref-chip.purple{background:rgba(167,139,250,.12);color:var(--purple);border-color:rgba(167,139,250,.25)}

/* ❄️ ЗАМОРОЖЕННЫЕ */
.frozen-hero{
  background:linear-gradient(135deg,#3a2d12 0%,#2a1f0a 100%);
  border:1px solid #8a6a1f;border-radius:16px;padding:16px;
  margin-bottom:12px;position:relative;overflow:hidden;
  cursor:pointer;transition:transform .15s,border-color .2s;
}
.frozen-hero:active{transform:scale(.98)}
.frozen-hero:hover{border-color:#d4a72c}
.frozen-hero::before{
  content:'';position:absolute;top:-50%;right:-30%;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,181,71,.18),transparent 70%);
  pointer-events:none;
}
.frozen-hero .fh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1}
.frozen-hero .fh-emoji{
  width:44px;height:44px;border-radius:12px;
  background:rgba(245,181,71,.18);border:1px solid rgba(245,181,71,.4);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  animation:frozen-pulse 2.5s ease-in-out infinite;
}
@keyframes frozen-pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,181,71,.4)}50%{box-shadow:0 0 0 8px rgba(245,181,71,0)}}
.frozen-hero .fh-title{font-weight:700;font-size:15px;color:#f5d97a}
.frozen-hero .fh-sub{font-size:11.5px;color:rgba(245,217,122,.7);margin-top:2px}
.frozen-hero .fh-amount{font-size:28px;font-weight:900;color:#f5b547;text-align:center;margin:6px 0 12px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.5px;position:relative;z-index:1}
.frozen-hero .fh-note{font-size:12px;color:#e8d9a8;text-align:center;
  padding:10px 12px;background:rgba(0,0,0,.3);border-radius:10px;
  line-height:1.5;position:relative;z-index:1;margin-bottom:12px}
.frozen-hero .fh-btn{width:100%;padding:12px;border-radius:10px;border:0;
  background:linear-gradient(135deg,#f5d97a,#e0b84a);
  color:#2a1a00;font-weight:800;font-size:14px;cursor:pointer;
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px}
.frozen-hero .fh-btn:active{transform:scale(.97)}
.frozen-item{background:var(--card2);border:1px solid rgba(245,181,71,.25);
  border-radius:12px;padding:12px 14px;border-left:3px solid var(--warn);margin-bottom:10px}
.frozen-item .fi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.frozen-item .fi-name{font-weight:700;font-size:14px}
.frozen-item .fi-amount{font-size:16px;font-weight:800;color:var(--warn);font-family:ui-monospace,monospace}
.frozen-item .fi-meta{font-size:11.5px;color:var(--muted);line-height:1.6}
.frozen-summary{background:linear-gradient(135deg,#3a2d12,#2a1f0a);border:1px solid #8a6a1f;
  border-radius:14px;padding:16px;margin-bottom:14px;text-align:center}
.frozen-summary .fs-label{font-size:11px;color:rgba(245,217,122,.7);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.frozen-summary .fs-value{font-size:32px;font-weight:900;color:#f5b547;font-family:ui-monospace,monospace}

/* 💳 РЕКВИЗИТЫ */
.req-hero{
  background:linear-gradient(135deg,#12351f 0%,#0f2a1a 100%);
  border:1px solid #1f6b41;border-radius:16px;
  padding:16px;margin-bottom:12px;
}
.req-hero.empty{
  background:linear-gradient(135deg,#1b2a4a 0%,#16233f 100%);
  border-color:#2c3d63;cursor:pointer;
}
.req-hero .rh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.req-hero .rh-emoji{
  width:44px;height:44px;border-radius:12px;
  background:rgba(57,217,138,.18);border:1px solid rgba(57,217,138,.4);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.req-hero.empty .rh-emoji{
  background:rgba(79,140,255,.18);border-color:rgba(79,140,255,.4);
}
.req-hero .rh-title{font-weight:700;font-size:15px;color:#a8f0cc}
.req-hero.empty .rh-title{color:#cfe0ff}
.req-hero .rh-sub{font-size:11.5px;color:rgba(168,240,204,.7);margin-top:2px}
.req-hero.empty .rh-sub{color:rgba(207,224,255,.7)}
.req-hero .rh-data{
  font-size:12.5px;color:#e8edf3;line-height:1.8;
  background:rgba(0,0,0,.25);border-radius:10px;padding:12px 14px;
}
.req-hero .rh-data b{color:#a8f0cc}
.req-hero .rh-edit{
  width:100%;margin-top:12px;padding:11px;border-radius:10px;
  background:rgba(255,255,255,.08);border:1px solid rgba(168,240,204,.3);
  color:#a8f0cc;font-weight:700;font-size:13px;cursor:pointer;
}
.req-hero.empty .rh-edit{
  background:linear-gradient(135deg,#4f8cff,#356fd8);
  border:0;color:#fff;font-weight:800;
}
.req-hero .rh-edit:active{transform:scale(.97)}
.req-form{display:flex;flex-direction:column;gap:12px}
.req-field label{
  display:block;font-size:11px;color:var(--muted);
  text-transform:uppercase;font-weight:700;
  margin-bottom:6px;letter-spacing:.5px;
}
.req-field input{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1px solid var(--border2);background:var(--card2);
  color:var(--text);font-size:15px;outline:none;font-family:inherit;
}
.req-field input:focus{border-color:var(--accent)}
.req-field input::placeholder{color:var(--muted);opacity:.6}

/* 🏆 ТОП ЗАГЛУШКА */
.top-hero{
  background:linear-gradient(135deg,#3a2d12 0%,#2a1f0a 100%);
  border:1px solid #8a6a1f;border-radius:20px;
  padding:40px 24px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden
}
.top-hero::before{
  content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,181,71,.15),transparent 70%);
  pointer-events:none;
}
.top-hero .th-emoji{font-size:72px;margin-bottom:14px;position:relative;z-index:1;
  animation:top-float 3s ease-in-out infinite}
@keyframes top-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.top-hero .th-title{font-size:26px;font-weight:900;color:#f5d97a;margin-bottom:10px;
  letter-spacing:.5px;position:relative;z-index:1;
  background:linear-gradient(180deg,#f5d97a 0%,#b8862d 100%);

        lastAt = p.referral_paid_at;
        lastAmount = num(p.referral_paid_amount) || bonus;
      }
    } else if (st === 'frozen'){
      accrued += bonus;
      frozen += num(p.referral_frozen_amount) || bonus;
    } else if (st === 'approved'){
      accrued += bonus;
    } else if (st === 'pending_active'){
      pendingActive += bonus;
    } else {
      pending += bonus;
    }
  });
  return {
    accrued: accrued, paid: paid, pending: pending,
    frozen: frozen, pendingActive: pendingActive,
    owed: Math.max(0, accrued - paid - frozen),
    lastAt: lastAt, lastAmount: lastAmount
  };
}

function getFrozenItems(){
  var items = [];
  ALL_MY_REF_PURCHASES.forEach(function(p){
    if (['rejected','cancelled'].indexOf(p.status) >= 0) return;

    var bonus = num(p.referral_bonus) || Math.round(num(p.purchase_price) * REFERRAL_PERCENT / 100);
    if (bonus <= 0) return;
    var refUser = null;
    for (var i = 0; i < ALL_REFERRALS.length; i++){
      if (String(ALL_REFERRALS[i].telegram_id) === String(p.user_telegram_id)){

    items.push({
      name: refUser ? (refUser.first_name || 'Пользователь') : 'Пользователь',
      username: refUser ? (refUser.username || '') : '',

      bonus: bonus,
      era: p.era_title || '—',
      date: p.created_at || p.approved_at,
      purchase_id: p.id
    });
  });
  return items;
}

window.requestRefPayout = function(){
  return once('refPayout', async function(){
    if (IS_BLOCKED) return;
    var b = calcRefBalance();
    if (b.frozen > 0) return toast('⏳ Заявка уже отправлена', 'info', 4000);
    if (b.owed < MIN_WITHDRAW) return toast('Минимум ' + fmt(MIN_WITHDRAW), 'err');

    /* 💳 ПРОВЕРКА РЕКВИЗИТОВ */
    var req = (ME && ME.requisites) || {};
    if (!req.fio || !req.card || !req.bank){
      var goFill = await ask('💳 Сначала заполните реквизиты для вывода\n\nНужно: Ф.И.О., карта/телефон, банк.\n\nЗаполнить сейчас?');
      if (goFill) window.openRequisites();
      return;
    }

    var requests = await fbGet('ref_payout_requests') || {};
    var mine = toList(requests).filter(function(r){
      return String(r.user_telegram_id) === String(USER_UID);
    });
    var active = mine.filter(function(r){
      return r.status === 'pending' || r.status === 'processing';
    })[0];
    if (active) return toast('⏳ Уже есть заявка #' + active.id, 'info', 4000);

    var ok = await ask('Вывести бонусы?\n\n💰 ' + fmt(b.owed) +
      '\n\n💳 Реквизиты:\n👤 ' + req.fio + '\n💳 ' + req.card + '\n🏦 ' + req.bank);
    if (!ok) return;

    var cur = await fbGet('counters/ref_payout') || 0;
    var rid = Number(cur) + 1;
    await fbPut('counters/ref_payout', rid);

    var now = new Date().toISOString();
    await fbPost('ref_payout_requests', {
      id: rid, user_telegram_id: USER_UID,
      user_username: ME.username || '',
      user_first_name: ME.first_name || '',
      amount: b.owed, balance_before: b.owed,
      status: 'pending', requested_at: now,
      requisites: { fio: req.fio, card: req.card, bank: req.bank }
    });

    await freezeRefBonuses(USER_UID, b.owed, rid);

    toast('✅ Заявка #' + rid + ' на ' + fmt(b.owed), 'ok', 5000);
    haptic();
    await reload();
    render();
  });
};

async function freezeRefBonuses(uid, amount, requestId){
  var users = await fbGet('users') || {};
  var purchases = await fbGet('purchases') || {};
  var myIds = {};
  toList(users).forEach(function(u){
    if (String(u.referrer_uid || '') === String(uid)) myIds[String(u.telegram_id)] = 1;
  });
  var queue = [];
  Object.keys(purchases).forEach(function(k){
    var p = purchases[k];
    if (!p || typeof p !== 'object') return;
    if (!myIds[String(p.user_telegram_id)]) return;
    if (['rejected','cancelled'].indexOf(p.status) >= 0) return;
    if ((p.referral_status || '') !== 'approved') return;
    queue.push({ key: k, p: p });
  });
  queue.sort(function(a,b){ return new Date(a.p.created_at||0) - new Date(b.p.created_at||0); });
  var left = amount, now = new Date().toISOString();
  for (var i = 0; i < queue.length && left > 0; i++){
    var item = queue[i];
    var b = Number(item.p.referral_bonus || 0)
      || Math.round(Number(item.p.purchase_price || 0) * REFERRAL_PERCENT / 100);
    if (b <= 0) continue;
    var freezeNow = Math.min(b, left);
    await fbPatch('purchases/' + item.key, {
      referral_status: 'frozen',
      referral_frozen_at: now,
      referral_frozen_amount: freezeNow,
      referral_request_id: requestId
    });
    left -= freezeNow;
  }
}

  } else if (isEarly){
    infoLine = '<div class="muted-sm" style="margin-top:8px;color:var(--warn)">🔌 Отключена админом · ' + fmtDT(p.early_closed_at) + '</div>';

window.requestPayoutAll = function(){
  return once('payoutAll', async function(){
    if (IS_BLOCKED) return;
    /* 💳 РЕКВИЗИТЫ */
    var req = (ME && ME.requisites) || {};
    if (!req.fio || !req.card || !req.bank){
      var goFill = await ask('💳 Сначала заполните реквизиты для вывода\n\nЗаполнить сейчас?');
      if (goFill) window.openRequisites();
      return;
    }
    var avail = PURCHASES.filter(function(p){ return canWithdraw(p); });
    if (!avail.length) return toast('Нет сумм для вывода', 'err');
    var total = avail.reduce(function(s,p){ return s + num(p.total_amount); }, 0);
    if (total < MIN_WITHDRAW) return toast('Минимум ' + fmt(MIN_WITHDRAW), 'err');
    if (!await ask('Вывести все завершённые эры?\n\n💰 ' + fmt(total) +
      '\n📦 ' + avail.length + ' заявок\n\n💳 Реквизиты:\n👤 ' + req.fio + '\n💳 ' + req.card + '\n🏦 ' + req.bank)) return;
    var u = tgUser() || {};
    var count = 0;
    for (var i = 0; i < avail.length; i++){
      var p = avail[i];
      try {
        var nextId = await getNextId('payout');
        await fbPost('payouts', {
          id: nextId, purchase_id: p.id,
          user_telegram_id: u.id, user_username: u.username || '',
          user_first_name: u.first_name || '',
          era_title: p.era_title, purchase_price: p.purchase_price,
          amount: p.total_amount, status: 'pending',
          requested_at: new Date().toISOString(),
          requisites: { fio: req.fio, card: req.card, bank: req.bank }
        });
        count++;
      } catch(e){ console.warn('fail', p.id, e); }
    }
    toast('✅ Создано заявок: ' + count, 'ok', 4000);
    haptic();
    await reload();
    closeModal();
    render();
  });
};

window.requestPayout = function(pid){
  return once('po' + pid, async function(){
    if (IS_BLOCKED) return;
    /* 💳 ПРОВЕРКА */
    var req = (ME && ME.requisites) || {};
    if (!req.fio || !req.card || !req.bank){
      var goFill = await ask('💳 Сначала заполните реквизиты для вывода\n\nНужно: Ф.И.О., карта/телефон, банк.\n\nЗаполнить сейчас?');
      if (goFill) window.openRequisites();
      return;
    }
    var p = PURCHASES.filter(function(x){ return String(x.id) === String(pid); })[0];

      return toast('Минимум ' + fmt(MIN_WITHDRAW), 'err');
    }
    var confirmText =
      'Подать заявку на вывод?\n\n' +
      '💰 Сумма: ' + fmt(p.total_amount) + '\n\n' +
      '💳 Реквизиты:\n👤 ' + req.fio + '\n💳 ' + req.card + '\n🏦 ' + req.bank + '\n\nВсё верно?';
    if (!await ask(confirmText)) return;
    var u = tgUser() || {};
    var nextId = await getNextId('payout');
    await fbPost('payouts', {
      id: nextId, purchase_id: p.id,
      user_telegram_id: u.id, user_username: u.username || '',
      user_first_name: u.first_name || '',
      era_title: p.era_title, purchase_price: p.purchase_price,
      amount: p.total_amount, status: 'pending',
      requested_at: new Date().toISOString(),
      requisites: { fio: req.fio, card: req.card, bank: req.bank }
    });
    toast('✅ Заявка на вывод #' + nextId, 'ok', 4000);
    haptic();
    await reload();
    render();
  });
};

async function getNextId(counter){
  var cur = await fbGet('counters/' + counter);
  var nxt = (Number(cur) || 0) + 1;
  await fbPut('counters/' + counter, nxt);
  return nxt;
}

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(refLink).then(ok).catch(function(){ fallbackCopy(refLink, ok); });

function fallbackCopy(text, ok){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch(e){ toast('Не удалось', 'err'); }
  ta.remove();
}

window.openMyRefs = function(){
  var refLink = 'https://t.me/' + BOT_USERNAME + '?start=ref_' + ME.telegram_id;
  var byRef = {};
  ALL_MY_REF_PURCHASES.forEach(function(p){
    var rid = String(p.user_telegram_id);
    if (!byRef[rid]) byRef[rid] = [];
    byRef[rid].push(p);
  });
  var items = ALL_REFERRALS.length ? ALL_REFERRALS.map(function(r){
    var rp = byRef[String(r.telegram_id)] || [];
    var sum=0, paid=0, pending=0, approved=0, frozen=0, pendingActive=0;
    rp.forEach(function(p){
      if (['rejected','cancelled'].indexOf(p.status) >= 0) return;
      var price = num(p.purchase_price);
      var b = num(p.referral_bonus) || Math.round(price * REFERRAL_PERCENT / 100);
      var st = p.referral_status || 'pending';
      if (st === 'rejected') return;
      sum += price;
      if (st === 'paid') paid += b;
      else if (st === 'frozen') frozen += num(p.referral_frozen_amount) || b;
      else if (st === 'approved') approved += b;
      else if (st === 'pending_active') pendingActive += b;
      else pending += b;
    });
    var chips = [];
    if (!rp.length) chips.push('<span class="ref-chip info">🕓 Пока без покупок</span>');
    else {
      if (pending > 0)  chips.push('<span class="ref-chip warn">⏳ ' + fmt(pending) + '</span>');
      if (pendingActive > 0) chips.push('<span class="ref-chip warn">❄️ Заморожено ' + fmt(pendingActive) + '</span>');
      if (approved > 0) chips.push('<span class="ref-chip ok">✅ ' + fmt(approved) + '</span>');
      if (frozen > 0)   chips.push('<span class="ref-chip warn">⏳ В заявке ' + fmt(frozen) + '</span>');
      if (paid > 0)     chips.push('<span class="ref-chip purple">💸 ' + fmt(paid) + '</span>');

    return '<div class="ref-item">' +
      '<div class="head"><div class="name">' + esc(r.first_name || 'Пользователь') + '</div>' +

      '<div class="meta">@' + esc(r.username || '—') + ' · ID ' + esc(r.telegram_id) + '</div>' +
      (rp.length ? '<div class="meta">🛒 Покупок: <b>' + rp.length + '</b> · на ' + fmt(sum) + '</div>' : '') +
      '<div class="stat-row">' + chips.join('') + '</div></div>';
  }).join('') : '<div class="empty"><div class="icon">👥</div><p>Пока никого нет</p></div>';
  var b = calcRefBalance();
  showModal(
    '<div class="modal-head"><h2>👥 Рефералы (' + ALL_REFERRALS.length + ')</h2>' +
      '<button class="close-x" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="ref-hero"><div class="title"><span class="emo">💰</span> Ваш баланс' +
        '<span class="percent-badge">' + REFERRAL_PERCENT + '%</span></div>' +
        '<div class="ref-balances">' +
          '<div class="ref-bal"><div class="l">К выводу</div>' +
            '<div class="v ' + (b.owed>=MIN_WITHDRAW?'pending':'zero') + '">' + fmt(b.owed) + '</div></div>' +

          '<div class="ref-bal"><div class="l">Выплачено</div>' +

        '</div>' +
        (b.pendingActive > 0
          ? '<div class="warn-note">❄️ Заморожено <b>' + fmt(b.pendingActive) + '</b> — купите эру, чтобы разблокировать</div>'
          : '') +

        '<button class="btn secondary sm" style="margin-top:10px;width:100%" onclick="copyRef()">📋 Скопировать</button>' +

        '🕐 <b>Куплено:</b> ' + fmtDT(p.created_at) +
        (p.approved_at ? '<br>✅ <b>Одобрено:</b> ' + fmtDT(p.approved_at) : '') +
        (p.start_date ? '<br>📅 <b>Начало:</b> ' + fmtDate(p.start_date) : '') +
        (!isEarly && p.expires_at ? '<br>⏰ <b>Истекает:</b> ' + fmtDT(p.expires_at) : '') +
        (isEarly && p.early_closed_at
          ? '<br>🔌 <b>Отключена:</b> ' + fmtDT(p.early_closed_at) +
            '<br><span style="color:var(--warn)">Сумма начислена досрочно</span>' : '') +
      '</div>' +
    '</div>' +
    (canW && num(p.total_amount) >= MIN_WITHDRAW
      ? '<div class="actions"><button class="btn ok" onclick="requestPayout(' +
        JSON.stringify(p.id) + ')">💸 Вывести ' + fmt(p.total_amount) + '</button></div>'
      : (canW
          ? '<div class="actions"><button class="btn ghost" disabled>Минимум ' + fmt(MIN_WITHDRAW) + '</button></div>'
          : '')) +
  '</div>';
}

function drawBuy(){
  var chips = [['all','Все'],['starter','⚡ Старт'],['middle','🚀 Бизнес'],['premium','💎 Premium']];
  setApp(
    '<div class="topbar"><div class="brand"><div class="logo">🛒</div>Каталог</div>' +
      '<div><span class="muted-sm">' + ERAS.length + ' эр</span></div></div>' +
    '<div class="searchbar" style="display:flex;gap:8px;margin-bottom:12px"><input class="search-input" ' +
      'style="flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none" ' +
      'placeholder="🔍 Поиск…" value="' + esc(shopSearch) + '" oninput="shopSearch=this.value;fillShop()"></div>' +
    '<div class="filters" style="display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">' + chips.map(function(c){
      return '<button class="chip ' + (shopFilter === c[0] ? 'active' : '') + '" ' +
        'style="padding:8px 14px;border-radius:20px;background:' + (shopFilter===c[0]?'var(--accent)':'var(--card2)') + ';border:1px solid var(--border);' +
        'color:' + (shopFilter===c[0]?'#fff':'var(--text2)') + ';font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" ' +
        'onclick="shopFilter=\'' + c[0] + '\';drawBuy()">' + c[1] + '</button>';
    }).join('') + '</div>' +
    '<div id="shopList"></div>');
  fillShop();
}

function fillShop(){
  var box = $('shopList');
  if (!box) return;
  var list = ERAS.slice();
  var s = shopSearch.trim().toLowerCase();
  if (s) list = list.filter(function(e){
    return String(e.title||'').toLowerCase().indexOf(s) >= 0 ||
      String(e.description||'').toLowerCase().indexOf(s) >= 0;
  });
  if (shopFilter === 'starter') list = list.filter(function(e){ return e.price < 5000; });
  if (shopFilter === 'middle') list = list.filter(function(e){ return e.price >= 5000 && e.price < 15000; });
  if (shopFilter === 'premium') list = list.filter(function(e){ return e.price >= 15000; });
  box.innerHTML = list.length ? list.map(eraCardShop).join('')
    : '<div class="card empty"><div class="icon">📦</div><h3>' + (ERAS.length ? 'Ничего не найдено' : 'Товаров нет') + '</h3></div>';
}

function eraCardShop(e){
  var roi = e.price > 0 ? Math.round(e.profit_amount/e.price*100) : 0;
  return '<div class="era-card">' +
    '<div class="head"><div class="title-wrap"><div class="icon">⚡</div>' +
      '<div><div class="name">' + esc(e.title) + '</div>' +
        '<div class="tier">Срок ' + e.duration_days + ' дней · +' + roi + '% ROI</div></div></div></div>' +
    '<div class="body">' +
      (e.description ? '<p class="muted" style="font-size:13px;margin-bottom:14px;line-height:1.5">' + esc(e.description) + '</p>' : '') +
      '<div class="metrics">' +
        '<div class="metric"><div class="l">Стоимость</div><div class="v">' + fmt(e.price) + '</div></div>' +
        '<div class="metric"><div class="l">Начисл.</div><div class="v profit">+' + fmt(e.profit_amount) + '</div></div>' +
        '<div class="metric"><div class="l">Итого</div><div class="v total">' + fmt(e.total_amount) + '</div></div>' +
      '</div></div>' +
    '<div class="actions">' +
      '<button class="btn secondary" onclick="openEraDetail(' + JSON.stringify(e.id) + ')">Подробнее</button>' +
      '<button class="btn" onclick="buyEra(' + JSON.stringify(e.id) + ')">Купить</button>' +
    '</div></div>';
}

function drawTop(){
  setApp(
    '<div class="topbar"><div class="brand"><div class="logo">🏆</div>Топ пользователи</div>' +
      '<div><span class="muted-sm">скоро</span></div></div>' +
    '<div class="top-hero">' +
      '<div class="th-emoji">🚧</div>' +
      '<div class="th-title">Скоро откроется</div>' +
      '<div class="th-text">' +
        'Раздел «Топ пользователи» находится в разработке.<br>' +
        'Здесь будет рейтинг лучших участников проекта.' +
      '</div>' +
      '<div class="th-list">' +
        '🏆 <b>Топ по вложениям</b><br>' +
        '💰 <b>Топ по прибыли</b><br>' +
        '👥 <b>Топ по рефералам</b><br>' +
        '⚡ <b>Скорость роста</b>' +
      '</div>' +
    '</div>' +
    '<button class="btn secondary" onclick="setTab(\'home\')">← На главную</button>'
  );
}

function drawPurchases(){
  setApp(
    '<div class="topbar"><div class="brand"><div class="logo">📦</div>Мои покупки</div>' +
      '<div><button class="icon-btn" onclick="refresh()">🔄</button></div></div>' +
    (PURCHASES.length ? PURCHASES.map(eraCardPurchase).join('')
      : '<div class="card empty"><div class="icon">📦</div><h3>Покупок нет</h3>' +
        '<button class="btn" style="max-width:240px;margin:16px auto 0" onclick="setTab(\'buy\')">🛒 Каталог</button></div>') +
    (PAYOUTS.length ? '<div class="section-title"><h2>Заявки на вывод</h2></div>' +
      PAYOUTS.map(payoutCard).join('') : ''));
}

function payoutCard(po){
  return '<div class="era-card">' +
    '<div class="head"><div class="order-num">📤 Вывод #' + esc(po.id) + '</div>' +
      '<div class="row"><div class="title-wrap"><div class="icon">💸</div>' +
        '<div><div class="name">' + esc(po.era_title||'—') + '</div>' +
          '<div class="tier">от заявки #' + esc(po.purchase_id) + '</div></div></div>' +
        '<span class="badge ' + esc(po.status) + '">' + esc(statusLabel(po.status)) + '</span></div></div>' +
    '<div class="body">' +
      '<div class="row"><span class="muted">Сумма</span>' +
        '<b style="color:var(--ok)">' + fmt(po.amount) + '</b></div>' +
      '<div class="muted-sm" style="margin-top:8px">🕐 ' + fmtDT(po.requested_at) +
        (po.paid_at ? ' · ✅ ' + fmtDT(po.paid_at) : '') + '</div>' +
    '</div></div>';
}

function drawProfile(){
  var me = ME || {}, u = tgUser() || {};
  var name = me.first_name || u.first_name || me.username || 'Пользователь';
  var photo = me.photo_url || u.photo_url || '';
  var item = function(emo, label, fn){
    return '<div class="menu-item" onclick="' + fn + '">' +
      '<div class="left"><div class="emo">' + emo + '</div><div>' + label + '</div></div>' +
      '<div style="color:var(--muted)">→</div></div>';
  };
  setApp(
    '<div class="topbar"><div class="brand"><div class="logo">👤</div>Профиль</div></div>' +
    '<div class="hero center" style="padding:24px 20px;text-align:center">' +
      '<div class="avatar lg" style="margin:0 auto 12px">' +
        (photo ? '<img src="' + esc(photo) + '" alt="">' : esc((name[0]||'?').toUpperCase())) + '</div>' +
      '<h2 style="margin-bottom:4px">' + esc(name) + '</h2>' +
      (me.username ? '<div class="muted">@' + esc(me.username) + '</div>' : '') + '</div>' +
    renderFrozenHero() +
    renderReqHero() +
    renderRefHero() +
    '<div class="section-title"><h2>Мой аккаунт</h2></div>' +
    '<div class="card" style="padding:0 16px">' +
      item('💳', 'Реквизиты для вывода', 'openRequisites()') +
      item('👥', 'Мои рефералы', 'openMyRefs()') +
      item('🏆', 'Топ пользователи', 'setTab(\'top\')') +
      item('💬', 'Связь с админом', 'openContact()') + '</div>' +
    '<div class="section-title"><h2>Данные</h2></div>' +
    '<div class="card" style="padding:0 16px">' +
      '<div class="list-item"><span class="muted">Telegram ID</span><b>' + esc(me.telegram_id||u.id||'—') + '</b></div>' +
      '<div class="list-item"><span class="muted">Username</span><b>@' + esc(me.username||u.username||'—') + '</b></div>' +
      '<div class="list-item"><span class="muted">Рефералов</span><b>' + ALL_REFERRALS.length + '</b></div>' +
      '<div class="list-item"><span class="muted">Мин. вывод</span><b style="color:var(--warn)">' + fmt(MIN_WITHDRAW) + '</b></div>' +
      '<div class="list-item"><span class="muted">Регистрация</span><b>' + fmtDT(me.registered_at) + '</b></div>' +
    '</div>');
}

var SCREENS = { home: drawHome, buy: drawBuy, top: drawTop, purchases: drawPurchases, profile: drawProfile };

async function reload(){
  var res = await Promise.all([loadEras(), loadPurchases(), loadPayouts()]);
  ERAS = res[0]; PURCHASES = res[1]; PAYOUTS = res[2];
  await loadMyReferrals();
  HAVE = { eras: 1, purchases: 1, payouts: 1, refs: 1 };
}

var RENDER_LOCK = false;
async function render(force){
  if (RENDER_LOCK) return;
  RENDER_LOCK = true;
  try {
    if (!tgUser()){ screenNoTg(); return; }
    if (IS_BLOCKED) return;
    if (USER_UID){
      try {
        var checkU = await fbGet('users/' + USER_UID);
        if (checkU && checkU.blocked){
          screenBlocked(checkU.block_reason);
          return;
        }
      } catch(e){}
    }
    if (!ME){
      $('app').innerHTML = skeleton();
      $('nav').classList.remove('hidden');
      ME = await loadMe();
      if (!ME) return;
    }
    if (!HAVE.eras || force) await reload();
    var y = window.scrollY;
    (SCREENS[CURRENT_TAB] || drawHome)();
    window.scrollTo(0, y);
    PRELOADER.finish();
  } catch(e){
    console.error(e);
    if (IS_BLOCKED) return;
    PRELOADER.fail();
    $('app').innerHTML = '<div class="topbar"><div class="brand"><div class="logo">⚠️</div>Ошибка</div></div>' +
      '<div class="card"><p style="margin-bottom:12px">' + esc(e.message) + '</p>' +
      '<button class="btn" onclick="refresh()">🔄 Повторить</button></div>';
  } finally { RENDER_LOCK = false; }
}

window.refresh = function(){ HAVE = {}; render(true); };
window.drawBuy = drawBuy;

function tickTimers(){
  if (IS_BLOCKED) return;
  document.querySelectorAll('.timer-live').forEach(function(el){
    var exp = el.dataset.expires;
    if (!exp) return;
    var ms = new Date(exp).getTime() - Date.now();
    if (ms <= 0){ el.textContent = '🏁 Завершено'; el.classList.remove('ok','warn'); el.classList.add('err'); return; }
    el.textContent = fmtCountdown(ms);
    var h = ms/3600000;
    el.classList.remove('ok','warn','err');
    if (h <= 1) el.classList.add('err');
    else if (h <= 24) el.classList.add('warn');
    else el.classList.add('ok');
  });
  document.querySelectorAll('.era-card').forEach(function(card){
    var pid = card.dataset.pid;
    if (!pid) return;
    var p = PURCHASES.filter(function(x){ return String(x.id) === pid; })[0];
    if (!p || p.status !== 'approved' || p.early_closed) return;
    var labelEl = document.getElementById('label-' + pid);
    if (labelEl){ labelEl.textContent = dayLabel(p); labelEl.className = 'days-left ' + dayCls(p); }
    var progEl = document.getElementById('prog-' + pid);
    if (progEl) progEl.style.width = progressOf(p) + '%';
  });
}

(function init(){
  try { if (tg){ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#0a0e14'); tg.setBackgroundColor && tg.setBackgroundColor('#0a0e14'); } } catch(e){}
  document.querySelectorAll('#nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === CURRENT_TAB);
  });
  $('nav').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (b && b.dataset.tab) window.setTab(b.dataset.tab);
  });
  render();
  setInterval(function(){
    if (document.hidden) return;
    if (!tgUser()) return;
    render(true);
  }, POLL_MS);
  setInterval(tickTimers, 1000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && tgUser()) render(true);
  });
})();
</script>
</body>
</html>
