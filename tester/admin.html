<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель — Эры</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --border:#2a3240;
    --text:#e6edf3; --muted:#8b949e; --accent:#4f8cff;
    --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
  .layout{display:flex;min-height:100vh}
  .side{width:220px;background:var(--card);border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0}
  .side h2{font-size:14px;margin:0 0 16px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:2px}
  .side button:hover{background:var(--card2)}
  .side button.active{background:var(--accent);color:#fff}
  .main{flex:1;padding:24px;overflow-x:auto}
  h1{font-size:22px;margin:0 0 20px;font-weight:600}
  h3{font-size:15px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
  .stat .v{font-size:20px;font-weight:700;margin-top:4px}
  .stat .l{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr:hover td{background:var(--card2)}
  .badge{display:inline-block;padding:3px 8px;border-radius:14px;font-size:11px;font-weight:600}
  .badge.awaiting_payment{background:#3a2f10;color:var(--warn)}
  .badge.active{background:#0f3a26;color:var(--ok)}
  .badge.completed{background:#1a2e4a;color:#63a9ff}
  .badge.awaiting_payout{background:#3a2f10;color:var(--warn)}
  .badge.paid{background:#0f3a26;color:var(--ok)}
  .badge.pending{background:#3a2f10;color:var(--warn)}
  .badge.cancelled{background:#3a1010;color:var(--err)}
  .btn{padding:7px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;
    font-size:12px;font-weight:600;cursor:pointer;margin-right:4px}
  .btn.secondary{background:var(--card2);border:1px solid var(--border);color:var(--text)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .input,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:13px;outline:none;font-family:inherit}
  .input:focus,textarea:focus{border-color:var(--accent)}
  .form-row{margin-bottom:12px}
  .form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .flex{display:flex;gap:8px;align-items:center}
  .flex-wrap{flex-wrap:wrap}
  .muted{color:var(--muted);font-size:12px}
  .toast{position:fixed;top:20px;right:20px;background:var(--card2);border:1px solid var(--border);
    padding:12px 18px;border-radius:10px;z-index:999;font-size:13px}
  .hidden{display:none !important}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:360px}
  pre{background:var(--card2);padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:400px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:768px){
    .layout{flex-direction:column}
    .side{width:100%;border-right:0;border-bottom:1px solid var(--border);
      display:flex;overflow-x:auto;padding:8px}
    .side h2{display:none}
    .side button{width:auto;white-space:nowrap;margin-right:4px;margin-bottom:0}
    .main{padding:16px}
    table{font-size:12px}
    th,td{padding:6px}
  }
</style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast hidden"></div>

<script>
const API = (location.origin.startsWith('http') ? location.origin : 'http://localhost:8000');
let TOKEN = localStorage.getItem('admin_token') || '';
let TAB = 'dashboard';

function toast(msg, ms=2500){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.add('hidden'), ms);
}

async function api(path, opts={}){
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API + path, {...opts, headers});
  if (res.status === 401){ logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.detail || 'Ошибка');
  return data;
}

function logout(){
  localStorage.removeItem('admin_token'); TOKEN = ''; location.reload();
}

// ============================================================
// ЛОГИН
// ============================================================
function renderLogin(){
  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h1 style="margin-bottom:20px">Админ-панель</h1>
        <div class="form-row">
          <label>Логин</label>
          <input class="input" id="login" value="admin">
        </div>
        <div class="form-row">
          <label>Пароль</label>
          <input class="input" id="password" type="password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn" style="width:100%;padding:12px;font-size:14px" onclick="doLogin()">Войти</button>
      </div>
    </div>
  `;
}

async function doLogin(){
  const login = document.getElementById('login').value;
  const password = document.getElementById('password').value;
  try {
    const res = await api('/api/admin/login', {method:'POST', body:{login, password}});
    TOKEN = res.token; localStorage.setItem('admin_token', TOKEN);
    render();
  } catch(e){ toast(e.message); }
}

// ============================================================
// LAYOUT
// ============================================================
const TABS = [
  {id:'dashboard', label:'📊 Dashboard'},
  {id:'users', label:'👥 Пользователи'},
  {id:'purchases', label:'🛒 Покупки'},
  {id:'payouts', label:'💸 Выплаты'},
  {id:'eras', label:'🧩 Эры'},
  {id:'content', label:'📝 Контент'},
  {id:'logs', label:'📜 Журнал'},
];

function layout(content){
  document.getElementById('root').innerHTML = `
    <div class="layout">
      <aside class="side">
        <h2>Эры · Админ</h2>
        ${TABS.map(t=>`<button class="${TAB===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('')}
        <button onclick="logout()" style="margin-top:20px;color:var(--err)">🚪 Выйти</button>
      </aside>
      <main class="main" id="main">${content}</main>
    </div>
  `;
}

async function setTab(t){ TAB = t; await render(); }

// ============================================================
// DASHBOARD
// ============================================================
async function tabDashboard(){
  const d = await api('/api/admin/dashboard');
  layout(`
    <h1>Dashboard</h1>
    <div class="grid">
      <div class="stat"><div class="l">Пользователей</div><div class="v">${d.users}</div></div>
      <div class="stat"><div class="l">Активных эр</div><div class="v">${d.active_eras}</div></div>
      <div class="stat"><div class="l">Завершённых</div><div class="v">${d.completed_eras}</div></div>
      <div class="stat"><div class="l">Заявок на покупку</div><div class="v">${d.purchase_requests}</div></div>
      <div class="stat"><div class="l">Заявок на вывод</div><div class="v">${d.payout_requests}</div></div>
      <div class="stat"><div class="l">Сумма покупок</div><div class="v">${fmt(d.total_purchases_sum)}</div></div>
      <div class="stat"><div class="l">Начислено</div><div class="v">${fmt(d.total_profit_sum)}</div></div>
      <div class="stat"><div class="l">Выплачено</div><div class="v">${fmt(d.total_paid_sum)}</div></div>
    </div>
  `);
}

// ============================================================
// USERS
// ============================================================
async function tabUsers(){
  const list = await api('/api/admin/users');
  layout(`
    <h1>Пользователи (${list.length})</h1>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr>
          <th>ID</th><th>Username</th><th>Имя</th><th>Telegram ID</th>
          <th>Реферер</th><th>Покупок</th><th>Регистрация</th><th></th>
        </tr></thead>
        <tbody>
        ${list.map(u=>`
          <tr>
            <td>${u.id}</td>
            <td>@${esc(u.telegram_username||'—')}</td>
            <td>${esc(u.first_name||'')} ${esc(u.last_name||'')}</td>
            <td>${u.telegram_id}</td>
            <td>${u.referrer_username ? '@'+esc(u.referrer_username) : '—'}</td>
            <td>${u.purchases_count}</td>
            <td>${fmtDate(u.registered_at)}</td>
            <td><button class="btn secondary" onclick="showRefTree(${u.id})">Дерево</button></td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `);
}

async function showRefTree(uid){
  const tree = await api('/api/admin/referral_tree/'+uid);
  const html = renderTree(tree.children);
  layout(`
    <button class="btn secondary" onclick="setTab('users')">← Назад</button>
    <h1 style="margin-top:14px">Реферальное дерево #${uid}</h1>
    <div class="card"><pre>${html || 'Нет рефералов'}</pre></div>
  `);
}
function renderTree(nodes, depth=0){
  return nodes.map(n=>'  '.repeat(depth) + `• ${esc(n.name||'')} @${esc(n.username||'—')} (#${n.id})\n` +
    renderTree(n.children||[], depth+1)).join('');
}

// ============================================================
// PURCHASES
// ============================================================
async function tabPurchases(){
  const list = await api('/api/admin/purchases');
  layout(`
    <h1>Покупки (${list.length})</h1>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr>
          <th>#</th><th>Пользователь</th><th>Эра</th><th>Сумма</th>
          <th>Заявка</th><th>Активация</th><th>Завершение</th><th>Статус</th><th>Действия</th>
        </tr></thead>
        <tbody>
        ${list.map(p=>`
          <tr>
            <td>${p.id}</td>
            <td>${esc(p.first_name||'')}<br><span class="muted">@${esc(p.telegram_username||'—')} · ${p.telegram_id}</span></td>
            <td>${esc(p.era_title||'')}</td>
            <td>${fmt(p.purchase_price)}<br><span class="muted">→ ${fmt(p.total_amount)}</span></td>
            <td>${fmtDate(p.created_at)}</td>
            <td>${p.activated_at?fmtDate(p.activated_at):'—'}</td>
            <td>${p.expires_at?fmtDate(p.expires_at):'—'}</td>
            <td><span class="badge ${p.status}">${statusLabel(p.status)}</span></td>
            <td>
              ${p.status==='awaiting_payment'?`
                <button class="btn ok" onclick="confirmPurchase(${p.id})">✓ Подтвердить</button>
                <button class="btn danger" onclick="cancelPurchase(${p.id})">✕ Отменить</button>
              `:''}
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `);
}

async function confirmPurchase(id){
  if (!confirm(`Подтвердить оплату покупки #${id}?`)) return;
  try {
    await api(`/api/admin/purchases/${id}/confirm`, {method:'POST'});
    toast('Оплата подтверждена'); render();
  } catch(e){ toast(e.message); }
}
async function cancelPurchase(id){
  if (!confirm(`Отменить заявку #${id}?`)) return;
  try {
    await api(`/api/admin/purchases/${id}/cancel`, {method:'POST'});
    toast('Отменено'); render();
  } catch(e){ toast(e.message); }
}

// ============================================================
// PAYOUTS
// ============================================================
async function tabPayouts(){
  const list = await api('/api/admin/payouts');
  layout(`
    <h1>Выплаты (${list.length})</h1>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr>
          <th>#</th><th>Пользователь</th><th>Эра</th><th>Сумма</th>
          <th>Дата заявки</th><th>Дата выплаты</th><th>Статус</th><th></th>
        </tr></thead>
        <tbody>
        ${list.map(p=>`
          <tr>
            <td>${p.id}</td>
            <td>${esc(p.first_name||'')}<br><span class="muted">@${esc(p.telegram_username||'—')} · ${p.telegram_id}</span></td>
            <td>${esc(p.era_title||'')}</td>
            <td>${fmt(p.amount)}</td>
            <td>${fmtDate(p.requested_at)}</td>
            <td>${p.paid_at?fmtDate(p.paid_at):'—'}</td>
            <td><span class="badge ${p.status}">${p.status==='paid'?'Выплачено':'Ожидает'}</span></td>
            <td>
              ${p.status==='pending'?`
                <button class="btn ok" onclick="markPaid(${p.id})">✓ Выплачено</button>
                <button class="btn danger" onclick="cancelPayout(${p.id})">✕ Отменить</button>
              `:''}
            </td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `);
}

async function markPaid(id){
  if (!confirm(`Отметить выплату #${id} как выполненную?`)) return;
  try { await api(`/api/admin/payouts/${id}/mark_paid`, {method:'POST'}); toast('Готово'); render(); }
  catch(e){ toast(e.message); }
}
async function cancelPayout(id){
  if (!confirm(`Отменить заявку на вывод #${id}?`)) return;
  try { await api(`/api/admin/payouts/${id}/cancel`, {method:'POST'}); toast('Отменено'); render(); }
  catch(e){ toast(e.message); }
}

// ============================================================
// ERAS
// ============================================================
async function tabEras(){
  const list = await api('/api/admin/eras');
  layout(`
    <h1>Эры</h1>
    <div class="muted" style="margin-bottom:12px">Изменения применяются только к новым покупкам</div>
    ${list.map(e=>`
      <div class="card">
        <div class="flex" style="justify-content:space-between;margin-bottom:10px">
          <h3>${esc(e.title)}</h3>
          <span class="badge ${e.is_active?'active':'cancelled'}">${e.is_active?'Активна':'Отключена'}</span>
        </div>
        <div class="grid3">
          <div class="form-row"><label>Название</label><input class="input" id="t_${e.id}" value="${esc(e.title)}"></div>
          <div class="form-row"><label>Стоимость</label><input class="input" id="p_${e.id}" type="number" value="${e.price}"></div>
          <div class="form-row"><label>Срок (дней)</label><input class="input" id="d_${e.id}" type="number" value="${e.duration_days}"></div>
          <div class="form-row"><label>Начисление</label><input class="input" id="pr_${e.id}" type="number" value="${e.profit_amount}"></div>
          <div class="form-row"><label>Итог (авто)</label><input class="input" value="${e.price + e.profit_amount}" disabled></div>
          <div class="form-row"><label>Активна</label>
            <select class="input" id="a_${e.id}">
              <option value="1" ${e.is_active?'selected':''}>Да</option>
              <option value="0" ${!e.is_active?'selected':''}>Нет</option>
            </select>
          </div>
        </div>
        <div class="form-row"><label>Описание</label>
          <textarea class="input" id="desc_${e.id}" rows="2">${esc(e.description||'')}</textarea>
        </div>
        <button class="btn" onclick="saveEra(${e.id})">Сохранить</button>
      </div>
    `).join('')}
  `);
}

async function saveEra(id){
  const body = {
    title: document.getElementById('t_'+id).value,
    price: parseFloat(document.getElementById('p_'+id).value)||0,
    duration_days: parseInt(document.getElementById('d_'+id).value)||0,
    profit_amount: parseFloat(document.getElementById('pr_'+id).value)||0,
    description: document.getElementById('desc_'+id).value,
    is_active: parseInt(document.getElementById('a_'+id).value),
    sort_order: id,
  };
  try { await api('/api/admin/eras/'+id, {method:'PUT', body}); toast('Сохранено'); render(); }
  catch(e){ toast(e.message); }
}

// ============================================================
// CONTENT
// ============================================================
async function tabContent(){
  const keys = [
    {k:'marketing_image', t:'Маркетинговое изображение', upload:true},
    {k:'rules_text', t:'Правила проекта', textarea:true},
    {k:'terms_text', t:'Условия участия', textarea:true},
    {k:'notif_registration', t:'Уведомление: регистрация'},
    {k:'notif_purchase_created', t:'Уведомление: заявка на покупку'},
    {k:'notif_purchase_activated', t:'Уведомление: активация'},
    {k:'notif_era_completed', t:'Уведомление: завершение'},
    {k:'notif_payout_requested', t:'Уведомление: заявка на вывод'},
    {k:'notif_payout_paid', t:'Уведомление: выплата'},
  ];
  const values = {};
  await Promise.all(keys.map(async ({k})=>{ const r = await api('/api/content/'+k); values[k] = r.value; }));

  layout(`
    <h1>Контент</h1>
    ${keys.map(({k,t,textarea,upload})=>`
      <div class="card">
        <h3>${t}</h3>
        ${upload ? `
          ${values[k] ? `<img src="${API}${values[k]}" style="max-width:100%;max-height:200px;border-radius:8px;margin-bottom:8px">` : '<div class="muted">Не загружено</div>'}
          <input type="file" id="f_${k}" class="input" style="margin-top:8px">
          <button class="btn" style="margin-top:8px" onclick="uploadFile('${k}')">Загрузить</button>
        ` : `
          ${textarea
            ? `<textarea class="input" id="c_${k}" rows="6">${esc(values[k]||'')}</textarea>`
            : `<input class="input" id="c_${k}" value="${esc(values[k]||'')}">`}
          <button class="btn" style="margin-top:8px" onclick="saveContent('${k}')">Сохранить</button>
        `}
      </div>
    `).join('')}
  `);
}

async function saveContent(key){
  const value = document.getElementById('c_'+key).value;
  try { await api('/api/admin/content', {method:'POST', body:{key, value}}); toast('Сохранено'); }
  catch(e){ toast(e.message); }
}

async function uploadFile(key){
  const f = document.getElementById('f_'+key).files[0];
  if (!f) return toast('Выберите файл');
  const fd = new FormData(); fd.append('file', f);
  try { await api('/api/admin/upload/marketing', {method:'POST', body: fd}); toast('Загружено'); render(); }
  catch(e){ toast(e.message); }
}

// ============================================================
// LOGS
// ============================================================
async function tabLogs(){
  const list = await api('/api/admin/actions');
  layout(`
    <h1>Журнал действий</h1>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr><th>#</th><th>Админ</th><th>Действие</th><th>Детали</th><th>Дата</th></tr></thead>
        <tbody>
        ${list.map(a=>`
          <tr><td>${a.id}</td><td>${esc(a.admin)}</td><td>${esc(a.action)}</td>
          <td>${esc(a.details)}</td><td>${fmtDate(a.created_at)}</td></tr>
        `).join('')}
        </tbody>
      </table>
    </div>
  `);
}

// ============================================================
// УТИЛИТЫ
// ============================================================
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try { return new Date(s).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
function statusLabel(s){
  return ({awaiting_payment:'Ожидает оплаты', active:'Активен', completed:'Завершён',
    awaiting_payout:'Ожидает выплаты', paid:'Выплачен', cancelled:'Отменён'})[s] || s;
}

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
async function render(){
  if (!TOKEN){ renderLogin(); return; }
  try {
    const routes = {
      dashboard: tabDashboard, users: tabUsers, purchases: tabPurchases,
      payouts: tabPayouts, eras: tabEras, content: tabContent, logs: tabLogs
    };
    await routes[TAB]();
  } catch(e){
    console.error(e);
    if (e.message === 'Unauthorized') return;
    toast(e.message);
  }
}

render();
</script>
</body>
</html>
