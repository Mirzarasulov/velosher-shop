<script>
window.addEventListener('error', function(e){
  var app = document.getElementById('app');
  if (!app) return;
  if (app.innerHTML && app.innerHTML.trim().length > 100) return;
  app.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;' +
    'background:#1c2330;border:1px solid #ff5c5c;border-radius:12px;' +
    'color:#e6edf3;font-family:monospace;font-size:13px;line-height:1.7">' +
    '<div style="font-size:18px;color:#ff5c5c;font-weight:700;margin-bottom:12px">⚠️ Ошибка</div>' +
    '<div style="margin-bottom:10px"><b>Сообщение:</b> ' + (e.message || '—') + '</div>' +
    '<div style="margin-bottom:10px"><b>Строка:</b> ' + (e.lineno || '—') + ':' + (e.colno || '—') + '</div>' +
    '<button onclick="location.reload()" style="padding:10px 16px;background:#4f8cff;' +
    'color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:600">🔄 Перезагрузить</button>' +
    '</div>';
});
</script>
<style>

  --accent:#4f8cff; --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c;
  --info:#63a9ff; --purple:#a78bfa;
  --gold:#e0b84a; --gold2:#b8862d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit}
.hidden{display:none !important}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--card);border-right:1px solid var(--border);
  padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;

.side .logo .ic{width:36px;height:36px;border-radius:10px;background:var(--accent);

.side .logo .t{font-weight:700;font-size:15px}
.side .logo .s{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.side .nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:#c4ccd6;padding:11px 12px;border-radius:9px;
  cursor:pointer;font-size:13.5px;margin-bottom:2px;font-weight:500}
.side .nav:hover{background:var(--card2)}
.side .nav.active{background:var(--accent);color:#fff}
.side .nav .emo{font-size:16px;width:20px;text-align:center}
.side .nav .badge-n{margin-left:auto;padding:2px 8px;border-radius:10px;

.side .sect{font-size:10px;color:var(--muted);text-transform:uppercase;

.main{flex:1;min-width:0;padding:20px 24px}
.h1{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));

.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.stat .ic{font-size:22px;margin-bottom:6px}

.stat .v{font-size:20px;font-weight:700}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}
.stat .v.accent{color:var(--accent)} .stat .v.purple{color:var(--purple)}
.stat .v.info{color:var(--info)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:14px}
.card.clickable{cursor:pointer;transition:border-color .15s,background .15s}
.card.clickable:hover{border-color:var(--accent);background:var(--card2)}
.card.clickable:active{transform:scale(.99)}
.btn{padding:10px 16px;border-radius:9px;border:0;background:var(--accent);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  min-height:40px;justify-content:center;transition:opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:#c4ccd6}
.btn.danger{background:var(--err)}
.btn.ok{background:var(--ok);color:#04241a}
.btn.warn{background:var(--warn);color:#2a1a00}
.btn.purple{background:var(--purple);color:#12002e}
.btn.gold{background:linear-gradient(135deg,#f5d97a,#e0b84a,#b8862d);color:#2a1a00;font-weight:800}
.btn.sm{padding:7px 12px;font-size:12px;min-height:34px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge.created{background:rgba(99,169,255,.15);color:#63a9ff}
.badge.pending,.badge.frozen,.badge.pending_active{background:rgba(245,181,71,.15);color:var(--warn)}
.badge.approved,.badge.completed,.badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
.badge.cancelled,.badge.rejected,.badge.blocked{background:rgba(255,92,92,.15);color:var(--err)}
.badge.purple{background:rgba(167,139,250,.15);color:var(--purple)}
.badge.early{background:rgba(245,181,71,.2);color:var(--warn);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;margin:10px 0}
.cell{background:var(--card2);border-radius:9px;padding:10px 12px}

.cell span{font-size:14px;font-weight:600}
.cell span.ok{color:var(--ok)} .cell span.accent{color:var(--accent)} .cell span.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow{margin-bottom:12px}

  text-transform:uppercase;font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--border);

.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}

.tab{padding:9px 15px;border-radius:20px;background:var(--card2);

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);

.toast.err{border-color:var(--err);color:#ffb3b3}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border2);

.login-box h1{font-size:22px;text-align:center;margin-bottom:24px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}

.muted{color:var(--muted);font-size:12.5px}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.mh{padding:18px;border-bottom:1px solid var(--border);display:flex;
  justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:2}
.mh h2{font-size:17px}
.mb{padding:18px}
.mf{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px}
.mf .btn{flex:1}
.x{width:36px;height:36px;border-radius:50%;background:var(--card2);
  border:1px solid var(--border2);color:#c4ccd6;font-size:18px;cursor:pointer}
.search{position:relative;margin-bottom:14px}
.search input{padding-left:38px}

.ref .lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);

.ri{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  font-size:13.5px;gap:10px;flex-wrap:wrap}
.ri+.ri{border-top:1px solid var(--border)}
.ri a{color:var(--accent);text-decoration:none}
.date{background:var(--card3);border-radius:10px;padding:12px 14px;margin-top:12px;
  border-left:3px solid var(--accent)}
.date .lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));

.dcell{background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px}

.dleft{padding:8px 10px;border-radius:8px;font-size:13px}
.dleft.ok{background:rgba(57,217,138,.12);color:var(--ok)}
.dleft.warn{background:rgba(245,181,71,.12);color:var(--warn)}
.dleft.err{background:rgba(255,92,92,.15);color:var(--err)}
.dleft.muted{background:rgba(139,148,158,.12);color:var(--muted)}

.req-block{

}

.req-block .req-val{font-weight:700;color:#a8f0cc}
.req-block .req-val code{background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px;
  font-size:13.5px;color:#a8f0cc}

.ref-setup-item{
  background:var(--card2);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;
  cursor:pointer;transition:border-color .15s,background .15s;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.ref-setup-item:hover{border-color:var(--accent);background:rgba(79,140,255,.05)}
.ref-setup-item:active{transform:scale(.99)}
.ref-setup-item .rsi-name{font-weight:700;font-size:13.5px}
.ref-setup-item .rsi-sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.ref-setup-item .rsi-badge{
  padding:3px 8px;border-radius:6px;background:rgba(167,139,250,.15);
  color:var(--purple);font-size:10px;font-weight:700;white-space:nowrap;
}
.ref-setup-step{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--accent);
  margin-bottom:10px;padding:8px 12px;
  background:rgba(79,140,255,.08);border-radius:8px;
}
.ref-setup-preview{
  background:linear-gradient(135deg,#1b2a4a 0%,#16233f 100%);
  border:1px solid #2c3d63;border-radius:12px;padding:14px;
  margin:12px 0;text-align:center;
}
.ref-setup-preview .arrow{font-size:24px;color:var(--purple);margin:6px 0}
.ref-setup-preview .who{font-weight:700;font-size:14px}

.catalog-logo{text-align:center;margin-bottom:20px;position:relative}
.catalog-logo .emblem{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;

.catalog-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;

  .stats{grid-template-columns:repeat(2,1fr)}
  .purchase-item .pi-metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try { return new Date(s).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:TZ_TASHKENT}); }
  catch(e){ return s; }
}
function fmtD(s){
  if (!s) return '—';
  try { return new Date(s).toLocaleDateString('ru-RU',
    {day:'2-digit',month:'2-digit',year:'numeric',timeZone:TZ_TASHKENT}); }
  catch(e){ return s; }
}
function statusLabel(s){
  return {created:'Ожидает', approved:'Активен', completed:'Завершён',
    paid:'Выплачен', cancelled:'Отменён', pending:'Ожидает',
    rejected:'Отклонён', frozen:'Заморожен', pending_active:'Ждёт активности',
    blocked:'Заблокирован'
  }[s] || s;
}
function toast(msg, type, ms){
  var t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.add('hidden'); }, ms || 2600);
}
function toList(raw){
  if (Array.isArray(raw)) return raw.filter(function(x){ return x && typeof x === 'object'; })
    .map(function(v,i){ var o = Object.assign({}, v); o._key = String(i); return o; });
  if (raw && typeof raw === 'object') return Object.keys(raw)
    .filter(function(k){ return raw[k] && typeof raw[k] === 'object'; })
    .map(function(k){ var o = Object.assign({}, raw[k]); o._key = k; return o; });
  return [];
}
function cacheBust(){ return '?ts=' + Date.now(); }
async function fbGet(path){
  var r = await fetch(FIREBASE + '/' + path + '.json' + cacheBust(), {cache:'no-store'});
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbPut(path, data){
  var r = await fetch(FIREBASE + '/' + path + '.json', {
    method:'PUT', body: JSON.stringify(data), headers: {'Content-Type':'application/json'}
  });
  if (!r.ok) throw new Error('PUT ' + path + ': ' + r.status);
  return r.json();
}
async function fbPatch(path, data){
  var r = await fetch(FIREBASE + '/' + path + '.json', {
    method:'PATCH', body: JSON.stringify(data), headers: {'Content-Type':'application/json'}
  });
  if (!r.ok) throw new Error('PATCH ' + path + ': ' + r.status);
  return r.json();
}
async function fbPost(path, data){
  var r = await fetch(FIREBASE + '/' + path + '.json', {
    method:'POST', body: JSON.stringify(data), headers: {'Content-Type':'application/json'}
  });
  if (!r.ok) throw new Error('POST ' + path + ': ' + r.status);
  return r.json();
}
async function fbDelete(path){
  var r = await fetch(FIREBASE + '/' + path + '.json', {method:'DELETE'});
  if (!r.ok) throw new Error('DELETE ' + path + ': ' + r.status);
  return true;
}
async function once(key, fn){
  if (BUSY[key]) return null;
  BUSY[key] = 1;
  try { return await fn(); }
  catch(e){
    console.error(e);
    toast('❌ ' + (e.message || 'Ошибка'), 'err');
    return null;
  } finally { delete BUSY[key]; }
}
function pushLog(action, info){
  LOG.unshift({ ts: new Date().toISOString(), action: action, info: info });
  if (LOG.length > 50) LOG.pop();
}
function findUser(users, tgId){
  if (!tgId) return null;
  for (var i=0;i<users.length;i++){
    if (String(users[i].telegram_id) === String(tgId)) return users[i];
  }
  return null;
}
function userName(u){
  if (!u) return '—';
  return ((u.first_name || '') + (u.last_name ? ' ' + u.last_name : '')) || 'Без имени';
}
function userLink(u){
  if (!u) return '';
  if (u.username) return '<a href="https://t.me/' + esc(u.username) + '" target="_blank">@' + esc(u.username) + '</a>';
  return '<a href="tg://user?id=' + esc(u.telegram_id) + '" target="_blank">ID ' + esc(u.telegram_id) + '</a>';
}
function fmtLeft(ms){
  if (ms == null) return '—';
  if (ms <= 0) return '⏹ Завершено';
  var s = Math.floor(ms/1000);
  var d = Math.floor(s/86400), h = Math.floor((s%86400)/3600),
      m = Math.floor((s%3600)/60), sec = s%60;
  if (d > 0) return d+'д '+h+'ч '+m+'м';
  if (h > 0) return h+'ч '+m+'м '+sec+'с';
  if (m > 0) return m+'м '+sec+'с';
  return sec+'с';
}
function userMatches(u, q){
  if (!q) return true;
  if (!u) return false;
  q = q.toLowerCase().trim();
  return String(u.first_name||'').toLowerCase().indexOf(q) >= 0 ||
         String(u.last_name||'').toLowerCase().indexOf(q) >= 0 ||
         String(u.username||'').toLowerCase().indexOf(q) >= 0 ||
         String(u.telegram_id||'').indexOf(q) >= 0;
}
function calcUserRefBalance(uid){
  var accrued=0, paid=0, pending=0, frozen=0, pendingActive=0;
  var lastPaidAt=null, lastPaidAmount=0;
  var myIds = {};
  DATA.users.forEach(function(u){
    if (String(u.referrer_uid || '') === String(uid)) myIds[String(u.telegram_id)] = 1;
  });
  DATA.purchases.forEach(function(p){
    if (!myIds[String(p.user_telegram_id)]) return;
    if (['rejected','cancelled'].indexOf(p.status) >= 0) return;
    var b = Number(p.referral_bonus || 0)
      || Math.round(Number(p.purchase_price || 0) * REF_PERCENT / 100);
    var st = p.referral_status || 'pending';
    if (st === 'rejected') return;
    if (st === 'paid'){
      accrued += b; paid += b;
      if (p.referral_paid_at && (!lastPaidAt || p.referral_paid_at > lastPaidAt)){
        lastPaidAt = p.referral_paid_at;
        lastPaidAmount = Number(p.referral_paid_amount || 0) || b;
      }
    } else if (st === 'frozen'){
      accrued += b;
      frozen += Number(p.referral_frozen_amount || 0) || b;
    } else if (st === 'approved'){
      accrued += b;
    } else if (st === 'pending_active'){
      pendingActive += b;
    } else {
      pending += b;
    }
  });
  return { accrued: accrued, paid: paid, pending: pending, frozen: frozen,
    pendingActive: pendingActive,
    owed: Math.max(0, accrued - paid - frozen),
    lastPaidAt: lastPaidAt, lastPaidAmount: lastPaidAmount };
}

window.copyText = function(text){
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('📋 Скопировано: ' + text, 'ok', 2500);
    }).catch(function(){ fallbackCopyText(text); });
  } else {
    fallbackCopyText(text);
  }
};
function fallbackCopyText(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('📋 Скопировано', 'ok', 2000); }
  catch(e){ toast('❌ Не удалось', 'err'); }
  ta.remove();
}

/* ═══ ЗАЯВКИ ═══ */
var purchaseFilter = 'created';
var purchaseSearch = '';
function filterPurchases(){
  var q = purchaseSearch.toLowerCase().trim();
  if (!q) return DATA.purchases;
  return DATA.purchases.filter(function(p){
    var buyer = findUser(DATA.users, p.user_telegram_id);
    return (buyer && userMatches(buyer, q)) ||
      String(p.user_first_name||'').toLowerCase().indexOf(q) >= 0 ||
      String(p.user_username||'').toLowerCase().indexOf(q) >= 0 ||
      String(p.user_telegram_id||'').indexOf(q) >= 0 ||
      String(p.era_title||'').toLowerCase().indexOf(q) >= 0 ||
      String(p.id||'').indexOf(q) >= 0;
  });
}
function drawPurchaseList(){
  var box = $('purchaseListBox');
  if (!box) return;
  var filtered = filterPurchases();
  var counts = {
    created: filtered.filter(function(p){ return p.status === 'created'; }).length,
    approved: filtered.filter(function(p){ return p.status === 'approved'; }).length,
    completed: filtered.filter(function(p){ return p.status === 'completed'; }).length,
    all: filtered.length
  };
  var tabs = document.querySelectorAll('#purchaseTabs .tab');
  if (tabs.length === 4){
    tabs[0].innerHTML = '⏳ Ждут (' + counts.created + ')';
    tabs[1].innerHTML = '🟢 Активные (' + counts.approved + ')';
    tabs[2].innerHTML = '🏁 Завершено (' + counts.completed + ')';
    tabs[3].innerHTML = '📋 Все (' + counts.all + ')';
  }
  var shown = purchaseFilter === 'all' ? filtered
    : filtered.filter(function(p){ return p.status === purchaseFilter; });
  box.innerHTML = shown.length ? shown.map(orderCard).join('')
    : '<div class="empty"><div class="ic">📭</div><p>' +
      (purchaseSearch ? 'Ничего не найдено' : 'Нет заявок') + '</p></div>';
}

window.setPurchaseFilter = function(f){
  purchaseFilter = f;
  var tabs = document.querySelectorAll('#purchaseTabs .tab');
  var map = ['created','approved','completed','all'];
  tabs.forEach(function(t, i){ t.classList.toggle('active', map[i] === f); });
  drawPurchaseList();
};
var _purchaseSearchTimer = null;
window.onPurchaseSearchInput = function(){
  var el = $('purchaseSearchInput');
  if (!el) return;
  purchaseSearch = el.value;
  clearTimeout(_purchaseSearchTimer);
  _purchaseSearchTimer = setTimeout(function(){ drawPurchaseList(); }, 250);
};

function orderCard(p){
  var k = p._key;
  var buyer = findUser(DATA.users, p.user_telegram_id);
  var referrer = buyer && buyer.referrer_uid ? findUser(DATA.users, buyer.referrer_uid) : null;
  var canConfirm = ['created'].indexOf(p.status) >= 0;
  var canCancel = canConfirm;
  var isActive = p.status === 'approved';
  var isDone = ['completed','paid'].indexOf(p.status) >= 0;
  var isEarly = !!p.early_closed;

  var fast = '⏳';
  if (isActive && p.expires_at){
    var leftMs = new Date(p.expires_at).getTime() - Date.now();
    var h = leftMs / 3600000;
    if (leftMs <= 0) fast = '⚫';
    else if (h <= 24) fast = '🔴';
    else if (h <= 72) fast = '🟡';
    else fast = '🟢';
  } else if (isDone) fast = '🏁';

  var dateBlock = '';
  if (isActive || isDone){
    var expMs = p.expires_at ? new Date(p.expires_at).getTime() : null;
    var remain = expMs ? expMs - Date.now() : null;
    var cls = 'ok', txt = '—';
    if (isEarly){ cls = 'warn'; txt = 'Отключено админом'; }
    else if (remain != null){
      if (remain <= 0){ cls = 'muted'; txt = 'Завершено'; }
      else {
        var hh = remain/3600000;
        txt = fmtLeft(remain);
        if (hh <= 24) cls = 'err';
        else if (hh <= 72) cls = 'warn';
        else cls = 'ok';
      }
    }
    dateBlock = '<div class="date"><div class="lbl">🗓 Сроки эры</div>' +
      '<div class="dgrid">' +
        '<div class="dcell"><b>▶️ Начало</b><span>' + fmtD(p.start_date) + '</span></div>' +
        '<div class="dcell"><b>🏁 Последний</b><span>' + fmtD(p.last_day) + '</span></div>' +
        '<div class="dcell"><b>⏰ Истекает</b><span>' + fmtDate(p.expires_at) + '</span></div>' +
        '<div class="dcell"><b>📅 Длит.</b><span>' + Number(p.duration_days||p.days||0) + ' дн.</span></div>' +
      '</div>' +
      '<div class="dleft ' + cls + '">' +
        (isEarly
          ? '🔌 <b>Отключено досрочно</b> · ' + fmtDate(p.early_closed_at)
          : '⏳ Осталось: <b>' + txt + '</b>') +
      '</div></div>';

  var refBlock = '';

      || Math.round(Number(p.purchase_price || 0) * REF_PERCENT / 100);

      paid:'💸 Выплачено', rejected:'❌ Отклонено', pending_active:'❄️ ЗАМОРОЖЕНО'
    }[st] || st;
    var stColor = (st === 'rejected') ? 'var(--err)' :
                  (st === 'pending_active') ? 'var(--warn)' :
                  (st === 'frozen') ? 'var(--warn)' : 'var(--ok)';
    var refU = findUser(DATA.users, p.referrer_uid);
    var refName = refU ? userName(refU) : ('ID ' + p.referrer_uid);

    var refNote = '';
    if (st === 'pending_active'){
      refNote = '<div class="muted" style="margin-top:6px;font-size:11.5px;color:var(--warn)">' +
        '❄️ У реферера нет активной эры. Бонус заморожен.</div>' +
        '<div style="margin-top:8px"><button class="btn warn sm" onclick="admForceActivate(\'' + esc(p.referrer_uid) + '\')">🔓 Разморозить</button></div>';
    } else if (st === 'rejected'){
      refNote = '<div class="muted" style="margin-top:6px;font-size:11.5px;color:var(--err)">❌ Бонус не начислен</div>';
    }

    refBlock = '<div class="ref" style="border-left-color:' + stColor + '">' +
      '<div class="lbl">🎁 Реферальный бонус</div>' +
      '<div class="ri"><div>Кому: <b>' + esc(refName) + '</b></div>' +
        '<div class="muted">' + REF_PERCENT + '% от покупки</div></div>' +
      '<div class="ri"><div>Сумма: <b style="color:var(--ok)">' + fmt(bonus) + '</b></div>' +
        '<span class="badge ' + st + '">' + stLabel + '</span></div>' +
      refNote + '</div>';
  }

  return '<div class="card" data-k="' + esc(k) + '">' +
    '<div class="row" style="margin-bottom:12px">' +
      '<div>' +
        '<b style="color:#4f8cff;font-size:16px">📩 Заявка #' + esc(p.id) + ' ' + fast + '</b>' +
        (isEarly ? '<span class="badge early">🔌 Досрочно</span>' : '') +
      '</div>' +
      '<span class="badge ' + esc(p.status) + '">' + statusLabel(p.status) + '</span></div>' +
    '<div class="grid">' +
      '<div class="cell"><b>👤 Участник</b><span>' + esc(p.user_first_name||'—') + '</span></div>' +
      '<div class="cell"><b>🔗 Ник</b><span>@' + esc(p.user_username||'—') + '</span></div>' +
      '<div class="cell"><b>🆔 TG ID</b><span>' + esc(p.user_telegram_id||'—') + '</span></div>' +
      '<div class="cell"><b>💳 Эра</b><span>' + esc(p.era_title||'—') + '</span></div>' +
      '<div class="cell"><b>💵 Номинал</b><span class="accent">' + fmt(p.purchase_price) + '</span></div>' +
      '<div class="cell"><b>💰 Начисл.</b><span class="ok">+' + fmt(p.profit_amount) + '</span></div>' +
      '<div class="cell"><b>🏆 Итого</b><span class="ok">' + fmt(p.total_amount) + '</span></div>' +
      '<div class="cell"><b>📅 Срок</b><span>' + Number(p.duration_days||p.days||0) + ' дн.</span></div>' +
    '</div>' +
    (referrer ? '<div class="ref"><div class="lbl">🎁 Пригласил</div>' +
      '<div class="ri"><div><b>' + esc(userName(referrer)) + '</b> · ' + userLink(referrer) + '</div></div></div>'
      : '<div class="ref" style="border-left-color:var(--muted)"><div class="lbl">🎁 Пригласил</div>' +
      '<div class="ri"><span class="muted">Прямая регистрация</span></div>' +
      '<div style="margin-top:8px"><button class="btn purple sm" onclick="openRefSetup(\'' + esc(p.user_telegram_id) + '\')">🔗 Привязать реферера</button></div></div>') +
    dateBlock + refBlock +
    '<div class="muted" style="margin:12px 0">🕐 Создано: ' + fmtDate(p.created_at) + '</div>' +
    '<div class="flex">' +
      (canConfirm ? '<button class="btn ok" onclick="admConfirm(\'' + esc(k) + '\')">✅ Подтвердить</button>' : '') +
      (canCancel ? '<button class="btn danger" onclick="admCancel(\'' + esc(k) + '\')">❌ Отменить</button>' : '') +
      (isActive ? '<button class="btn warn" onclick="openEarlyClose(\'' + esc(k) + '\')">🔌 Отключить</button>' : '') +
      '<button class="btn ghost" onclick="admContact(\'' + esc(p.user_telegram_id||'') + '\')">💬</button>' +
      (buyer ? '<button class="btn purple" onclick="openUserCard(\'' + esc(p.user_telegram_id) + '\')">👤</button>' : '') +
      '<button class="btn danger" onclick="openDeletePurchase(\'' + esc(k) + '\')">🗑</button>' +
    '</div></div>';
}

async function admConfirm(k){
  if (!confirm('Подтвердить заявку?')) return;
  await once('confirm_' + k, async function(){
    var p = DATA.purchases.filter(function(x){ return x._key === k; })[0];
    if (!p) return;
    var now = new Date();
    var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    d0.setDate(d0.getDate() + 1);
    var days = Number(p.duration_days || p.days || 20);
    var last = new Date(d0); last.setDate(d0.getDate() + days - 1);
    var exp = new Date(d0); exp.setDate(d0.getDate() + days);

    var patch = {
      status: 'approved', approved_at: now.toISOString(),
      start_date: d0.toISOString(), last_day: last.toISOString(),
      expires_at: exp.toISOString(), status_changed_at: now.toISOString(),
      notified_3d: 0, notified_1d: 0, notified_3h: 0, completed_notified: 0
    };

    if (p.referrer_uid){
      var refUid = String(p.referrer_uid);
      var refBonus = Number(p.referral_bonus || 0)
        || Math.round(Number(p.purchase_price || 0) * REF_PERCENT / 100);
      var refHasActive = DATA.purchases.some(function(x){
        return String(x.user_telegram_id) === refUid
          && x.status === 'approved' && x.expires_at
          && new Date(x.expires_at).getTime() > Date.now();
      });
      if (refHasActive){
        patch.referral_status = 'approved';
        patch.referral_activated_at = now.toISOString();
      } else {
        patch.referral_status = 'pending_active';
        patch.referral_pending_reason = 'У реферера нет активной эры';
      }
      if (!p.referral_bonus) patch.referral_bonus = refBonus;
    }

    var buyerUid = String(p.user_telegram_id);
    var pendingToActivate = DATA.purchases.filter(function(x){
      return String(x.user_telegram_id) !== buyerUid
        && x.referral_status === 'pending_active'
        && String(x.referrer_uid) === buyerUid
        && x.status === 'approved';
    });

    await fbPatch('purchases/' + k, patch);
    for (var i = 0; i < pendingToActivate.length; i++){
      await fbPatch('purchases/' + pendingToActivate[i]._key, {
        referral_status: 'approved',
        referral_activated_at: now.toISOString()
      });
    }

    pushLog('✅ Подтвердил заявку', '#' + p.id);
    toast('✅ Подтверждено', 'ok');
    await renderPurchases();
  });
}

async function admForceActivate(refUid){
  if (!confirm('Разморозить ВСЕ отложенные бонусы?\n\nUID: ' + refUid)) return;
  await once('force_act_' + refUid, async function(){
    var now = new Date().toISOString();
    var pendingList = DATA.purchases.filter(function(x){
      return String(x.referrer_uid) === String(refUid)
        && x.referral_status === 'pending_active'
        && x.status === 'approved';
    });
    if (!pendingList.length) return toast('Нет замороженных', 'info');
    var total = 0;
    for (var i = 0; i < pendingList.length; i++){
      var bonus = Number(pendingList[i].referral_bonus || 0)
        || Math.round(Number(pendingList[i].purchase_price || 0) * REF_PERCENT / 100);
      await fbPatch('purchases/' + pendingList[i]._key, {
        referral_status: 'approved',
        referral_activated_at: now,
        referral_activated_by: 'admin_manual'
      });
      total += bonus;
    }
    pushLog('❄️→✅ Разморозил', 'UID ' + refUid + ' · ' + Math.round(total) + ' ₽');
    toast('✅ Разморожено ' + Math.round(total) + ' ₽', 'ok', 5000);
    if (TAB === 'users') await renderUsers();
    else if (TAB === 'refs') await renderRefs();
    else if (TAB === 'purchases') await renderPurchases();
  });
}

  }
  await once('del_purchase_' + key, async function(){
    var p = DATA.purchases.filter(function(x){ return x._key === key; })[0];
    if (!p) return;

    var payouts = await fbGet('payouts').then(toList).catch(function(){ return []; });
    var relatedPayouts = payouts.filter(function(po){

    toast('✅ Заявка #' + p.id + ' удалена', 'ok');
    closeModal();
    await renderPurchases();

var payoutFilter = 'pending';
var payoutSearch = '';
function filterPayouts(){
  var q = payoutSearch.toLowerCase().trim();
  if (!q) return DATA.payouts;
  return DATA.payouts.filter(function(po){
    var u = findUser(DATA.users, po.user_telegram_id);
    return (u && userMatches(u, q)) ||
      String(po.user_first_name||'').toLowerCase().indexOf(q) >= 0 ||
      String(po.user_username||'').toLowerCase().indexOf(q) >= 0 ||
      String(po.user_telegram_id||'').indexOf(q) >= 0 ||
      String(po.era_title||'').toLowerCase().indexOf(q) >= 0 ||
      String(po.purchase_id||'').indexOf(q) >= 0 ||
      String(po.id||'').indexOf(q) >= 0;
  });
}
function drawPayoutList(){
  var box = $('payoutListBox');
  if (!box) return;
  var filtered = filterPayouts();
  var counts = {
    pending: filtered.filter(function(p){ return p.status === 'pending'; }).length,
    paid: filtered.filter(function(p){ return p.status === 'paid'; }).length,
    rejected: filtered.filter(function(p){ return p.status === 'rejected'; }).length,
    all: filtered.length
  };
  var tabs = document.querySelectorAll('#payoutTabs .tab');
  if (tabs.length === 4){
    tabs[0].innerHTML = '⏳ Ожидают (' + counts.pending + ')';
    tabs[1].innerHTML = '✅ Выплачено (' + counts.paid + ')';
    tabs[2].innerHTML = '❌ Отклонено (' + counts.rejected + ')';
    tabs[3].innerHTML = '📋 Все (' + counts.all + ')';
  }
  var shown = payoutFilter === 'all' ? filtered
    : filtered.filter(function(p){ return p.status === payoutFilter; });
  box.innerHTML = shown.length ? shown.map(payoutCard).join('')
    : '<div class="empty"><div class="ic">📭</div><p>' +
      (payoutSearch ? 'Ничего не найдено' : 'Нет заявок') + '</p></div>';
}
async function renderPayouts(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    var res = await Promise.all([
      fbGet('payouts').then(toList).catch(function(){ return []; }),
      fbGet('users').then(toList).catch(function(){ return []; })
    ]);
    DATA.payouts = res[0]; DATA.users = res[1];
    DATA.payouts.sort(function(a,b){ return Number(b.id||0) - Number(a.id||0); });
    layout(
      '<div class="search">' +
        '<input class="input" id="payoutSearchInput" placeholder="Поиск: имя, @ник, ID, эра, номер…" ' +
          'value="' + esc(payoutSearch) + '" oninput="onPayoutSearchInput()">' +
      '</div>' +
      '<div class="tabs" id="payoutTabs">' +
        '<button class="tab ' + (payoutFilter==='pending'?'active':'') + '" onclick="setPayoutFilter(\'pending\')">⏳ Ожидают</button>' +
        '<button class="tab ' + (payoutFilter==='paid'?'active':'') + '" onclick="setPayoutFilter(\'paid\')">✅ Выплачено</button>' +
        '<button class="tab ' + (payoutFilter==='rejected'?'active':'') + '" onclick="setPayoutFilter(\'rejected\')">❌ Отклонено</button>' +
        '<button class="tab ' + (payoutFilter==='all'?'active':'') + '" onclick="setPayoutFilter(\'all\')">📋 Все</button>' +
      '</div>' +
      '<div id="payoutListBox"></div>'
    );
    drawPayoutList();
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}
window.setPayoutFilter = function(f){
  payoutFilter = f;
  var tabs = document.querySelectorAll('#payoutTabs .tab');
  var map = ['pending','paid','rejected','all'];
  tabs.forEach(function(t, i){ t.classList.toggle('active', map[i] === f); });
  drawPayoutList();
};
var _payoutSearchTimer = null;
window.onPayoutSearchInput = function(){
  var el = $('payoutSearchInput');
  if (!el) return;
  payoutSearch = el.value;
  clearTimeout(_payoutSearchTimer);
  _payoutSearchTimer = setTimeout(function(){ drawPayoutList(); }, 250);
};

      '<div class="cell"><b>💳 Эра</b><span>' + esc(po.era_title||'—') + '</span></div>' +
    '</div>' +
    renderReqBlock(req, { copyLabel: 'карту' }) +

      (po.paid_at ? ' · ✅ ' + fmtDate(po.paid_at) : '') + '</div>' +

      (isPending ? '<button class="btn ok" onclick="admPaid(\'' + esc(k) + '\')">✅ Выплачено</button>' : '') +
      (isPending ? '<button class="btn danger" onclick="admPayoutReject(\'' + esc(k) + '\')">❌ Отклонить</button>' : '') +

      '<button class="btn purple" onclick="openUserCard(\'' + esc(po.user_telegram_id) + '\')">👤</button>' +

async function admPaid(k){
  if (!confirm('Отметить выплату?')) return;
  await once('paid_' + k, async function(){
    var po = DATA.payouts.filter(function(x){ return x._key === k; })[0];

var refPayoutFilter = 'pending';
var refPayoutSearch = '';
function filterRefPayouts(){
  var q = refPayoutSearch.toLowerCase().trim();
  if (!q) return DATA.refPayouts;
  return DATA.refPayouts.filter(function(r){
    var u = findUser(DATA.users, r.user_telegram_id);
    return (u && userMatches(u, q)) ||
      String(r.user_first_name||'').toLowerCase().indexOf(q) >= 0 ||
      String(r.user_username||'').toLowerCase().indexOf(q) >= 0 ||
      String(r.user_telegram_id||'').indexOf(q) >= 0 ||
      String(r.id||'').indexOf(q) >= 0;
  });
}
function drawRefPayoutList(){
  var box = $('refPayoutListBox');
  if (!box) return;
  var filtered = filterRefPayouts();
  var counts = {
    pending: filtered.filter(function(r){ return r.status === 'pending'; }).length,
    paid: filtered.filter(function(r){ return r.status === 'paid'; }).length,
    rejected: filtered.filter(function(r){ return r.status === 'rejected'; }).length,
    all: filtered.length
  };
  var tabs = document.querySelectorAll('#refPayoutTabs .tab');
  if (tabs.length === 4){
    tabs[0].innerHTML = '⏳ Ждут (' + counts.pending + ')';
    tabs[1].innerHTML = '✅ Выплачено (' + counts.paid + ')';
    tabs[2].innerHTML = '❌ Отклонено (' + counts.rejected + ')';
    tabs[3].innerHTML = '📋 Все (' + counts.all + ')';
  }
  var shown = refPayoutFilter === 'all' ? filtered
    : filtered.filter(function(r){ return r.status === refPayoutFilter; });
  box.innerHTML = shown.length ? shown.map(refRequestCard).join('')
    : '<div class="empty"><div class="ic">💰</div><p>' +
      (refPayoutSearch ? 'Ничего не найдено' : 'Нет заявок') + '</p></div>';
}
async function renderRefPayouts(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    var res = await Promise.all([
      fbGet('ref_payout_requests').then(toList).catch(function(){ return []; }),
      fbGet('users').then(toList).catch(function(){ return []; }),
      fbGet('purchases').then(toList).catch(function(){ return []; })
    ]);
    DATA.refPayouts = res[0]; DATA.users = res[1]; DATA.purchases = res[2];
    DATA.refPayouts.sort(function(a,b){ return Number(b.id||0) - Number(a.id||0); });
    layout(
      '<h2 style="font-size:17px;margin-bottom:14px">💰 Заявки на вывод реф. бонусов</h2>' +
      '<div class="search">' +
        '<input class="input" id="refPayoutSearchInput" placeholder="Поиск: имя, @ник, ID, номер…" ' +
          'value="' + esc(refPayoutSearch) + '" oninput="onRefPayoutSearchInput()">' +
      '</div>' +
      '<div class="tabs" id="refPayoutTabs">' +
        '<button class="tab ' + (refPayoutFilter==='pending'?'active':'') + '" onclick="setRefPayoutFilter(\'pending\')">⏳ Ждут</button>' +
        '<button class="tab ' + (refPayoutFilter==='paid'?'active':'') + '" onclick="setRefPayoutFilter(\'paid\')">✅ Выплачено</button>' +
        '<button class="tab ' + (refPayoutFilter==='rejected'?'active':'') + '" onclick="setRefPayoutFilter(\'rejected\')">❌ Отклонено</button>' +
        '<button class="tab ' + (refPayoutFilter==='all'?'active':'') + '" onclick="setRefPayoutFilter(\'all\')">📋 Все</button>' +
      '</div>' +
      '<div id="refPayoutListBox"></div>'
    );
    drawRefPayoutList();
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}
window.setRefPayoutFilter = function(f){
  refPayoutFilter = f;
  var tabs = document.querySelectorAll('#refPayoutTabs .tab');

  tabs.forEach(function(t, i){ t.classList.toggle('active', map[i] === f); });

function refRequestCard(r){
  var k = r._key;
  var u = findUser(DATA.users, r.user_telegram_id);
  var isPending = r.status === 'pending';
  var bal = calcUserRefBalance(r.user_telegram_id);
  var req = r.requisites || {};
  if (!req.fio || !req.card || !req.bank){
    if (u && u.requisites) req = u.requisites;
  }

  return '<div class="card">' +
    '<div class="row" style="margin-bottom:12px">' +
      '<b style="color:#4f8cff;font-size:16px">💰 Заявка #' + esc(r.id) + '</b>' +

      '<div class="cell"><b>👤</b><span>' + esc(r.user_first_name || (u && userName(u)) || '—') + '</span></div>' +

    '</div>' +
    renderReqBlock(req, { copyLabel: 'карту' }) +
    '<div class="muted" style="margin:12px 0">🕐 ' + fmtDate(r.requested_at) + '</div>' +
    '<div class="flex">' +
      (isPending ? '<button class="btn ok" onclick="refPayoutPaid(\'' + esc(k) + '\')">✅ Выплачено</button>' : '') +
      (isPending ? '<button class="btn danger" onclick="refPayoutReject(\'' + esc(k) + '\')">❌ Отклонить</button>' : '') +
      '<button class="btn ghost" onclick="admContact(\'' + esc(r.user_telegram_id) + '\')">💬</button>' +
      '<button class="btn purple" onclick="openUserCard(\'' + esc(r.user_telegram_id) + '\')">👤</button>' +
    '</div></div>';
}
async function refPayoutPaid(key){
  if (!confirm('Подтвердить выплату?')) return;
  await once('refpaid_' + key, async function(){
    var r = DATA.refPayouts.filter(function(x){ return x._key === key; })[0];
    if (!r) return;
    var amount = Number(r.amount || 0);
    var uid = String(r.user_telegram_id);
    var now = new Date().toISOString();

    for (var i=0; i<DATA.purchases.length; i++){
      var p = DATA.purchases[i];
      if (String(p.referral_request_id||'') !== String(r.id)) continue;
      if ((p.referral_status||'') !== 'frozen') continue;
      var fz = Number(p.referral_frozen_amount || 0) || Number(p.referral_bonus || 0);
      await fbPatch('purchases/' + p._key, {
        referral_status: 'paid', referral_paid_at: now,
        referral_paid_amount: fz, referral_frozen_amount: 0,
        referral_frozen_at: null, referral_request_id: null
      });
    }
    await fbPatch('ref_payout_requests/' + key, {
      status: 'paid', paid_at: now, status_changed_at: now
    });
    await fbPost('ref_payouts_log', {
      user_telegram_id: uid, amount: amount, request_id: r.id,
      paid_at: now, paid_by: ADMIN_IDS[0]
    });
    pushLog('💸 Реф. выплата', '#' + r.id + ' · ' + fmt(amount));
    toast('✅ Выплачено ' + fmt(amount), 'ok');
    await renderRefPayouts();
  });
}
async function refPayoutReject(key){
  if (!confirm('Отклонить заявку?')) return;
  await once('refrej_' + key, async function(){
    var r = DATA.refPayouts.filter(function(x){ return x._key === key; })[0];
    var now = new Date().toISOString();
    for (var i=0; i<DATA.purchases.length; i++){
      var p = DATA.purchases[i];
      if (String(p.referral_request_id||'') !== String(r.id)) continue;
      if ((p.referral_status||'') !== 'frozen') continue;
      await fbPatch('purchases/' + p._key, {
        referral_status: 'approved', referral_frozen_amount: 0,
        referral_frozen_at: null, referral_request_id: null
      });
    }
    await fbPatch('ref_payout_requests/' + key, {
      status: 'rejected', status_changed_at: now
    });
    pushLog('❌ Отклонил реф. заявку', '#' + r.id);
    toast('❌ Отклонено');
    await renderRefPayouts();
  });
}

  if (passEl.value !== ADMIN_PASSWORD){
    toast('❌ Неверный пароль', 'err');
    passEl.value = ''; passEl.focus();
    return;
  }
  await once('block_' + uid, async function(){
    var reason = (reasonEl && reasonEl.value.trim()) || '';
    var now = new Date().toISOString();
    var patch = {};
    if (block){
      patch.blocked = 1;
      patch.blocked_at = now;
      patch.blocked_by = ADMIN_IDS[0];
      patch.block_reason = reason || 'Нарушение правил';
    } else {
      patch.blocked = 0;
      patch.unblocked_at = now;
      patch.unblocked_by = ADMIN_IDS[0];
      patch.block_reason = null;
    }
    await fbPatch('users/' + uid, patch);
    pushLog(block ? '🚫 Заблокировал' : '🔓 Разблокировал', 'ID ' + uid);
    toast(block ? '🚫 Заблокирован' : '🔓 Разблокирован', 'ok');
    closeModal();
    await renderUsers();
  });
}

    if (['completed','paid'].indexOf(p.status) >= 0) earned += Number(p.total_amount||0);
    if (p.status === 'approved') activeCount++;

      var remainHtml = '';

      return '<div class="purchase-item ' + statusCls + '">' +

          '<div class="pi-metric"><b>Итого</b><span class="ok">' + fmt(p.total_amount) + '</span></div>' +
        '</div>' +
        '<div class="pi-dates">' + datesHtml + '</div>' +

  } else {

        '<div class="muted" style="font-size:12px">🛒 ' + rPurch + ' · ' + fmtDate(r.registered_at) + '</div>' +
      '</div>';
    }).join('');

                '<div class="uh-sub">@' + esc(u.username||'—') + ' · ID ' + esc(u.telegram_id) + '</div>' +
                '<div class="uh-sub" style="font-size:11px;margin-top:2px">📅 ' + fmtDate(u.registered_at) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="flex">' +
              (isBlocked ? '<span class="badge blocked">🚫 Заблокирован</span>' : '<span class="badge approved">✅ Активен</span>') +

                '<div class="cell"><b>Получено</b><span class="ok">' + fmt(earned) + '</span></div>' +

async function loadErasFresh(){
  var raw = await fbGet('eras');

    .map(function(e){
      e.price = Number(e.price) || 0;
      e.profit_amount = Number(e.profit_amount) || 0;
      e.total_amount = Number(e.total_amount) || (e.price + e.profit_amount);
      e.duration_days = Number(e.duration_days) || 0;
      e.id = Number(e.id) || Number(e._key) || 0;
      e.sort_order = Number(e.sort_order) || e.id;
      e.is_active = (e.is_active === 0 || e.is_active === false) ? 0 : 1;

    .sort(function(a,b){

      '<button class="btn" id="f_save" onclick="saveEra(' + (isEdit ? e.id : 0) + ')">' +
        (isEdit ? '💾 Сохранить' : '✅ Создать') + '</button></div></div></div>';
}

function createEra(){ $('modal-root').innerHTML = eraForm(null); }
function editEra(id){
  var e = DATA.eras.filter(function(x){ return String(x.id) === String(id); })[0];
  if (!e) return toast('Эра не найдена', 'err');
  $('modal-root').innerHTML = eraForm(e);
}

async function saveEra(id){
  await once('save_era_' + id, async function(){
    var title = $('f_title').value.trim();
    if (!title){ toast('Введите название', 'err'); return; }
    var price = Number($('f_price').value) || 0;
    var profit = Number($('f_profit').value) || 0;
    var days = Number($('f_days').value) || 20;
    var desc = $('f_desc').value.trim();
    var active = Number($('f_active').value);
    var btn = $('f_save'); btn.disabled = true; btn.textContent = '⏳...';

    var data = {
      title: title, price: price, profit_amount: profit,
      total_amount: price + profit, duration_days: days,
      description: desc, is_active: active
    };

    try {
      if (id && id > 0){
        var existing = DATA.eras.filter(function(x){ return String(x.id) === String(id); })[0];
        if (!existing) throw new Error('Эра #' + id + ' не найдена');
        data.id = id;
        data.sort_order = existing.sort_order || id;
        await fbPut('eras/' + id, data);
        if (String(existing._key) !== String(id)){
          await fbDelete('eras/' + existing._key);
        }
        pushLog('✏️ Изменил эру', '#' + id);
      } else {
        var usedIds = DATA.eras.map(function(x){ return Number(x.id||0); }).filter(Boolean);
        var newId = usedIds.length ? Math.max.apply(null, usedIds) + 1 : 1;
        data.id = newId;
        data.sort_order = newId;
        await fbPut('eras/' + newId, data);
        pushLog('➕ Создал эру', '#' + newId);
      }
      closeModal();
      toast('💾 Сохранено', 'ok');
      await renderEras();
    } catch(err){
      toast('❌ ' + err.message, 'err');
      btn.disabled = false;
      btn.textContent = id ? '💾 Сохранить' : '✅ Создать';
    }
  });
}

async function toggleEra(id, active){
  await once('toggle_' + id, async function(){
    var e = DATA.eras.filter(function(x){ return String(x.id) === String(id); })[0];
    if (!e) return toast('Эра не найдена', 'err');
    await fbPatch('eras/' + (e.id || e._key), { is_active: active });
    toast(active ? '🟢 Включено' : '⚫ Отключено', 'ok');
    await renderEras();
  });
}

async function deleteEra(id){
  var e = DATA.eras.filter(function(x){ return String(x.id) === String(id); })[0];
  if (!e) return toast('Эра не найдена', 'err');
  if (!confirm('Удалить эру #' + id + ' «' + (e.title||'') + '»?')) return;

  await once('del_' + id, async function(){
    await fbDelete('eras/' + id);
    if (String(e._key) !== String(id)) await fbDelete('eras/' + e._key);
    pushLog('🗑 Удалил эру', '#' + id);
    toast('🗑 Удалено', 'ok');
    await renderEras();
  });
}

        desc: 'Первая ступень роста. Идеальный вход для знакомства с проектом РОСТЭРА.' },
      { title: 'Эра 2 — Разгон', price: 2500, profit: 2000, days: 22,

      { title: 'Эра 3 — Рост', price: 4500, profit: 3000, days: 24,
        desc: 'Сбалансированная эра для стабильного прироста капитала.' },
      { title: 'Эра 4 — Импульс', price: 7500, profit: 5500, days: 26,
        desc: 'Ускоренный рост. Для тех, кто ценит время.' },
      { title: 'Эра 5 — Прорыв', price: 13000, profit: 8000, days: 28,
        desc: 'Серьёзный шаг вперёд.' },
      { title: 'Эра 6 — Мастер', price: 21000, profit: 18000, days: 28,
        desc: 'Эра для опытных участников.' },
      { title: 'Эра 7 — Легенда', price: 39000, profit: 34000, days: 28,
        desc: 'Финальная ступень. Для тех, кто мыслит масштабно.' },
      { title: 'Эра 8 — РОСТЭРА Premium', price: 50000, profit: 45000, days: 30,
        desc: 'Премиум-эра для лидеров.' }
    ];
    var maxId = 0;
    DATA.eras.forEach(function(e){ if (Number(e.id) > maxId) maxId = Number(e.id); });
    var created = 0;
    for (var i = 0; i < seed.length; i++){
      var s = seed[i];
      var id = maxId + i + 1;
      await fbPut('eras/' + id, {
        id: id, sort_order: id, title: s.title,
        price: s.price, profit_amount: s.profit,
        total_amount: s.price + s.profit, duration_days: s.days,
        description: s.desc, is_active: 1
      });
      created++;
    }
    pushLog('📥 Загрузил 8 эр', 'ID ' + (maxId+1) + '…' + (maxId+8));
    toast('✅ Загружено ' + created + ' эр', 'ok', 4000);
    await renderEras();

}

async function fixEraKeys(){
  if (!confirm('Пересоздать все эры с правильными ключами?')) return;
  await once('fix_keys', async function(){
    var raw = await fbGet('eras');
    var list = toList(raw);
    var fixed = 0;
    for (var i = 0; i < list.length; i++){
      var e = list[i];
      var id = Number(e.id) || Number(e._key) || (i + 1);
      await fbPut('eras/' + id, {
        id: id, sort_order: Number(e.sort_order) || id,
        title: e.title || 'Эра ' + id,
        price: Number(e.price) || 0,
        profit_amount: Number(e.profit_amount) || 0,
        total_amount: Number(e.total_amount) || (Number(e.price||0) + Number(e.profit_amount||0)),
        duration_days: Number(e.duration_days) || 20,
        description: e.description || '',
        is_active: (e.is_active === 0 || e.is_active === false) ? 0 : 1
      });
      if (String(e._key) !== String(id)){
        await fbDelete('eras/' + e._key);
        fixed++;
      }
    }
    pushLog('🔧 Починил ключи', 'Исправлено: ' + fixed);
    toast('✅ Готово. Исправлено: ' + fixed, 'ok', 4000);
    await renderEras();
  });
}

/* ═══ КАТАЛОГ ═══ */
async function renderCatalog(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    await loadErasFresh();
    var active = DATA.eras.filter(function(e){ return e.is_active; });
    var sorted = active.slice().sort(function(a,b){
      return Number(a.price||0) - Number(b.price||0);
    });
    var rows = sorted.map(function(e){
      var price = Number(e.price || 0);
      var total = Number(e.total_amount || (price + Number(e.profit_amount||0)));
      var profit = Number(e.profit_amount || (total - price));
      var days = Number(e.duration_days || 0);
      var pct = price > 0 ? (profit / price * 100) : 0;
      return '<div class="catalog-row">' +
        '<div class="v-price">' + fmt(price) + '</div>' +
        '<div class="v-days">' + days + ' дн.</div>' +
        '<div class="v-total">' + fmt(total) + '</div>' +
        '<div class="v-profit">' + fmt(profit) + '</div>' +
        '<div><span class="v-pct">' + pct.toFixed(2).replace('.', ',') + '%</span></div>' +
      '</div>';
    }).join('');

    layout(
      '<div class="row" style="margin-bottom:14px">' +
        '<h2 style="font-size:17px">✨ Каталог эр (' + sorted.length + ')</h2>' +
        '<button class="btn sm ghost" onclick="renderCatalog()">🔄</button>' +
      '</div>' +
      '<div class="catalog-hero">' +
        '<div class="catalog-logo">' +
          '<div class="emblem">🌿</div>' +
          '<div class="title">РОСТЭРА</div>' +
          '<div class="sub">Новая эра твоего роста</div>' +
        '</div>' +
        '<div class="catalog-table">' +
          '<div class="catalog-row header">' +
            '<div>Эра</div><div>Продолжит.</div><div>Общая выплата</div>' +
            '<div>Ваша прибыль</div><div>Прибыль, %</div>' +
          '</div>' +
          (rows || '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted)">Нет активных эр</div>') +
        '</div>' +
        '<div class="catalog-slogan">✨ Новая эра твоего роста ✨</div>' +
      '</div>');
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}

/* ═══ РЕФЕРАЛЫ ═══ */
var refsSearch = '';
function filterInviters(){
  var refs = DATA.users.filter(function(u){ return u.referrer_uid; });
  var inviterIds = {}; refs.forEach(function(r){ inviterIds[String(r.referrer_uid)] = 1; });
  var inviters = DATA.users.filter(function(u){ return inviterIds[String(u.telegram_id)]; });
  var q = refsSearch.toLowerCase().trim();
  if (!q) return inviters;
  return inviters.filter(function(inv){
    if (userMatches(inv, q)) return true;
    var rl = DATA.users.filter(function(x){
      return String(x.referrer_uid || '') === String(inv.telegram_id);
    });
    return rl.some(function(r){ return userMatches(r, q); });
  });
}
function drawRefsList(){
  var box = $('refsListBox');
  if (!box) return;
  var refs = DATA.users.filter(function(u){ return u.referrer_uid; });
  var inviters = filterInviters();
  var stat = {};
  inviters.forEach(function(inv){
    stat[inv.telegram_id] = calcUserRefBalance(inv.telegram_id);
  });
  var totPend=0, totAppr=0, totFrozen=0, totPaid=0, totPendingActive=0;
  Object.keys(stat).forEach(function(k){
    totPend += stat[k].pending;
    totAppr += stat[k].owed;
    totFrozen += stat[k].frozen;
    totPaid += stat[k].paid;
    totPendingActive += stat[k].pendingActive;
  });
  var html =
    '<div class="stats" style="margin-bottom:16px">' +
      '<div class="stat"><div class="ic">🌳</div><div class="l">Рефералов</div><div class="v purple">' + refs.length + '</div></div>' +
      '<div class="stat"><div class="ic">🎁</div><div class="l">Пригласивших</div><div class="v ok">' + inviters.length + '</div></div>' +
      '<div class="stat"><div class="ic">⏳</div><div class="l">Ждёт подтв.</div><div class="v warn">' + fmt(totPend) + '</div></div>' +
      '<div class="stat"><div class="ic">❄️</div><div class="l">Заморожено</div><div class="v warn">' + fmt(totPendingActive) + '</div></div>' +
      '<div class="stat"><div class="ic">💎</div><div class="l">К выводу</div><div class="v accent">' + fmt(totAppr) + '</div></div>' +
      '<div class="stat"><div class="ic">🧊</div><div class="l">В заявках</div><div class="v warn">' + fmt(totFrozen) + '</div></div>' +
      '<div class="stat"><div class="ic">💸</div><div class="l">Выплачено</div><div class="v ok">' + fmt(totPaid) + '</div></div>' +
    '</div>';

  if (!inviters.length){
    html += '<div class="empty"><div class="ic">🌳</div><p>' +
      (refsSearch ? 'Ничего не найдено' : 'Пока нет рефералов') + '</p></div>';
  } else {
    var q = refsSearch.toLowerCase().trim();
    html += inviters.map(function(inv){
      var rl = DATA.users.filter(function(x){
        return String(x.referrer_uid || '') === String(inv.telegram_id);
      });
      if (q && !userMatches(inv, q)){
        rl = rl.filter(function(r){ return userMatches(r, q); });
      }
      var s = stat[inv.telegram_id] || {};
      return '<div class="card">' +
        '<div class="row" style="margin-bottom:12px">' +
          '<div style="cursor:pointer" onclick="openUserCard(\'' + esc(inv.telegram_id) + '\')">' +
            '<b style="color:var(--purple);font-size:15px">🎁 ' + esc(userName(inv)) + '</b>' +
            '<div class="muted">' + userLink(inv) + ' · ID ' + esc(inv.telegram_id) + '</div></div>' +
          '<div class="flex"><span class="badge purple">' + rl.length + ' реф.</span>' +
            (s.pendingActive > 0
              ? '<span class="badge pending_active">❄️ ' + fmt(s.pendingActive) + '</span>' : '') +
            '<span class="badge ' + (s.owed>0?'pending':'approved') + '">' +
              (s.owed>0 ? '💎 ' + fmt(s.owed) : '✅ 0 ₽') + '</span></div></div>' +
        '<div class="grid">' +
          '<div class="cell"><b>К выводу</b><span class="warn">' + fmt(s.owed) + '</span></div>' +
          '<div class="cell"><b>Начислено</b><span class="ok">' + fmt(s.accrued) + '</span></div>' +
          (s.pendingActive > 0
            ? '<div class="cell"><b>Заморожено</b><span style="color:var(--warn)">' + fmt(s.pendingActive) + '</span></div>' : '') +
          '<div class="cell"><b>В заявке</b><span class="warn">' + fmt(s.frozen) + '</span></div>' +
          '<div class="cell"><b>Выплачено</b><span class="accent">' + fmt(s.paid) + '</span></div>' +
        '</div>' +
        (s.pendingActive > 0
          ? '<button class="btn warn sm" style="margin:10px 0" onclick="admForceActivate(\'' + esc(inv.telegram_id) + '\')">🔓 Разморозить ' + fmt(s.pendingActive) + '</button>' : '') +
        (rl.map(function(r){
          return '<div class="ri" style="cursor:pointer" onclick="openUserCard(\'' + esc(r.telegram_id) + '\')">' +
            '<div><b>' + esc(userName(r)) + '</b> · ' + userLink(r) + '</div>' +
            '<div class="muted">' + fmtDate(r.registered_at) + '</div></div>';
        }).join('')) +
      '</div>';
    }).join('');
  }
  box.innerHTML = html;
}
async function renderRefs(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    var res = await Promise.all([
      fbGet('users').then(toList).catch(function(){ return []; }),
      fbGet('purchases').then(toList).catch(function(){ return []; })
    ]);
    DATA.users = res[0]; DATA.purchases = res[1];
    layout(
      '<h2 style="font-size:17px;margin-bottom:14px">🌳 Реферальная система</h2>' +
      '<div class="search">' +
        '<input class="input" id="refsSearchInput" placeholder="Поиск: имя реферера/реферала, @ник, ID…" ' +
          'value="' + esc(refsSearch) + '" oninput="onRefsSearchInput()">' +
      '</div>' +
      '<div id="refsListBox"></div>'
    );
    drawRefsList();
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p></div>');
  }
}
var _refsSearchTimer = null;
window.onRefsSearchInput = function(){
  var el = $('refsSearchInput');
  if (!el) return;
  refsSearch = el.value;
  clearTimeout(_refsSearchTimer);
  _refsSearchTimer = setTimeout(function(){ drawRefsList(); }, 250);
};

async function render(){
  if (!AUTH){ renderLogin(); return; }
  var tabs = {
    dashboard: renderDashboard,
    purchases: renderPurchases,
    payouts: renderPayouts,
    refPayouts: renderRefPayouts,
    users: renderUsers,
    eras: renderEras,
    catalog: renderCatalog,
    refs: renderRefs
  };
  try { await (tabs[TAB] || renderDashboard)(); }
  catch(e){
    $('app').innerHTML = '<div style="max-width:600px;margin:60px auto;padding:24px;background:#1c2330;' +
      'border:1px solid #ff5c5c;border-radius:12px;color:#e6edf3"><b style="color:#ff5c5c">Ошибка:</b> ' +
      esc(e.message) + '</div>';
  }
}
