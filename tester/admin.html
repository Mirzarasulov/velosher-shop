<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Era Admin</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c2330; --card3:#232b38;
    --border:#252e3a; --border2:#2f3a48;
    --text:#e6edf3; --text2:#c4ccd6; --muted:#8b949e;
    --accent:#4f8cff; --ok:#39d98a; --warn:#f5b547; --err:#ff5c5c; --info:#63a9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  button,input,textarea,select{font-family:inherit}
  .layout{display:flex;min-height:100vh}
  .side{width:210px;background:var(--card);border-right:1px solid var(--border);padding:16px 10px;
    flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{display:flex;align-items:center;gap:10px;padding:0 8px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
  .side .logo .ic{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
  .side .logo .t{font-weight:700;font-size:14px}
  .side .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--text2);
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:1px;font-weight:500}
  .side .nav-item:hover{background:var(--card2)}
  .side .nav-item.active{background:var(--accent);color:#fff}
  .side .nav-item .emo{font-size:15px;width:18px;text-align:center}
  .side .nav-item .count{margin-left:auto;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.14);font-size:10px;font-weight:700;min-width:18px;text-align:center}
  .side .section{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:12px 12px 4px}
  .main{flex:1;min-width:0;padding:20px 24px}
  .header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .header h1{font-size:22px;font-weight:700}
  .header .sub{font-size:12px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px}
  .stat .ic{font-size:22px;margin-bottom:6px}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;margin-bottom:3px}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.info{color:var(--info)} .stat .v.accent{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .btn{padding:8px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.secondary{background:var(--card2);border:1px solid var(--border2);color:var(--text)}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
  .btn.danger{background:var(--err)}
  .btn.ok{background:var(--ok);color:#04241a}
  .btn.warn{background:var(--warn);color:#2a1a00}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.5px;
    font-weight:700;text-transform:uppercase;white-space:nowrap}
  .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge.created{background:rgba(99,169,255,.15);color:var(--info)}
  .badge.in_progress{background:rgba(245,181,71,.15);color:var(--warn)}
  .badge.approved,.badge.completed,.badge.paid{background:rgba(57,217,138,.15);color:var(--ok)}
  .badge.cancelled,.badge.rejected{background:rgba(255,92,92,.15);color:var(--err)}
  .badge.pending{background:rgba(245,181,71,.15);color:var(--warn)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
  .cell{background:var(--card2);border-radius:8px;padding:8px 10px}
  .cell b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:2px;font-weight:600}
  .cell span{font-size:13px;font-weight:600;color:var(--text)}
  .cell span.ok{color:var(--ok)} .cell span.accent{color:var(--accent)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .form-row{margin-bottom:11px}
  .form-row label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;font-weight:600}
  .input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card2);
    color:var(--text);font-size:13px;outline:none}
  .input:focus{border-color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
  .tab{padding:7px 13px;border-radius:18px;background:var(--card2);border:1px solid var(--border);color:var(--text2);
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .toast{position:fixed;top:16px;right:16px;background:var(--card2);border:1px solid var(--border2);padding:12px 18px;
    border-radius:10px;z-index:9999;font-size:13px;font-weight:500;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .toast.err{border-color:#ff5c5c;color:#ffb3b3}
  .toast.ok{border-color:#39d98a;color:#a8f0cc}
  .login-box{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:24px}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .ic{font-size:44px;margin-bottom:10px;opacity:.5}
  .muted{color:var(--muted);font-size:12px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:560px;
    max-height:90vh;overflow-y:auto;padding:0}
  .modal-h{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-b{padding:18px}
  .modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .close-x{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);color:var(--text2);
    font-size:16px;cursor:pointer}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script>
const FIREBASE = 'https://velosher-f82b5-default-rtdb.asia-southeast1.firebasedatabase.app';
const ADMIN_PASSWORD = 'admin123';
const LOG_CHANNEL_URL = 'https://t.me/c/4305451466';

let AUTHED = sessionStorage.getItem('admin_auth') === '1';
let TAB = 'dashboard';
let DATA = { purchases: null, payouts: null, users: null, eras: null };
const $ = id => document.getElementById(id);

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try { return new Date(s).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
function statusLabel(s){
  return ({created:'Ожидает', in_progress:'В процессе', approved:'Активен',
    completed:'Завершён', paid:'Выплачен', cancelled:'Отменён',
    pending:'Ожидает', rejected:'Отклонён'})[s] || s;
}
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.add('hidden'), 2600);
}
function toList(raw){
  if (Array.isArray(raw)) return raw.filter(x => x && typeof x === 'object').map((v, i) => ({...v, _key: String(i)}));
  if (raw && typeof raw === 'object')
    return Object.entries(raw).filter(([, v]) => v && typeof v === 'object').map(([k, v]) => ({...v, _key: k}));
  return [];
}
async function fbGet(path){
  const r = await fetch(`${FIREBASE}/${path}.json`);
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
async function fbPut(path, data){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'PUT', body: JSON.stringify(data)});
  return r.ok;
}
async function fbPatch(path, data){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'PATCH', body: JSON.stringify(data)});
  return r.ok;
}
async function fbPost(path, data){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'POST', body: JSON.stringify(data)});
  return r.ok ? r.json() : null;
}
async function fbDelete(path){
  const r = await fetch(`${FIREBASE}/${path}.json`, {method:'DELETE'});
  return r.ok;
}

// LOGIN
function renderLogin(){
  $('app').innerHTML = `
    <div class="login-box">
      <h1 style="text-align:center;margin-bottom:20px">⚡ Era Admin</h1>
      <div class="form-row"><label>Пароль</label>
        <input class="input" id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn" style="width:100%;justify-content:center;padding:11px" onclick="doLogin()">Войти</button>
      <div class="muted" style="margin-top:12px;text-align:center;font-size:11px">
        Firebase: velosher-f82b5
      </div>
    </div>`;
}
function doLogin(){
  const pw = $('pw').value;
  if (pw === ADMIN_PASSWORD){
    AUTHED = true;
    sessionStorage.setItem('admin_auth', '1');
    render();
  } else toast('Неверный пароль', 'err');
}
window.doLogin = doLogin;

// LAYOUT
function layout(content){
  const c = {
    new: (DATA.purchases || []).filter(p => p.status === 'created').length,
    payouts: (DATA.payouts || []).filter(p => p.status === 'pending').length,
    users: (DATA.users || []).length,
    eras: (DATA.eras || []).length,
  };
  $('app').innerHTML = `
    <div class="layout">
      <aside class="side">
        <div class="logo"><div class="ic">⚡</div><div class="t">Era Admin</div></div>
        <div class="section">Обзор</div>
        <button class="nav-item ${TAB==='dashboard'?'active':''}" onclick="setTab('dashboard')">
          <span class="emo">📊</span>Дашборд</button>
        <div class="section">Операции</div>
        <button class="nav-item ${TAB==='purchases'?'active':''}" onclick="setTab('purchases')">
          <span class="emo">📩</span>Заявки ${c.new?`<span class="count">${c.new}</span>`:''}</button>
        <button class="nav-item ${TAB==='payouts'?'active':''}" onclick="setTab('payouts')">
          <span class="emo">💸</span>Выплаты ${c.payouts?`<span class="count">${c.payouts}</span>`:''}</button>
        <div class="section">Управление</div>
        <button class="nav-item ${TAB==='users'?'active':''}" onclick="setTab('users')">
          <span class="emo">👥</span>Пользователи ${c.users?`<span class="count">${c.users}</span>`:''}</button>
        <button class="nav-item ${TAB==='eras'?'active':''}" onclick="setTab('eras')">
          <span class="emo">🧩</span>Товары ${c.eras?`<span class="count">${c.eras}</span>`:''}</button>
        <button class="nav-item ${TAB==='refs'?'active':''}" onclick="setTab('refs')">
          <span class="emo">👥</span>Рефералы</button>
        <div class="section">Система</div>
        <button class="nav-item" onclick="window.open('${LOG_CHANNEL_URL}','_blank')">
          <span class="emo">📢</span>Канал</button>
        <button class="nav-item" onclick="logout()" style="color:var(--err)">
          <span class="emo">🚪</span>Выйти</button>
      </aside>
      <main class="main">
        <div class="header"><div><h1>⚡ Era Admin</h1><div class="sub">@VideoSaver12_Bot · velosher-f82b5</div></div></div>
        <div id="content">${content}</div>
      </main>
    </div>`;
}
function logout(){ sessionStorage.removeItem('admin_auth'); AUTHED = false; render(); }
window.logout = logout;
function setTab(t){ TAB = t; render(); }
window.setTab = setTab;

// DASHBOARD
async function renderDashboard(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const [purchases, payouts, users, eras] = await Promise.all([
      fbGet('purchases').then(toList).catch(() => []),
      fbGet('payouts').then(toList).catch(() => []),
      fbGet('users').then(toList).catch(() => []),
      fbGet('eras').then(toList).catch(() => []),
    ]);
    DATA.purchases = purchases; DATA.payouts = payouts; DATA.users = users; DATA.eras = eras;

    const active = purchases.filter(p => p.status === 'approved').length;
    const completed = purchases.filter(p => p.status === 'completed').length;
    const created = purchases.filter(p => p.status === 'created').length;
    const pendingPO = payouts.filter(p => p.status === 'pending').length;
    const totalPurch = purchases.filter(p => p.status !== 'cancelled')
      .reduce((s, p) => s + Number(p.purchase_price || 0), 0);
    const totalProfit = purchases.filter(p => ['approved','completed','paid'].includes(p.status))
      .reduce((s, p) => s + Number(p.profit_amount || 0), 0);
    const totalPaid = payouts.filter(p => p.status === 'paid')
      .reduce((s, p) => s + Number(p.amount || 0), 0);

    layout(`
      <div class="stats">
        <div class="stat"><div class="ic">👥</div><div class="l">Пользователей</div><div class="v">${users.length}</div></div>
        <div class="stat"><div class="ic">🟢</div><div class="l">Активных</div><div class="v ok">${active}</div></div>
        <div class="stat"><div class="ic">🏁</div><div class="l">Завершено</div><div class="v info">${completed}</div></div>
        <div class="stat"><div class="ic">⏳</div><div class="l">Новых заявок</div><div class="v warn">${created}</div></div>
        <div class="stat"><div class="ic">💸</div><div class="l">Выплат ждут</div><div class="v warn">${pendingPO}</div></div>
        <div class="stat"><div class="ic">💵</div><div class="l">Куплено</div><div class="v accent">${fmt(totalPurch)}</div></div>
        <div class="stat"><div class="ic">📈</div><div class="l">Начислено</div><div class="v ok">${fmt(totalProfit)}</div></div>
        <div class="stat"><div class="ic">💰</div><div class="l">Выплачено</div><div class="v">${fmt(totalPaid)}</div></div>
      </div>
      <button class="btn ghost" onclick="renderDashboard()">🔄 Обновить</button>
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderDashboard = renderDashboard;

// PURCHASES
let purchaseFilter = 'created';
async function renderPurchases(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const list = await fbGet('purchases').then(toList).catch(() => []);
    DATA.purchases = list;
    list.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));

    const counts = {
      created: list.filter(p => p.status === 'created').length,
      in_progress: list.filter(p => p.status === 'in_progress').length,
      approved: list.filter(p => p.status === 'approved').length,
      completed: list.filter(p => p.status === 'completed').length,
      all: list.length,
    };
    const filtered = purchaseFilter === 'all' ? list : list.filter(p => p.status === purchaseFilter);

    layout(`
      <div class="tabs">
        <button class="tab ${purchaseFilter==='created'?'active':''}" onclick="purchaseFilter='created';renderPurchases()">⏳ Ждут (${counts.created})</button>
        <button class="tab ${purchaseFilter==='in_progress'?'active':''}" onclick="purchaseFilter='in_progress';renderPurchases()">🟡 В работе (${counts.in_progress})</button>
        <button class="tab ${purchaseFilter==='approved'?'active':''}" onclick="purchaseFilter='approved';renderPurchases()">🟢 Активные (${counts.approved})</button>
        <button class="tab ${purchaseFilter==='completed'?'active':''}" onclick="purchaseFilter='completed';renderPurchases()">🏁 Завершено (${counts.completed})</button>
        <button class="tab ${purchaseFilter==='all'?'active':''}" onclick="purchaseFilter='all';renderPurchases()">📋 Все (${counts.all})</button>
      </div>
      ${filtered.length ? filtered.map(orderCard).join('') : '<div class="empty"><div class="ic">📭</div><p>Нет заявок</p></div>'}
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderPurchases = renderPurchases;

function orderCard(p){
  const isNew = p.status === 'created';
  const k = p._key;
  const canConfirm = ['created','in_progress'].includes(p.status);
  const canCancel = ['created','in_progress'].includes(p.status);
  return `
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <b style="color:#4f8cff;font-size:15px">📩 Заявка #${esc(p.id)}</b>
        <span class="badge ${esc(p.status)}">${esc(statusLabel(p.status))}</span>
      </div>
      <div class="grid">
        <div class="cell"><b>👤 Участник</b><span>${esc(p.user_first_name||'—')}</span></div>
        <div class="cell"><b>🔗 Никнейм</b><span>@${esc(p.user_username||'—')}</span></div>
        <div class="cell"><b>🆔 TG ID</b><span>${esc(p.user_telegram_id||'—')}</span></div>
        <div class="cell"><b>💳 Эра</b><span>${esc(p.era_title||'—')}</span></div>
        <div class="cell"><b>💵 Номинал</b><span class="accent">${fmt(p.purchase_price)}</span></div>
        <div class="cell"><b>💰 Начисл.</b><span class="ok">+${fmt(p.profit_amount)}</span></div>
        <div class="cell"><b>🏆 Итого</b><span class="ok">${fmt(p.total_amount)}</span></div>
        <div class="cell"><b>📅 Срок</b><span>${Number(p.duration_days||0)} дн.</span></div>
      </div>
      <div class="muted" style="margin-bottom:10px">
        🕐 ${fmtDate(p.created_at)}
        ${p.activated_at ? ' · ✅ ' + fmtDate(p.activated_at) : ''}
      </div>
      <div class="row">
        <div>
          ${canConfirm ? `<button class="btn ok sm" onclick="admConfirm('${esc(k)}')">✅ Подтвердить</button>` : ''}
          ${canCancel ? `<button class="btn danger sm" onclick="admCancel('${esc(k)}')">❌ Отменить</button>` : ''}
          <button class="btn ghost sm" onclick="admContact('${esc(p.user_telegram_id||'')}')">💬 Написать</button>
        </div>
      </div>
    </div>`;
}

async function admConfirm(k){
  if (!confirm('Подтвердить заявку? Это активирует эру.')) return;
  try {
    const p = DATA.purchases.find(x => x._key === k);
    const now = new Date();
    // Первый день = следующий день
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    d0.setDate(d0.getDate() + 1);
    const days = Number(p.duration_days || 20);
    const last = new Date(d0); last.setDate(d0.getDate() + days - 1);
    const exp = new Date(d0); exp.setDate(d0.getDate() + days);

    await fbPatch(`purchases/${k}`, {
      status: 'approved',
      activated_at: now.toISOString(),
      start_date: d0.toISOString(),
      last_day: last.toISOString(),
      expires_at: exp.toISOString(),
      status_changed_at: now.toISOString(),
      notified_1d: 0, notified_2d: 0, completed_notified: 0,
    });
    toast('✅ Заявка подтверждена', 'ok');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}
window.admConfirm = admConfirm;

async function admCancel(k){
  if (!confirm('Отменить заявку?')) return;
  try {
    await fbPatch(`purchases/${k}`, { status: 'cancelled', status_changed_at: new Date().toISOString() });
    toast('❌ Отменено');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}
window.admCancel = admCancel;

async function admContact(uid){
  if (!uid) return;
  try {
    const u = await fbGet(`users/${uid}`);
    if (!u) return toast('Не найден', 'err');
    const url = u.username ? `https://t.me/${u.username}` : `tg://user?id=${uid}`;
    window.open(url, '_blank');
  } catch(e){ toast(e.message, 'err'); }
}
window.admContact = admContact;

// PAYOUTS
async function renderPayouts(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const list = await fbGet('payouts').then(toList).catch(() => []);
    DATA.payouts = list;
    list.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));

    const pending = list.filter(p => p.status === 'pending');
    const paid = list.filter(p => p.status === 'paid');

    layout(`
      <div class="tabs">
        <button class="tab active">⏳ Ожидают (${pending.length})</button>
        <button class="tab">✅ Выплачено (${paid.length})</button>
      </div>
      ${pending.length ? pending.map(payoutCard).join('') : '<div class="empty"><div class="ic">📭</div><p>Нет заявок на вывод</p></div>'}
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderPayouts = renderPayouts;

function payoutCard(po){
  const k = po._key;
  return `
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <b style="color:#4f8cff;font-size:15px">💸 Выплата #${esc(po.id)}</b>
        <span class="badge ${esc(po.status)}">${esc(statusLabel(po.status))}</span>
      </div>
      <div class="grid">
        <div class="cell"><b>👤 Участник</b><span>${esc(po.user_first_name||'—')}</span></div>
        <div class="cell"><b>🔗 Никнейм</b><span>@${esc(po.user_username||'—')}</span></div>
        <div class="cell"><b>🆔 TG ID</b><span>${esc(po.user_telegram_id||'—')}</span></div>
        <div class="cell"><b>💳 Эра</b><span>${esc(po.era_title||'—')}</span></div>
        <div class="cell"><b>💰 Сумма</b><span class="ok">${fmt(po.amount)}</span></div>
        <div class="cell"><b>📄 Покупка</b><span>#${esc(po.purchase_id||'—')}</span></div>
      </div>
      <div class="muted" style="margin-bottom:10px">🕐 ${fmtDate(po.requested_at)}</div>
      <div class="row">
        <div>
          <button class="btn ok sm" onclick="admMarkPaid('${esc(k)}')">✅ Выплачено</button>
          <button class="btn ghost sm" onclick="admContact('${esc(po.user_telegram_id||'')}')">💬 Написать</button>
        </div>
      </div>
    </div>`;
}

async function admMarkPaid(k){
  if (!confirm('Отметить выплату как выполненную?')) return;
  try {
    const po = DATA.payouts.find(x => x._key === k);
    await fbPatch(`payouts/${k}`, { status: 'paid', paid_at: new Date().toISOString() });

    // Находим purchase по purchase_id и помечаем paid
    const purchases = DATA.purchases || [];
    const p = purchases.find(x => String(x.id) === String(po.purchase_id));
    if (p){
      await fbPatch(`purchases/${p._key}`, { status: 'paid', paid_at: new Date().toISOString() });
    }
    toast('💰 Выплата отмечена', 'ok');
    renderPayouts();
  } catch(e){ toast(e.message, 'err'); }
}
window.admMarkPaid = admMarkPaid;

// USERS
async function renderUsers(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const users = await fbGet('users').then(toList).catch(() => []);
    const purchases = await fbGet('purchases').then(toList).catch(() => []);
    DATA.users = users; DATA.purchases = purchases;
    users.sort((a, b) => new Date(b.registered_at || 0) - new Date(a.registered_at || 0));

    layout(`
      ${users.length ? users.map(u => {
        const myP = purchases.filter(p => String(p.user_telegram_id) === String(u.telegram_id));
        const invested = myP.filter(p => p.status !== 'cancelled').reduce((s, p) => s + Number(p.purchase_price || 0), 0);
        const earned = myP.filter(p => ['completed','paid'].includes(p.status)).reduce((s, p) => s + Number(p.total_amount || 0), 0);
        const refs = users.filter(x => String(x.referrer_uid || '') === String(u.telegram_id)).length;
        return `
          <div class="card">
            <div class="row" style="margin-bottom:10px">
              <div><b>${esc(u.first_name||'Пользователь')} ${esc(u.last_name||'')}</b>
                <div class="muted">@${esc(u.username||'—')} · ID ${esc(u.telegram_id)}</div></div>
              <span class="badge ${u.referrer_uid?'approved':'created'}">${u.referrer_uid?'реферал':'прямой'}</span>
            </div>
            <div class="grid">
              <div class="cell"><b>Вложено</b><span class="accent">${fmt(invested)}</span></div>
              <div class="cell"><b>Получено</b><span class="ok">${fmt(earned)}</span></div>
              <div class="cell"><b>Заявок</b><span>${myP.length}</span></div>
              <div class="cell"><b>Пригласил</b><span>${refs}</span></div>
            </div>
            <div class="row" style="margin-top:10px">
              <div class="muted">📅 ${fmtDate(u.registered_at)}</div>
              <button class="btn ghost sm" onclick="admContact('${esc(u.telegram_id||'')}')">💬 Написать</button>
            </div>
          </div>`;
      }).join('') : '<div class="empty"><div class="ic">👤</div><p>Нет пользователей</p></div>'}
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderUsers = renderUsers;

// ERAS
async function renderEras(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const eras = await fbGet('eras').then(toList).catch(() => []);
    DATA.eras = eras;
    eras.sort((a, b) => Number(a.sort_order || a.id || 0) - Number(b.sort_order || b.id || 0));

    layout(`
      <div class="row" style="margin-bottom:14px">
        <h2 style="font-size:16px">🧩 Товары (${eras.length})</h2>
        <button class="btn" onclick="createEra()">➕ Создать эру</button>
      </div>
      ${eras.map(eraCard).join('')}
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderEras = renderEras;

function eraCard(e){
  const roi = Number(e.price || 0) > 0 ? Math.round((Number(e.profit_amount) / Number(e.price)) * 100) : 0;
  return `
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div><b style="color:#4f8cff">🧩 ${esc(e.title||'Без названия')}</b>
          <div class="muted">ID #${esc(e.id||e._key)}</div></div>
        <span class="badge ${e.is_active?'approved':'cancelled'}">${e.is_active?'🟢 Активна':'⚫ Отключена'}</span>
      </div>
      <div class="grid">
        <div class="cell"><b>💵 Стоимость</b><span class="accent">${fmt(e.price)}</span></div>
        <div class="cell"><b>💰 Начисл.</b><span class="ok">+${fmt(e.profit_amount)}</span></div>
        <div class="cell"><b>🏆 Итого</b><span class="ok">${fmt(e.total_amount)}</span></div>
        <div class="cell"><b>📅 Срок</b><span>${Number(e.duration_days||0)} дн.</span></div>
        <div class="cell"><b>📈 ROI</b><span class="ok">+${roi}%</span></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div>
          <button class="btn sm" onclick="editEra('${esc(e._key)}')">✏️ Изменить</button>
          <button class="btn ${e.is_active?'warn':'ok'} sm" onclick="toggleEra('${esc(e._key)}',${e.is_active?0:1})">${e.is_active?'⚫ Отключить':'🟢 Включить'}</button>
          <button class="btn danger sm" onclick="deleteEra('${esc(e._key)}')">🗑 Удалить</button>
        </div>
      </div>
    </div>`;
}

function eraForm(e){
  return `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-h"><h2>${e?'✏️ Изменить':'➕ Создать'} эру</h2>
          <button class="close-x" onclick="closeModal()">✕</button></div>
        <div class="modal-b">
          <div class="form-row"><label>Название</label>
            <input class="input" id="f_title" value="${esc(e?.title||'Новая эра')}"></div>
          <div class="form-row"><label>Стоимость (₽)</label>
            <input class="input" id="f_price" type="number" value="${e?.price||1500}"></div>
          <div class="form-row"><label>Начисление (₽)</label>
            <input class="input" id="f_profit" type="number" value="${e?.profit_amount||1000}"></div>
          <div class="form-row"><label>Срок (дней)</label>
            <input class="input" id="f_days" type="number" value="${e?.duration_days||20}"></div>
          <div class="form-row"><label>Описание</label>
            <textarea class="input" id="f_desc" rows="2">${esc(e?.description||'')}</textarea></div>
          <div class="form-row"><label>Активна</label>
            <select class="input" id="f_active">
              <option value="1" ${(!e||e.is_active)?'selected':''}>Да</option>
              <option value="0" ${(e&&!e.is_active)?'selected':''}>Нет</option>
            </select></div>
        </div>
        <div class="modal-f">
          <button class="btn ghost" onclick="closeModal()">Отмена</button>
          <button class="btn" id="f_save" onclick="saveEra('${e?e._key:''}')">${e?'💾 Сохранить':'✅ Создать'}</button>
        </div>
      </div>
    </div>`;
}

function closeModal(){ $('modal-root').innerHTML = ''; }
window.closeModal = closeModal;

function createEra(){
  $('modal-root').innerHTML = eraForm(null);
}
window.createEra = createEra;

function editEra(key){
  const e = (DATA.eras || []).find(x => x._key === key);
  if (!e) return;
  $('modal-root').innerHTML = eraForm(e);
}
window.editEra = editEra;

async function saveEra(key){
  const title = $('f_title').value.trim();
  const price = Number($('f_price').value) || 0;
  const profit = Number($('f_profit').value) || 0;
  const days = Number($('f_days').value) || 20;
  const desc = $('f_desc').value.trim();
  const active = Number($('f_active').value);

  if (!title){ toast('Введите название', 'err'); return; }

  const btn = $('f_save');
  btn.disabled = true; btn.textContent = '⏳...';

  try {
    const data = {
      title, price, profit_amount: profit, total_amount: price + profit,
      duration_days: days, description: desc, is_active: active,
    };
    if (key){
      // Обновить
      const e = (DATA.eras || []).find(x => x._key === key);
      data.id = e?.id || key;
      data.sort_order = e?.sort_order || data.id;
      await fbPut(`eras/${key}`, data);
      toast('💾 Сохранено', 'ok');
    } else {
      // Создать с новым ID
      const eras = DATA.eras || [];
      const usedIds = eras.map(e => Number(e.id || 0)).filter(Boolean);
      const newId = usedIds.length ? Math.max(...usedIds) + 1 : 1;
      data.id = newId;
      data.sort_order = newId;
      await fbPut(`eras/${newId}`, data);
      toast(`✅ Эра #${newId} создана`, 'ok');
    }
    closeModal();
    renderEras();
  } catch(e){
    toast(e.message, 'err');
    btn.disabled = false;
    btn.textContent = key ? '💾 Сохранить' : '✅ Создать';
  }
}
window.saveEra = saveEra;

async function toggleEra(key, newActive){
  try {
    const e = (DATA.eras || []).find(x => x._key === key);
    if (!e) return;
    await fbPatch(`eras/${key}`, { is_active: newActive });
    toast(newActive ? '🟢 Включена' : '⚫ Отключена', 'ok');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}
window.toggleEra = toggleEra;

async function deleteEra(key){
  if (!confirm('Удалить эру? Существующие заказы не пострадают.')) return;
  try {
    await fbDelete(`eras/${key}`);
    toast('🗑 Удалено', 'ok');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}
window.deleteEra = deleteEra;

// REFS
async function renderRefs(){
  layout('<div class="empty">Загрузка…</div>');
  try {
    const users = await fbGet('users').then(toList).catch(() => []);
    DATA.users = users;
    const refs = users.filter(u => u.referrer_uid);
    const tree = {};
    refs.forEach(u => {
      const r = u.referrer_uid;
      if (!tree[r]) tree[r] = [];
      tree[r].push(u);
    });

    layout(`
      <h2 style="font-size:16px;margin-bottom:12px">👥 Реферальная система</h2>
      <div class="stats" style="margin-bottom:16px">
        <div class="stat"><div class="ic">👥</div><div class="l">Всего юзеров</div><div class="v">${users.length}</div></div>
        <div class="stat"><div class="ic">🎁</div><div class="l">С реферером</div><div class="v ok">${refs.length}</div></div>
        <div class="stat"><div class="ic">📊</div><div class="l">Пригласивших</div><div class="v accent">${Object.keys(tree).length}</div></div>
      </div>
      ${Object.keys(tree).length ? Object.entries(tree).map(([uid, list]) => {
        const inviter = users.find(u => String(u.telegram_id) === String(uid));
        return `
          <div class="card">
            <div class="row" style="margin-bottom:10px">
              <b>🎁 ${esc(inviter?.first_name || 'ID ' + uid)}</b>
              <span class="badge approved">${list.length} реферал(ов)</span>
            </div>
            ${list.map(r => `
              <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
                <div><b>${esc(r.first_name||'—')}</b>
                  <div class="muted">@${esc(r.username||'—')} · ID ${esc(r.telegram_id)}</div></div>
                <div class="muted">${fmtDate(r.registered_at)}</div>
              </div>
            `).join('')}
          </div>`;
      }).join('') : '<div class="empty"><div class="ic">👥</div><p>Пока нет рефералов</p></div>'}
    `);
  } catch(e){ layout(`<div class="empty"><div class="ic">⚠️</div><p>${esc(e.message)}</p></div>`); }
}
window.renderRefs = renderRefs;

// MAIN
async function render(){
  if (!AUTHED){ renderLogin(); return; }
  const tabs = {
    dashboard: renderDashboard,
    purchases: renderPurchases,
    payouts: renderPayouts,
    users: renderUsers,
    eras: renderEras,
    refs: renderRefs,
  };
  await (tabs[TAB] || renderDashboard)();
}

render();
</script>
</body>
</html>
