<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Era Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;padding:16px;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:20px;margin-bottom:4px}
h2{font-size:16px;margin:0 0 12px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 14px;background:#1c2330;border:1px solid #2a3240;border-radius:8px;
  color:#c4ccd6;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tab.active{background:#4f8cff;color:#fff;border-color:#4f8cff}
.btn{padding:8px 14px;background:#4f8cff;color:#fff;border:0;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:6px}
.btn:active{transform:scale(.97)}
.btn.gray{background:#1c2330;border:1px solid #2a3240;color:#e6edf3}
.btn.red{background:#ff5c5c}
.btn.green{background:#39d98a;color:#04241a}
.btn.sm{padding:6px 10px;font-size:12px}
.card{background:#161b22;border:1px solid #2a3240;border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.cell{background:#1c2330;border-radius:8px;padding:8px 10px}
.cell b{display:block;color:#8b949e;font-size:10px;text-transform:uppercase;margin-bottom:2px;font-weight:600}
.cell span{font-size:13px;font-weight:600;color:#e6edf3}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge.awaiting_payment{background:rgba(245,181,71,.15);color:#f5b547}
.badge.active{background:rgba(57,217,138,.15);color:#39d98a}
.badge.completed{background:rgba(99,169,255,.15);color:#63a9ff}
.badge.awaiting_payout{background:rgba(245,181,71,.15);color:#f5b547}
.badge.paid{background:rgba(57,217,138,.15);color:#39d98a}
.badge.cancelled{background:rgba(255,92,92,.15);color:#ff5c5c}
.badge.pending{background:rgba(245,181,71,.15);color:#f5b547}
.toast{position:fixed;top:14px;right:14px;background:#1c2330;border:1px solid #2a3240;
  padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;
  box-shadow:0 4px 12px rgba(0,0,0,.4)}
.toast.err{border-color:#ff5c5c;color:#ffb3b3}
.toast.ok{border-color:#39d98a;color:#a8f0cc}
.login-box{max-width:360px;margin:60px auto;background:#161b22;border:1px solid #2a3240;border-radius:12px;padding:24px}
input,select,textarea{width:100%;padding:10px 12px;background:#1c2330;border:1px solid #2a3240;
  border-radius:8px;color:#e6edf3;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
input:focus,select:focus,textarea:focus{border-color:#4f8cff}
.empty{text-align:center;padding:40px 20px;color:#8b949e}
.empty .ic{font-size:40px;margin-bottom:8px;opacity:.5}
.muted{color:#8b949e;font-size:12px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.stat{background:#161b22;border:1px solid #2a3240;border-radius:10px;padding:12px}
.stat .l{font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.stat .v{font-size:18px;font-weight:700}
.stat .v.ok{color:#39d98a}
.stat .v.warn{color:#f5b547}
.stat .v.accent{color:#4f8cff}
.hidden{display:none!important}
.loader{padding:40px;text-align:center;color:#8b949e}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
// ============================================================
// ⚠️ ЗАМЕНИТЕ API НА ВАШ NGROK URL!
// ============================================================
const API = localStorage.getItem('admin_api') || 'http://localhost:8000';
const LOG_CHANNEL_URL = 'https://t.me/c/4305451466';
// ============================================================

let TOKEN = localStorage.getItem('admin_token') || '';
let TAB = 'dashboard';
let DATA = { dashboard:null, purchases:null, payouts:null, users:null, eras:null };

const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n||0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(s){
  if (!s) return '—';
  try { return new Date(s).toLocaleString('ru-RU',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return s; }
}
function statusLabel(s){
  return ({awaiting_payment:'Ожидает оплаты',active:'Активен',
    completed:'Завершён',awaiting_payout:'Ожидает выплаты',
    paid:'Выплачен',cancelled:'Отменён'})[s] || s;
}
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast hidden', 2500);
}

async function api(path, opts){
  opts = opts || {};
  const headers = opts.headers || {};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  headers['ngrok-skip-browser-warning'] = 'true';
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  let res;
  try { res = await fetch(API + path, {...opts, headers}); }
  catch(e){ throw new Error('Сервер недоступен'); }
  if (res.status === 401){ logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || 'Ошибка');
  return data;
}

function logout(){
  localStorage.removeItem('admin_token'); TOKEN = ''; location.reload();
}

// LOGIN
function renderLogin(){
  $('app').innerHTML =
    '<div class="login-box"><h1 style="text-align:center;margin-bottom:20px">⚡ Era Admin</h1>' +
    '<input id="login" placeholder="Логин" value="admin">' +
    '<input id="password" type="password" placeholder="Пароль" onkeydown="if(event.key===\'Enter\')doLogin()">' +
    '<button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">Войти</button>' +
    '<div style="margin-top:14px"><div class="muted" style="margin-bottom:4px">API URL</div>' +
    '<input id="api_url" value="' + esc(API) + '" onchange="localStorage.setItem(\'admin_api\',this.value);toast(\'API сохранён\');"></div></div>';
}

async function doLogin(){
  const login = $('login').value;
  const password = $('password').value;
  const apiUrl = $('api_url').value.trim();
  if (apiUrl) localStorage.setItem('admin_api', apiUrl);
  try {
    const res = await api('/api/admin/login', {method:'POST', body:{login, password}});
    TOKEN = res.token;
    localStorage.setItem('admin_token', TOKEN);
    toast('Добро пожаловать');
    render();
  } catch(e){ toast(e.message, 'err'); }
}

// LAYOUT
function layout(content){
  const c = {
    purchases: (DATA.purchases || []).filter(p => p.status === 'awaiting_payment').length,
    payouts: (DATA.payouts || []).filter(p => p.status === 'pending').length,
    users: (DATA.users || []).length,
    eras: (DATA.eras || []).length
  };

  $('app').innerHTML =
    '<div class="header"><div><h1>⚡ Era Admin</h1><div class="muted">Панель управления</div></div>' +
    '<button class="btn gray sm" onclick="logout()">Выйти</button></div>' +

    '<div class="tabs">' +
      '<button class="tab ' + (TAB==='dashboard'?'active':'') + '" onclick="setTab(\'dashboard\')">📊 Дашборд</button>' +
      '<button class="tab ' + (TAB==='purchases'?'active':'') + '" onclick="setTab(\'purchases\')">📩 Заявки ' + (c.purchases?'('+c.purchases+')':'') + '</button>' +
      '<button class="tab ' + (TAB==='payouts'?'active':'') + '" onclick="setTab(\'payouts\')">💸 Выплаты ' + (c.payouts?'('+c.payouts+')':'') + '</button>' +
      '<button class="tab ' + (TAB==='users'?'active':'') + '" onclick="setTab(\'users\')">👥 Юзеры ' + (c.users?'('+c.users+')':'') + '</button>' +
      '<button class="tab ' + (TAB==='eras'?'active':'') + '" onclick="setTab(\'eras\')">🧩 Товары ' + (c.eras?'('+c.eras+')':'') + '</button>' +
      '<button class="tab" onclick="window.open(\'' + LOG_CHANNEL_URL + '\',\'_blank\')">📢 Канал</button>' +
    '</div>' +
    '<div id="content">' + content + '</div>';
}

async function setTab(t){
  TAB = t;
  await render();
}

// DASHBOARD
async function renderDashboard(){
  layout('<div class="loader">Загрузка…</div>');
  try {
    const d = await api('/api/admin/dashboard');
    DATA.dashboard = d;
    layout(
      '<div class="stat-row">' +
        '<div class="stat"><div class="l">Пользователей</div><div class="v">' + d.users + '</div></div>' +
        '<div class="stat"><div class="l">Активных</div><div class="v ok">' + d.active_eras + '</div></div>' +
        '<div class="stat"><div class="l">Завершено</div><div class="v accent">' + d.completed_eras + '</div></div>' +
        '<div class="stat"><div class="l">Заявок ждут</div><div class="v warn">' + d.purchase_requests + '</div></div>' +
        '<div class="stat"><div class="l">Выплат ждут</div><div class="v warn">' + d.payout_requests + '</div></div>' +
        '<div class="stat"><div class="l">Куплено</div><div class="v accent">' + fmt(d.total_purchases_sum) + '</div></div>' +
        '<div class="stat"><div class="l">Начислено</div><div class="v ok">' + fmt(d.total_profit_sum) + '</div></div>' +
        '<div class="stat"><div class="l">Выплачено</div><div class="v">' + fmt(d.total_paid_sum) + '</div></div>' +
      '</div>' +
      '<button class="btn gray" onclick="renderDashboard()">🔄 Обновить</button>'
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><h2>Ошибка</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="renderDashboard()">Повторить</button></div>');
  }
}

// PURCHASES
async function renderPurchases(){
  layout('<div class="loader">Загрузка…</div>');
  try {
    const list = await api('/api/admin/purchases');
    DATA.purchases = list;
    layout(
      '<h2>📩 Заявки (' + list.length + ')</h2>' +
      (list.length ? list.map(p => orderCard(p)).join('')
        : '<div class="empty"><div class="ic">📭</div><h3>Заявок нет</h3></div>')
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><h2>Ошибка</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="renderPurchases()">Повторить</button></div>');
  }
}

function orderCard(p){
  const isPending = p.status === 'awaiting_payment';
  return '<div class="card"><div class="row" style="margin-bottom:10px"><b style="color:#4f8cff;font-size:16px">📩 #' + p.id + '</b><span class="badge ' + p.status + '">' + statusLabel(p.status) + '</span></div>' +
    '<div class="grid">' +
      '<div class="cell"><b>Участник</b><span>' + esc(p.first_name||'') + ' ' + esc(p.last_name||'') + '</span></div>' +
      '<div class="cell"><b>Username</b><span>@' + esc(p.telegram_username||'—') + '</span></div>' +
      '<div class="cell"><b>TG ID</b><span>' + (p.telegram_id||'—') + '</span></div>' +
      '<div class="cell"><b>Эра</b><span>' + esc(p.era_title) + '</span></div>' +
      '<div class="cell"><b>Номинал</b><span style="color:#4f8cff">' + fmt(p.purchase_price) + '</span></div>' +
      '<div class="cell"><b>Начисл.</b><span style="color:#39d98a">+' + fmt(p.profit_amount) + '</span></div>' +
      '<div class="cell"><b>Итого</b><span style="color:#39d98a">' + fmt(p.total_amount) + '</span></div>' +
      '<div class="cell"><b>Срок</b><span>' + p.duration_days + ' дн.</span></div>' +
    '</div>' +
    '<div class="muted" style="margin-bottom:10px">🕐 ' + fmtDate(p.created_at) + (p.activated_at ? ' · ✅ ' + fmtDate(p.activated_at) : '') + (p.cancelled_at ? ' · ❌ ' + fmtDate(p.cancelled_at) : '') + '</div>' +
    '<div>' +
      (isPending ? '<button class="btn green sm" onclick="confirmPurchase(' + p.id + ')">✅ Подтвердить</button><button class="btn red sm" onclick="cancelPurchase(' + p.id + ')">❌ Отменить</button>' : '') +
      '<button class="btn gray sm" onclick="writeUser(\'' + esc(p.telegram_username||'') + '\', ' + (p.telegram_id||0) + ')">💬 Написать</button>' +
    '</div></div>';
}

async function confirmPurchase(id){
  if (!confirm('Подтвердить заявку #' + id + '?')) return;
  try {
    await api('/api/admin/purchases/' + id + '/confirm', {method:'POST'});
    toast('✅ Подтверждено');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}

async function cancelPurchase(id){
  if (!confirm('Отменить заявку #' + id + '?')) return;
  try {
    await api('/api/admin/purchases/' + id + '/cancel', {method:'POST'});
    toast('❌ Отменено');
    renderPurchases();
  } catch(e){ toast(e.message, 'err'); }
}

// PAYOUTS
async function renderPayouts(){
  layout('<div class="loader">Загрузка…</div>');
  try {
    const list = await api('/api/admin/payouts');
    DATA.payouts = list;
    layout(
      '<h2>💸 Выплаты (' + list.length + ')</h2>' +
      (list.length ? list.map(po => payoutCard(po)).join('')
        : '<div class="empty"><div class="ic">📭</div><h3>Заявок нет</h3></div>')
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><h2>Ошибка</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="renderPayouts()">Повторить</button></div>');
  }
}

function payoutCard(po){
  const isPending = po.status === 'pending';
  return '<div class="card"><div class="row" style="margin-bottom:10px"><b style="color:#4f8cff;font-size:16px">💸 #' + po.id + '</b><span class="badge ' + po.status + '">' + (isPending ? '⏳ Ожидает' : '✅ Выплачено') + '</span></div>' +
    '<div class="grid">' +
      '<div class="cell"><b>Участник</b><span>' + esc(po.first_name||'') + '</span></div>' +
      '<div class="cell"><b>Username</b><span>@' + esc(po.telegram_username||'—') + '</span></div>' +
      '<div class="cell"><b>Сумма</b><span style="color:#39d98a">' + fmt(po.amount) + '</span></div>' +
      '<div class="cell"><b>Покупка</b><span>#' + po.purchase_id + '</span></div>' +
    '</div>' +
    '<div class="muted" style="margin-bottom:10px">🕐 ' + fmtDate(po.requested_at) + (po.paid_at ? ' · 💰 ' + fmtDate(po.paid_at) : '') + '</div>' +
    '<div>' +
      (isPending ? '<button class="btn green sm" onclick="markPaid(' + po.id + ')">✅ Выплачено</button><button class="btn red sm" onclick="cancelPayout(' + po.id + ')">❌ Отменить</button>' : '') +
      '<button class="btn gray sm" onclick="writeUser(\'' + esc(po.telegram_username||'') + '\', ' + (po.telegram_id||0) + ')">💬 Написать</button>' +
    '</div></div>';
}

async function markPaid(id){
  if (!confirm('Отметить выплату #' + id + '?')) return;
  try {
    await api('/api/admin/payouts/' + id + '/mark_paid', {method:'POST'});
    toast('💰 Выплачено');
    renderPayouts();
  } catch(e){ toast(e.message, 'err'); }
}

async function cancelPayout(id){
  if (!confirm('Отменить заявку #' + id + '?')) return;
  try {
    await api('/api/admin/payouts/' + id + '/cancel', {method:'POST'});
    toast('Отменено');
    renderPayouts();
  } catch(e){ toast(e.message, 'err'); }
}

// USERS
async function renderUsers(){
  layout('<div class="loader">Загрузка…</div>');
  try {
    const users = await api('/api/admin/users');
    DATA.users = users;
    layout(
      '<h2>👥 Пользователи (' + users.length + ')</h2>' +
      (users.length ? users.map(userCard).join('')
        : '<div class="empty"><div class="ic">👤</div><h3>Пользователей нет</h3></div>')
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><h2>Ошибка</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="renderUsers()">Повторить</button></div>');
  }
}

function userCard(u){
  const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Без имени';
  const initial = (u.first_name || '👤')[0].toUpperCase();
  return '<div class="card"><div class="row" style="margin-bottom:10px"><div style="display:flex;gap:10px;align-items:center">' +
    '<div style="width:40px;height:40px;border-radius:50%;background:#232b38;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#4f8cff;overflow:hidden">' +
    (u.photo_url ? '<img src="' + esc(u.photo_url) + '" style="width:100%;height:100%;object-fit:cover">' : initial) +
    '</div><div><b>' + esc(name) + '</b><div class="muted">@' + esc(u.telegram_username||'—') + ' · ID ' + (u.telegram_id||'—') + '</div></div></div></div>' +
    '<div class="grid">' +
      '<div class="cell"><b>Покупок</b><span>' + (u.purchases_count||0) + '</span></div>' +
      '<div class="cell"><b>Условия</b><span>' + (u.agreed_terms ? '✅' : '❌') + '</span></div>' +
    '</div>' +
    '<div class="muted" style="margin:10px 0">📅 ' + fmtDate(u.registered_at) + '</div>' +
    '<button class="btn gray sm" onclick="writeUser(\'' + esc(u.telegram_username||'') + '\', ' + (u.telegram_id||0) + ')">💬 Написать</button></div>';
}

// ERAS — ГЛАВНОЕ
async function renderEras(){
  layout('<div class="loader">Загрузка товаров…</div>');
  try {
    const list = await api('/api/admin/eras');
    DATA.eras = list;
    layout(
      '<div class="row" style="margin-bottom:16px"><h2>🧩 Товары (' + list.length + ')</h2>' +
      '<button class="btn" onclick="createEra()">➕ Создать</button></div>' +
      (list.length ? list.map(eraCard).join('')
        : '<div class="empty"><div class="ic">📦</div><h3>Товаров нет</h3><button class="btn" style="margin-top:12px" onclick="createEra()">➕ Создать</button></div>')
    );
  } catch(e){
    layout('<div class="empty"><div class="ic">⚠️</div><h2>Ошибка</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="renderEras()">Повторить</button></div>');
  }
}

function eraCard(e){
  const roi = e.price > 0 ? Math.round((e.profit_amount / e.price) * 100) : 0;
  return '<div class="card"><div class="row" style="margin-bottom:10px"><div><b style="color:#4f8cff;font-size:15px">🧩 ' + esc(e.title) + '</b><div class="muted">ID #' + e.id + '</div></div>' +
    '<span class="badge ' + (e.is_active ? 'active' : 'cancelled') + '">' + (e.is_active ? '🟢 Активна' : '⚫ Отключена') + '</span></div>' +
    '<div class="grid">' +
      '<div class="cell"><b>Стоимость</b><span style="color:#4f8cff">' + fmt(e.price) + '</span></div>' +
      '<div class="cell"><b>Начисление</b><span style="color:#39d98a">+' + fmt(e.profit_amount) + '</span></div>' +
      '<div class="cell"><b>Итого</b><span style="color:#39d98a">' + fmt(e.price + e.profit_amount) + '</span></div>' +
      '<div class="cell"><b>Срок</b><span>' + e.duration_days + ' дн.</span></div>' +
      '<div class="cell"><b>ROI</b><span style="color:#39d98a">+' + roi + '%</span></div>' +
    '</div>' +
    (e.description ? '<div class="muted" style="margin:10px 0">' + esc(e.description) + '</div>' : '') +
    '<div>' +
      '<button class="btn sm" onclick="editEra(' + e.id + ')">✏️ Изменить</button>' +
      '<button class="btn gray sm" onclick="toggleEra(' + e.id + ',' + (e.is_active ? 0 : 1) + ')">' + (e.is_active ? '⚫ Отключить' : '🟢 Включить') + '</button>' +
      '<button class="btn red sm" onclick="deleteEra(' + e.id + ')">🗑 Удалить</button>' +
    '</div></div>';
}

function createEra(){
  const title = prompt('Название:', 'Новая эра');
  if (!title) return;
  const price = parseFloat(prompt('Стоимость (₽):', '1500')) || 0;
  const days = parseInt(prompt('Срок (дней):', '20')) || 20;
  const profit = parseFloat(prompt('Начисление (₽):', '1000')) || 0;
  const desc = prompt('Описание:', '') || '';

  if (!confirm('Создать эру?\n\n' + title + '\nСтоимость: ' + price + ' ₽\nСрок: ' + days + ' дн.\nНачисление: +' + profit + ' ₽\nИтого: ' + (price + profit) + ' ₽')) return;

  api('/api/admin/eras', {
    method:'POST',
    body: { title, price, duration_days: days, profit_amount: profit, description: desc, is_active: 1, sort_order: 99 }
  })
    .then(r => { toast('✅ Эра #' + r.id + ' создана'); renderEras(); })
    .catch(e => toast(e.message, 'err'));
}

function editEra(id){
  const e = (DATA.eras || []).find(x => x.id === id);
  if (!e) return;
  const title = prompt('Название:', e.title);
  if (!title) return;
  const price = parseFloat(prompt('Стоимость (₽):', e.price)) || 0;
  const days = parseInt(prompt('Срок (дней):', e.duration_days)) || 20;
  const profit = parseFloat(prompt('Начисление (₽):', e.profit_amount)) || 0;
  const desc = prompt('Описание:', e.description || '') || '';

  api('/api/admin/eras/' + id, {
    method:'PUT',
    body: { title, price, duration_days: days, profit_amount: profit, description: desc, is_active: e.is_active, sort_order: e.sort_order || id }
  })
    .then(() => { toast('💾 Сохранено'); renderEras(); })
    .catch(e => toast(e.message, 'err'));
}

async function toggleEra(id, newActive){
  const e = (DATA.eras || []).find(x => x.id === id);
  if (!e) return;
  try {
    await api('/api/admin/eras/' + id, {
      method:'PUT',
      body: { title: e.title, price: e.price, duration_days: e.duration_days,
        profit_amount: e.profit_amount, description: e.description || '',
        is_active: newActive, sort_order: e.sort_order || id }
    });
    toast(newActive ? '🟢 Включена' : '⚫ Отключена');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}

async function deleteEra(id){
  if (!confirm('Удалить эру #' + id + '?')) return;
  try {
    await api('/api/admin/eras/' + id, {method:'DELETE'});
    toast('🗑 Удалено');
    renderEras();
  } catch(e){ toast(e.message, 'err'); }
}

// HELPERS
function writeUser(username, tgId){
  let url;
  if (username) url = 'https://t.me/' + username;
  else if (tgId) url = 'tg://user?id=' + tgId;
  else return toast('Нет username');
  window.open(url, '_blank');
}

// MAIN
async function render(){
  if (!TOKEN){ renderLogin(); return; }
  try {
    const map = {
      dashboard: renderDashboard,
      purchases: renderPurchases,
      payouts: renderPayouts,
      users: renderUsers,
      eras: renderEras
    };
    await (map[TAB] || renderDashboard)();
  } catch(e){
    console.error(e);
    if (e.message === 'Unauthorized') return;
    toast(e.message, 'err');
  }
}

window.setTab = setTab;
window.doLogin = doLogin;
window.logout = logout;
window.renderDashboard = renderDashboard;
window.renderPurchases = renderPurchases;
window.renderPayouts = renderPayouts;
window.renderUsers = renderUsers;
window.renderEras = renderEras;
window.confirmPurchase = confirmPurchase;
window.cancelPurchase = cancelPurchase;
window.markPaid = markPaid;
window.cancelPayout = cancelPayout;
window.createEra = createEra;
window.editEra = editEra;
window.toggleEra = toggleEra;
window.deleteEra = deleteEra;
window.writeUser = writeUser;

render();
</script>
</body>
</html>
